function setOpnameLocation(v){ state.invLocation = v; render(); }
function setOpnameCount(itemId, v){ opnameDraft[itemId] = v; render(); }
async function submitOpname(warehouseId){
  const entries = Object.keys(opnameDraft).filter(id=>opnameDraft[id]!=='' && !isNaN(parseFloat(opnameDraft[id])));
  if(entries.length===0){ toast('No counted quantities entered.', true); return; }
  let posted = 0;
  for(const itemId of entries){
    const before = stockQty(warehouseId, itemId);
    const after = parseFloat(opnameDraft[itemId]);
    const delta = Math.round((after-before)*1000)/1000;
    if(delta===0) continue;
    try{ await actionAdjustment({warehouseId, itemId, delta, reason:'Stock Opname'}); posted++; }
    catch(e){ toast(e.message || 'Failed to post one of the adjustments.', true); }
  }
  opnameDraft = {};
  toast(posted + ' variance(s) posted as adjustments.');
  render();
}

function openItemDrawer(itemId){
  state.drawerItemId = itemId;
  renderDrawer();
  document.getElementById('drawerBackdrop').classList.add('open');
  document.getElementById('drawerBox').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawerBackdrop').classList.remove('open');
  document.getElementById('drawerBox').classList.remove('open');
  state.drawerItemId = null;
}
function getPriceHistory(itemId){
  const receipts = state.transactions.filter(t=>t.type==='in' && t.itemId===itemId && t.price>0).slice().sort((a,b)=> new Date(a.createdAt) - new Date(b.createdAt));
  const history = [];
  let lastPrice = null;
  receipts.forEach(t=>{
    if(lastPrice === null || t.price !== lastPrice){
      history.push({ price:t.price, prevPrice:lastPrice, createdAt:t.createdAt, docNumber:t.docNumber, changeType: lastPrice===null ? 'initial' : (t.price>lastPrice ? 'up' : 'down') });
      lastPrice = t.price;
    }
  });
  return history.reverse();
}
function renderDrawer(){
  const item = itemById(state.drawerItemId);
  const box = document.getElementById('drawerBox');
  if(!item){ box.innerHTML = ''; return; }
  // A scoped role (a division, or Kitchen Leader) must only ever see stock,
  // locations and movement for the warehouse(s) it's allowed into here too --
  // not just on the Inventory list, since this drawer opens from that list.
  const scope = allowedInventoryWarehouseIds(currentRole());
  const whsInScope = scope ? WAREHOUSES.filter(w=>scope.includes(w.id)) : WAREHOUSES;
  const stock = scope ? whsInScope.reduce((s,w)=> s + stockQty(w.id, item.id), 0) : totalStock(item.id);
  const price = item.lastPrice||0;
  const totalValue = stock * price;
  const reorder = item.reorderLevel || 0;
  let statusBadge = '';
  if(stock <= 0) statusBadge = '<span class="tag tag-rejected" style="margin-left:8px;">Habis</span>';
  else if(reorder > 0 && stock <= reorder) statusBadge = '<span class="tag tag-pending" style="margin-left:8px;">Rendah</span>';

  const locs = whsInScope.map(w=>({w, qty: stockQty(w.id, item.id)})).filter(x=>x.qty>0).sort((a,b)=>b.qty-a.qty);
  const priceHistory = getPriceHistory(item.id).slice(0,6);
  const moves = state.transactions.filter(t=>t.itemId===item.id && ['in','transfer','opname'].includes(t.type) && (!scope || scope.includes(t.toWarehouseId) || scope.includes(t.fromWarehouseId))).slice(0,10);

  box.innerHTML = `
    <div class="drawer-head">
      <div class="dh-top">
        <div><div class="drawer-title">${escapeHtml(item.name)}${statusBadge}</div><div class="drawer-sub">${escapeHtml(item.category||'—')} · ${escapeHtml(item.kode||'—')}</div></div>
        <button class="drawer-close" onclick="closeDrawer()">&times;</button>
      </div>
    </div>
    <div class="drawer-body">
      <div class="drawer-stats-2col">
        <div class="drawer-stat">
          <div class="drawer-stat-label">Total Stok</div>
          <div class="drawer-stat-value">${fmtNum(stock)} <span style="font-size:14px; font-weight:600; color:var(--text-secondary);">${escapeHtml(item.uom||'')}</span></div>
          ${smallUnitNote(stock, item)}
        </div>
        <div class="drawer-stat">
          <div class="drawer-stat-label">Total Nilai</div>
          <div class="drawer-stat-value gold" style="color:var(--gold);">${fmtIDR(totalValue)}</div>
        </div>
      </div>

      <div class="drawer-mini-stats">
        <div class="drawer-mini-stat"><div class="drawer-mini-stat-label">Harga Satuan</div><div class="drawer-mini-stat-value">${price ? fmtIDR(price) : '—'}</div></div>
        <div class="drawer-mini-stat"><div class="drawer-mini-stat-label">Satuan</div><div class="drawer-mini-stat-value">${escapeHtml(item.uom||'—')}</div></div>
        <div class="drawer-mini-stat"><div class="drawer-mini-stat-label">Reorder Level</div><div class="drawer-mini-stat-value">${fmtNum(reorder)}</div></div>
      </div>
      ${item.conversionQty > 1 && item.smallUnit && item.smallUnit !== item.uom ? `
        <div class="loc-row"><div class="lr-name">Konversi Satuan Kecil</div><div class="lr-val">1 ${escapeHtml(item.uom)} = ${fmtNum(item.conversionQty)} ${escapeHtml(item.smallUnit)}</div></div>
        <div class="loc-row"><div class="lr-name">Harga per ${escapeHtml(item.smallUnit)}</div><div class="lr-val">${fmtIDR(price/item.conversionQty)}</div></div>
      ` : ''}

      <div class="drawer-section-label">Lokasi (${locs.length})</div>
      ${locs.length===0 ? `<div class="cell-sub">Tidak ada stok di lokasi manapun.</div>` :
        locs.map(x=>{
          let breakdown = '';
          if(isStorageWarehouse(x.w.id)){
            const parts = PERUNTUKAN_OPTIONS.map(p=>({name:p.name, qty:stockQtyByPeruntukan(x.w.id, item.id, p.id)})).filter(p=>p.qty>0);
            if(parts.length>0) breakdown = `<div class="cell-sub" style="margin-top:1px;">${parts.map(p=>p.name+' '+fmtNum(p.qty)).join(' · ')}</div>`;
          }
          return `<div class="loc-row-rich">
            <div class="lrr-top"><div class="lrr-name">${x.w.name}</div><div class="lrr-qty">${fmtNum(x.qty)} ${escapeHtml(item.uom||'')}</div></div>
            <div style="display:flex; justify-content:space-between;">${breakdown || '<span></span>'}<div class="lrr-value">${fmtIDR(x.qty*price)}</div></div>
          </div>`;
        }).join('')}

      <div class="drawer-section-label">Riwayat Harga</div>
      ${priceHistory.length===0 ? `<div class="cell-sub">Belum ada riwayat harga.</div>` : priceHistory.map(h=>{
        if(h.changeType==='initial'){
          return `<div class="loc-row"><div class="lr-name">Harga awal · ${fmtRelative(h.createdAt)}</div><div class="lr-val">${fmtIDR(h.price)}</div></div>`;
        }
        const isUp = h.changeType==='up';
        const pct = h.prevPrice ? ((h.price-h.prevPrice)/h.prevPrice*100) : 0;
        const color = isUp ? 'var(--danger)' : 'var(--success)';
        return `<div class="loc-row-rich">
          <div class="lrr-top">
            <div class="lrr-name">${fmtRelative(h.createdAt)}${h.docNumber?' · '+h.docNumber:''}</div>
            <div class="lrr-qty" style="color:${color};">${isUp?'↑':'↓'} ${isUp?'+':''}${pct.toFixed(0)}%</div>
          </div>
          <div class="lrr-value" style="color:${color}; font-weight:700;">${fmtIDR(h.prevPrice)} → ${fmtIDR(h.price)}</div>
        </div>`;

      <div class="drawer-section-label">Aktivitas Terbaru</div>
      ${moves.length===0 ? `<div class="cell-sub">Belum ada aktivitas.</div>` : moves.map(t=>{
        const isIn = t.type==='in';

        const cls = isIn ? 'in' : (isOpname ? 'opname' : 'transfer');
        const detail = isIn
          ? escapeHtml(t.toWarehouseName||'') + (t.supplierName ? ' · ' + escapeHtml(t.supplierName) : '')
          : isOpname
            ? (t.note ? escapeHtml(t.note) : (t.toWarehouseName ? escapeHtml(t.toWarehouseName) : escapeHtml(t.fromWarehouseName||'')))
            : escapeHtml(t.fromWarehouseName||'') + ' → ' + escapeHtml(t.toWarehouseName||'');
        const openFn = isIn ? `openReceivingDetail('${t.docNumber}')` : (isOpname ? '' : `openTransferDetail('${t.docNumber}')`);
        const signed = isIn ? '+' : (isOpname ? (t.toWarehouseId ? '+' : '-') : '');
        return `<div class="drawer-activity-row ${openFn?'clickable':''}" ${openFn?`onclick="${openFn}"`:''}>
          <div class="da-dot ${cls}"></div>
          <div class="da-body">
            <div class="da-type ${cls}">${isIn?'Barang Masuk':(isOpname?'Stock Opname':'Transfer')} ${(!isOpname && t.docNumber)?'· '+t.docNumber:''}</div>
            <div class="da-detail">${detail} · ${fmtRelative(t.createdAt)}</div>
          </div>
          <div class="da-qty ${cls}">${signed}${fmtNum(t.qty)} ${escapeHtml(t.uom||'')}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function getFilteredItemsMaster(){
  let list = state.items;
  if(state.itemsSearch){ const q = state.itemsSearch.toLowerCase(); list = list.filter(i => (i.name||'').toLowerCase().includes(q) || (i.kode||'').toLowerCase().includes(q)); }
  if(state.itemsCategory) list = list.filter(i => i.category === state.itemsCategory);
  if(state.itemsPriceMin !== ''){ const min = parsePriceInput(state.itemsPriceMin); list = list.filter(i => (i.lastPrice||0) >= min); }
  if(state.itemsPriceMax !== ''){ const max = parsePriceInput(state.itemsPriceMax); list = list.filter(i => (i.lastPrice||0) <= max); }
  return list;
}

      'Harga per Satuan': i.lastPrice || 0,

      'Reorder Level': i.reorderLevel || 0,
    };
  });
  if(rows.length===0){ toast('Tidak ada barang untuk diekspor.', true); return; }

function toggleItemSelect(id){
  if(state.itemsSelected.has(id)) state.itemsSelected.delete(id); else state.itemsSelected.add(id);
  render();
}
function toggleSelectAllItemsOnPage(){
  const filtered = getFilteredItemsMaster();
  const pageSize = state.itemsPageSize;
  const pageItems = filtered.slice((state.itemsPage-1)*pageSize, (state.itemsPage-1)*pageSize + pageSize);
  const pageIds = pageItems.map(i=>i.id);
  const allSelected = pageIds.length>0 && pageIds.every(id=>state.itemsSelected.has(id));
  if(allSelected) pageIds.forEach(id=>state.itemsSelected.delete(id));
  else pageIds.forEach(id=>state.itemsSelected.add(id));
  render();
}
function clearItemSelection(){ state.itemsSelected.clear(); render(); }
function confirmBulkDeleteItems(){
  const ids = [...state.itemsSelected];
  if(ids.length===0) return;
  openConfirm('Hapus Barang Terpilih', `Hapus ${ids.length} barang yang dipilih dari master data? Barang yang masih memiliki stok akan dilewati. Tindakan ini tidak bisa dibatalkan.`, ()=>bulkDeleteSelectedItems(ids), 'Hapus Semua', true);
}
async function bulkDeleteSelectedItems(ids){
  let deleted = 0, skipped = 0;
  for(const id of ids){
    const item = itemById(id);
    if(!item){ skipped++; continue; }
    if(totalStock(id) > 0){ skipped++; continue; }
    try{ await db.doc('items/'+id).delete(); deleted++; }
    catch(e){ skipped++; }
  }
  state.itemsSelected.clear();
  toast(deleted + ' barang dihapus' + (skipped ? ', ' + skipped + ' dilewati (masih ada stok).' : '.'));
  render();
}
function confirmDeleteItem(itemId){
  const item = itemById(itemId);
  if(!item) return;
  if(totalStock(itemId) > 0){ toast('Tidak bisa dihapus — barang ini masih ada stoknya.', true); return; }
  openConfirm('Hapus Barang', `Hapus "${item.name}" dari master data? Tindakan ini tidak bisa dibatalkan.`, ()=>actionDeleteItem(itemId), 'Hapus', true);
}

/* =========================================================
   NILAI PER DIVISI — termasuk barang yang masih di Gudang Utama
   tapi sudah dialokasikan (peruntukan) untuk divisi tersebut
========================================================= */
/* Generic version of the divisi grouping above: given a way to read a direct
   warehouse's own value and a storage warehouse's value for one Peruntukan,
   returns the same {id,name,ownValue,allocatedValue,total} rows (unsorted,
   in WAREHOUSES order) plus the Mix Use total. Used both for live stock
   (getDivisiValueSummary below) and for a past finalized opname snapshot
   (Laporan Stock Opname reports further down), so both always agree on how
   a divisi's value is computed. */
function computeGroupValueBreakdown(ownValueFn, peruntukanValueFn){
  const rows = DIRECT_WAREHOUSES.map(w=>{
    const ownValue = ownValueFn(w.id);
    let allocatedValue = 0;
    STORAGE_WAREHOUSES.forEach(sw=>{ allocatedValue += peruntukanValueFn(sw.id, w.id); });
    return { id:w.id, name:w.name, ownValue, allocatedValue, total: ownValue + allocatedValue, hasOwnWarehouse:true };
  });
  let mixValue = 0;
  STORAGE_WAREHOUSES.forEach(sw=>{ mixValue += peruntukanValueFn(sw.id, 'mix'); });
  const totalValue = rows.reduce((s,r)=>s+r.total,0) + mixValue;
  return { rows, mixValue, totalValue };
}
function liveOwnValue(warehouseId){ return state.items.reduce((s,i)=> s + stockQty(warehouseId,i.id)*(i.lastPrice||0), 0); }
function livePeruntukanValue(storageWarehouseId, peruntukan){ return state.items.reduce((s,i)=> s + stockQtyByPeruntukan(storageWarehouseId,i.id,peruntukan)*(i.lastPrice||0), 0); }
function liveGroupValueBreakdown(){ return computeGroupValueBreakdown(liveOwnValue, livePeruntukanValue); }
function getDivisiValueSummary(){
  const b = liveGroupValueBreakdown();
  const rows = b.rows.slice().sort((a,c)=>c.total-a.total);
  return { rows, mixValue: b.mixValue };
}
function renderReportDivisi(){
  const { rows, mixValue } = getDivisiValueSummary();
  const grandTotal = rows.reduce((s,r)=>s+r.total,0) + mixValue;
  document.getElementById('content').innerHTML = `

            ${rows.map(r=>`
              <tr class="${r.hasOwnWarehouse?'clickable':''}" ${r.hasOwnWarehouse?`onclick="goto('inventory'); setInvLocation('${r.id}');"`:''}>
                <td class="cell-title">${escapeHtml(r.name)}${!r.hasOwnWarehouse?' <span class="cell-sub">(tanpa gudang sendiri)</span>':''}</td>
                <td class="num">${r.hasOwnWarehouse ? fmtIDR(r.ownValue) : '—'}</td>
                <td class="num">${fmtIDR(r.allocatedValue)}</td>
                <td class="num"><b>${fmtIDR(r.total)}</b></td>
              </tr>`).join('')}
            <tr>
              <td class="cell-title">Mix Use <span class="cell-sub">(belum teralokasi ke divisi manapun)</span></td>
              <td class="num">—</td>
              <td class="num">${fmtIDR(mixValue)}</td>
              <td class="num"><b>${fmtIDR(mixValue)}</b></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="lock-note">"Teralokasi di Gudang Utama" dihitung dari barang yang secara fisik masih ada di salah satu Gudang Utama, tapi sudah ditandai Peruntukannya untuk divisi/keperluan ini saat Penerimaan Barang.</div>
  `;
}

/* =========================================================
   LAPORAN STOCK OPNAME (4 tipe laporan)
   1) Stock Opname            -- nilai stok per lokasi, per divisi, per item
   2) Nilai Penggunaan per Divisi -- Opening + Purchase - Closing = Usage
   3) Food & Beverage Cost    -- Purchase Kitchen/Bar vs Net Sales manual
   4) KPI Ideal Stock         -- tren %Stok vs Net Sales antar bulan

   Semua memakai pengelompokan divisi yang sama dengan getDivisiValueSummary
   (computeGroupValueBreakdown di atas): 7 Gudang Divisi (DIRECT_WAREHOUSES)
   + Mix Use. groupValues didenormalisasi ke opnameSessions saat finalisasi
   (lihat actionFinalizeOpname) supaya laporan ini tidak perlu scan ulang
   seluruh opnameDetails setiap render.
========================================================= */
function groupValuesToMap(breakdown){
  const map = {};
  breakdown.rows.forEach(r=>{ map[r.id] = { ownValue:r.ownValue, allocatedValue:r.allocatedValue, total:r.total }; });
  map.mix = { total: breakdown.mixValue };
  map.totalValueAllGroups = breakdown.totalValue;
  return map;
}
async function computeGroupValuesFromOpnameDetails(periodKey){
  const details = {};
  for(const w of WAREHOUSES){
    try{
      const snap = await db.doc('opnameDetails/' + periodKey + '__' + w.id).get();
      if(snap && snap.exists) details[w.id] = snap.data();
    }catch(e){ /* no saved detail for this location */ }
  }
  const ownValueFn = whId => (details[whId] && details[whId].totalValue) || 0;
  const peruntukanValueFn = (swId, per) => (details[swId] && details[swId].peruntukanValues && details[swId].peruntukanValues[per]) || 0;
  return groupValuesToMap(computeGroupValueBreakdown(ownValueFn, peruntukanValueFn));
}
const REPORT_OPNAME_GROUPS = [...DIRECT_WAREHOUSES.map(w=>({id:w.id, name:w.name})), {id:'mix', name:'Mix Use'}];
function opnameSessionFor(periodKey){ return state.opnameSessions.find(s=>s.periodKey===periodKey && s.status==='selesai') || null; }
function priorPeriodKey(periodKey){
  const [y,m] = periodKey.split('-').map(Number);
  const py = m===1 ? y-1 : y, pm = m===1 ? 12 : m-1;
  return py + '-' + String(pm).padStart(2,'0');
}
/* Closing value per divisi "as of" the end of a period: live stock if the
   period is the current month, otherwise that period's finalized opname
   snapshot -- or null if no finalized snapshot exists for it (never guessed). */
function groupValuesMapForPeriod(periodKey){
  if(periodKey === currentPeriodKey()) return groupValuesToMap(liveGroupValueBreakdown());
  const session = opnameSessionFor(periodKey);
  return (session && session.groupValues) ? session.groupValues : null;
}
function monthlyNetSalesFor(periodKey){ return (state.monthlyNetSales||[]).find(d=>d.period===periodKey) || null; }
function periodBoundsIso(periodKey){
  const [y,m] = periodKey.split('-').map(Number);
  const start = new Date(Date.UTC(y, m-1, 1)).toISOString();
  const end = new Date(Date.UTC(m===12?y+1:y, m===12?0:m, 1)).toISOString();
  return { start, end };
}
/* Purchase per divisi for a period -- sums type:'in' transactions (the exact
   schema actionReceivingDoc writes) within [start,end), bucketed the same
   way stock is bucketed: a direct warehouse's own receipts belong to that
   warehouse's divisi; a Gudang Utama receipt belongs to whatever Peruntukan
   it was tagged with (untagged/'mix' legacy receipts fall into Mix Use,
   same convention as rebuildStockIndex). Not kept in `state` (transactions
   there is capped at 500 most-recent), so it is fetched on demand and
   cached per period in state.reportOpname.purchaseCache. */
async function loadPurchasesForPeriod(periodKey){
  if(!db) return;
  state.reportOpname.loadingPurchase = true; render();
  const purchaseByGroup = {}; REPORT_OPNAME_GROUPS.forEach(g=>{ purchaseByGroup[g.id] = 0; });
  try{
    const { start, end } = periodBoundsIso(periodKey);
    const snap = await db.collection('transactions').where('type','==','in').where('createdAt','>=',start).where('createdAt','<',end).get();
    const docs = (snap && snap.docs) || [];
    docs.forEach(d=>{
      const tx = d.data();
      const val = (tx.totalValue!=null) ? tx.totalValue : (tx.qty||0)*(tx.price||0);
      let groupId;
      if(isStorageWarehouse(tx.toWarehouseId)){
        const per = tx.peruntukan || 'mix';
        groupId = (per==='mix') ? 'mix' : per;
      } else {
        groupId = tx.toWarehouseId;
      }
      if(purchaseByGroup[groupId]===undefined) purchaseByGroup[groupId] = 0;
      purchaseByGroup[groupId] += val;
    });
  }catch(e){
    toast('Gagal memuat data pembelian periode ini.', true);
  }
  state.reportOpname.purchaseCache[periodKey] = purchaseByGroup;
  state.reportOpname.loadingPurchase = false;
  render();
}
async function loadHistOpnameDetail(periodKey){
  if(!db) return;
  state.reportOpname.loadingHist = true; render();
  const details = {};
  for(const w of WAREHOUSES){
    try{ const snap = await db.doc('opnameDetails/' + periodKey + '__' + w.id).get(); if(snap && snap.exists) details[w.id] = snap.data(); }catch(e){}
  }
  state.reportOpname.histCache[periodKey] = details;
  state.reportOpname.loadingHist = false;
  render();
}
/* Report 2/3 (Nilai Penggunaan per Divisi, Food & Beverage Cost) share the
   same "Periode" state and, like Report 1, are reports of locked data --
   so the dropdown only ever lists periods with a finalized Stock Opname,
   never the running (unlocked) current month or months with no data. */
function finalizedOpnamePeriodOptions(){
  return state.opnameSessions.filter(s=>s.status==='selesai').map(s=>s.periodKey).sort();
}
function correctReportOpnamePeriod(){
  const finalizedPeriods = finalizedOpnamePeriodOptions();
  if(!state.reportOpname.period || !finalizedPeriods.includes(state.reportOpname.period)){
    state.reportOpname.period = finalizedPeriods.length ? finalizedPeriods[finalizedPeriods.length-1] : '';
  }
  return finalizedPeriods;
}
function setReportOpnameTab(t){
  state.reportOpname.tab = t;
  if(t==='r2'||t==='r3'){
    correctReportOpnamePeriod();
    if(state.reportOpname.period && !state.reportOpname.purchaseCache[state.reportOpname.period] && !state.reportOpname.loadingPurchase) loadPurchasesForPeriod(state.reportOpname.period);
  }
  render();
}
function setReportOpnameAsOf(v){
  state.reportOpname.asOf = v;
  if(!state.reportOpname.histCache[v] && !state.reportOpname.loadingHist) loadHistOpnameDetail(v);
  render();
}
function setReportOpnamePeriod(v){
  state.reportOpname.period = v;
  if(!state.reportOpname.purchaseCache[v] && !state.reportOpname.loadingPurchase) loadPurchasesForPeriod(v);
  render();
}

/* ---- Report 1: Stock Opname (item-level, per divisi) ---- */
function buildOpnameReport1Groups(rowsForDirect, rowsForStorage){
  const groups = DIRECT_WAREHOUSES.map(w=>({id:w.id, name:w.name, rows:[]}));
  const groupById = {}; groups.forEach(g=>{ groupById[g.id]=g; });
  const mixGroup = { id:'mix', name:'Mix Use', rows:[] };
  // locOrder groups rows within a divisi by where they physically sit --
  // Gudang Utama (main storage, allocated to this divisi) listed before the
  // divisi's own warehouse -- per feedback, so the report reads as one block
  // per location instead of jumping between locations as it follows the
  // alphabetical item order.
  DIRECT_WAREHOUSES.forEach(w=>{
    rowsForDirect(w.id).forEach(r=>{
      groupById[w.id].rows.push({ ...r, penyimpanan: w.name, locOrder:1, jumlah: r.qty*(r.price||0) });
    });
  });
  STORAGE_WAREHOUSES.forEach(sw=>{
    rowsForStorage(sw.id).forEach(r=>{
      PERUNTUKAN_OPTIONS.forEach(p=>{
        const qty = (r.peruntukanQty && r.peruntukanQty[p.id]) || 0;
        if(qty > 0.0001){
          const target = p.id==='mix' ? mixGroup : groupById[p.id];
          if(target) target.rows.push({ itemId:r.itemId, name:r.name, category:r.category, uom:r.uom, qty, price:r.price, penyimpanan: sw.name, locOrder:0, jumlah: qty*(r.price||0) });
        }
      });
    });
  });
  const all = [...groups, mixGroup].filter(g=>g.rows.length>0);
  all.forEach(g=>{
    g.rows.sort((a,b)=> a.locOrder-b.locOrder || (a.penyimpanan||'').localeCompare(b.penyimpanan||'') || (a.category||'').localeCompare(b.category||'') || (a.name||'').localeCompare(b.name||''));
    g.rows.forEach((r,i)=>{ r.no = i+1; });
    g.subtotal = g.rows.reduce((s,r)=>s+r.jumlah,0);
  });
  return all;
}
/* Re-sorts a Report 1 group's rows by a clicked column (state.reportOpname.r1Sort),
   without losing the per-divisi grouping or subtotal. 'default' restores the
   built-in main-storage-first ordering set by buildOpnameReport1Groups. */
function sortReport1Rows(rows, sort){
  if(!sort || sort.field==='default') return rows;
  const dir = sort.dir==='desc' ? -1 : 1;
  const key = r => {
    switch(sort.field){
      case 'name': return (r.name||'').toLowerCase();
      case 'category': return (r.category||'').toLowerCase();
      case 'penyimpanan': return (r.penyimpanan||'').toLowerCase();
      case 'qty': return opnameSmallDisplay(itemById(r.itemId), r.qty).qty;
      case 'unit': return opnameSmallDisplay(itemById(r.itemId), r.qty).unit.toLowerCase();
      case 'unitPrice': return opnameSmallDisplay(itemById(r.itemId), r.qty).unitPrice;
      case 'jumlah': return r.jumlah;
      default: return 0;
    }
  };
  return rows.slice().sort((a,b)=>{
    const ka = key(a), kb = key(b);
    if(ka < kb) return -1*dir;
    if(ka > kb) return 1*dir;
    return 0;
  });
}
function setReport1Sort(field){
  const cur = state.reportOpname.r1Sort || {field:'default', dir:'asc'};
  state.reportOpname.r1Sort = (cur.field===field) ? {field, dir: cur.dir==='asc'?'desc':'asc'} : {field, dir:'asc'};
  render();
}
function setReport1Search(v){ state.reportOpname.r1Search = v; render(); }
function setReport1Category(v){ state.reportOpname.r1Category = v; render(); }
function setReport1Location(v){ state.reportOpname.r1Location = v; render(); }
function resetReport1Filters(){ state.reportOpname.r1Search=''; state.reportOpname.r1Category=''; state.reportOpname.r1Location=''; render(); }
function filterReport1Groups(groups){
  const q = (state.reportOpname.r1Search||'').trim().toLowerCase();
  const category = state.reportOpname.r1Category||'';
  const location = state.reportOpname.r1Location||'';
  if(!q && !category && !location) return groups;
  return groups.map(g=>({ ...g, rows: g.rows.filter(r=>
      (!q || (r.name||'').toLowerCase().includes(q) || (r.category||'').toLowerCase().includes(q) || (r.penyimpanan||'').toLowerCase().includes(q))
      && (!category || r.category===category)
      && (!location || r.penyimpanan===location)
    ) }))
    .filter(g=>g.rows.length>0)
    .map(g=>({ ...g, subtotal: g.rows.reduce((s,r)=>s+r.jumlah,0) }));
}
function liveReport1Groups(){
  const direct = whId => state.items.filter(i=>stockQty(whId,i.id)>0.0001).map(i=>({ itemId:i.id, name:i.name, category:i.category, uom:i.uom, qty:stockQty(whId,i.id), price:i.lastPrice||0 }));
  const storage = swId => state.items.map(i=>{
    const perQty = {};
    PERUNTUKAN_OPTIONS.forEach(p=>{ perQty[p.id] = stockQtyByPeruntukan(swId,i.id,p.id); });
    return { itemId:i.id, name:i.name, category:i.category, uom:i.uom, peruntukanQty:perQty, price:i.lastPrice||0 };
  });
  return buildOpnameReport1Groups(direct, storage);
}
function historicalReport1Groups(periodKey){
  const details = state.reportOpname.histCache[periodKey];
  if(!details) return null;
  const direct = whId => {
    const d = details[whId];
    if(!d || !d.items) return [];
    return d.items.map(it=>{
      const master = itemById(it.itemId);
      return { itemId: it.itemId, name: it.itemName, category: (master&&master.category)||'—', uom: it.uom, qty: it.physicalQty, price: it.price||0 };
    });
  };
  const storage = swId => {
    const d = details[swId];
    if(!d || !d.items) return [];
    return d.items.map(it=>{
      const master = itemById(it.itemId);
      /* older opnameDetails saved before peruntukanQty existed: treat the
         whole counted quantity as Mix Use rather than guessing an allocation. */
      const peruntukanQty = it.peruntukanQty || { mix: it.physicalQty };
      return { itemId: it.itemId, name: it.itemName, category: (master&&master.category)||'—', uom: it.uom, peruntukanQty, price: it.price||0 };
    });
  };
  return buildOpnameReport1Groups(direct, storage);
}

/* ---- Report 2: Nilai Penggunaan per Divisi ---- */
function report2Rows(periodKey){
  const closingMap = groupValuesMapForPeriod(periodKey);
  const openingMap = groupValuesMapForPeriod(priorPeriodKey(periodKey));
  const purchaseMap = state.reportOpname.purchaseCache[periodKey] || null;
  return REPORT_OPNAME_GROUPS.map(g=>{
    const closing = closingMap ? ((closingMap[g.id]&&closingMap[g.id].total)||0) : null;
    const opening = openingMap ? ((openingMap[g.id]&&openingMap[g.id].total)||0) : null;
    const purchase = purchaseMap ? (purchaseMap[g.id]||0) : null;
    const usage = (opening!=null && purchase!=null && closing!=null) ? (opening + purchase - closing) : null;
    return { id:g.id, name:g.name, opening, purchase, closing, usage };
  });
}

/* ---- Report 4: KPI Ideal Stock ---- */
function report4Data(){
  const sessions = state.opnameSessions.filter(s=>s.status==='selesai' && s.groupValues).sort((a,b)=>a.periodKey.localeCompare(b.periodKey));
  return sessions.map(s=>{
    const ns = monthlyNetSalesFor(s.periodKey);
    const hasNs = !!(ns && (ns.netSalesFood || ns.netSalesBeverage));
    const netSales = hasNs ? (Number(ns.netSalesFood||0) + Number(ns.netSalesBeverage||0)) : 0;
    const totalStock = s.totalValue || s.groupValues.totalValueAllGroups || 0;
    const pct = hasNs ? (totalStock/netSales*100) : null;
    return { periodKey: s.periodKey, totalStock, netSales, hasNs, pct, groupValues: s.groupValues };
  });
}

  let docs = groupByDocNumber(state.transactions.filter(t=>t.type==='in'));

    const q = state.reportKeluarSearch.toLowerCase();
    lines = lines.filter(l => (l.docNumber||'').toLowerCase().includes(q) || (l.requestDocNumber||'').toLowerCase().includes(q) || (l.itemName||'').toLowerCase().includes(q));
  }
  lines = lines.filter(l => inDateRange(l.createdAt, state.reportKeluarDateFrom, state.reportKeluarDateTo));
  lines = lines.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  const pageSize = state.reportKeluarPageSize;
  const totalPages = Math.max(1, Math.ceil(lines.length / pageSize));
  if(state.reportKeluarPage > totalPages) state.reportKeluarPage = totalPages;
  if(state.reportKeluarPage < 1) state.reportKeluarPage = 1;
  const pageLines = lines.slice((state.reportKeluarPage-1)*pageSize, (state.reportKeluarPage-1)*pageSize + pageSize);
  const totalNilai = lines.reduce((s,l)=>s+(l.totalValue||0),0);

  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-head"><h3>Laporan Barang Bergerak</h3><span class="panel-total">Total: <b>${fmtIDR(totalNilai)}</b></span></div>
      <div class="filter-row">
        <select onchange="setReportKeluarLocation(this.value)"><option value="">Semua Lokasi</option>${WAREHOUSES.map(w=>`<option value="${w.id}" ${state.reportKeluarLocation===w.id?'selected':''}>${w.name}</option>`).join('')}</select>
      </div>
      <div class="filter-row">
        ${searchDateFilterHtml({placeholder:'Cari No. Transfer, No. SR, atau barang…', search:state.reportKeluarSearch, dateFrom:state.reportKeluarDateFrom, dateTo:state.reportKeluarDateTo, onSearch:'setReportKeluarSearch', onDateFrom:'setReportKeluarDateFrom', onDateTo:'setReportKeluarDateTo', onReset:'resetReportKeluarFilters'})}
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Tanggal</th><th>No. Transfer</th><th>No. SR</th><th>Dari</th><th>Ke</th><th>Barang</th><th class="num">Jumlah</th><th class="num">Nilai</th></tr></thead>
          <tbody>
            ${pageLines.length===0 ? `<tr class="empty-row"><td colspan="8">Tidak ada barang bergerak yang cocok.</td></tr>` :
              pageLines.map(l=>`<tr><td>${fmtDate(l.createdAt)}</td><td class="code-mono">${l.docNumber||'—'}</td><td class="code-mono">${l.requestDocNumber||'—'}</td><td>${escapeHtml(l.fromWarehouseName)}</td><td class="cell-title">${escapeHtml(l.toWarehouseName)}</td><td>${escapeHtml(l.itemName)}</td><td class="num">${qtyWithSmallNote(l.qty, itemById(l.itemId), l.uom)}</td><td class="num">${fmtIDR(l.totalValue||0)}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${paginationHtml(state.reportKeluarPage, totalPages, lines.length, pageSize, 'setReportKeluarPage', 'baris')}
    </div>
  `;
}

/* =========================================================
   LAPORAN PENCATATAN WIP -- rekap frekuensi Permintaan WIP
   Hanya menghitung dokumen berstatus 'disetujui' (baru "tercatat" setelah
   lolos Kitchen Leader + Receiving, lihat actionApproveWip). Murni bacaan
   dari transactions type:'wiprequest' -- tidak pernah menyentuh
   stock/opname, sama seperti fitur Permintaan WIP itu sendiri.
========================================================= */
function setReportWipSearch(v){ state.reportWipSearch = v; state.reportWipPage = 1; render(); }
function setReportWipDateFrom(v){ state.reportWipDateFrom = v; state.reportWipPage = 1; render(); }
function setReportWipDateTo(v){ state.reportWipDateTo = v; state.reportWipPage = 1; render(); }
function setReportWipPage(p){ state.reportWipPage = p; render(); }
function resetReportWipFilters(){ state.reportWipSearch=''; state.reportWipDateFrom=''; state.reportWipDateTo=''; state.reportWipPage=1; render(); }
function renderReportWip(){
  const role = currentRole();
  let docs = groupByDocNumber(state.transactions.filter(t=>t.type==='wiprequest' && t.status==='disetujui')).filter(d=>canSeeSRForDivision(role, d.lines[0].divisionId));
  if(state.reportWipSearch){
    const q = state.reportWipSearch.toLowerCase();
    docs = docs.filter(d => d.docNumber.toLowerCase().includes(q) || d.lines.some(l=>(l.itemName||'').toLowerCase().includes(q)) || (d.lines[0].divisionName||'').toLowerCase().includes(q));
  }
  docs = docs.filter(d => inDateRange(d.createdAt, state.reportWipDateFrom, state.reportWipDateTo));

  const itemStats = {}, divisiStats = {};
  docs.forEach(d=>{
    const first = d.lines[0];
    const dv = divisiStats[first.divisionId] || (divisiStats[first.divisionId] = {name:first.divisionName||'—', count:0});
    dv.count += 1;
    d.lines.forEach(l=>{
      const it = itemStats[l.itemId] || (itemStats[l.itemId] = {name:l.itemName, uom:l.uom, count:0, qty:0});
      it.count += 1;
      it.qty += (l.qty||0);
    });
  });
  const itemRows = Object.values(itemStats).sort((a,b)=>b.count-a.count);
  const divisiRows = Object.values(divisiStats).sort((a,b)=>b.count-a.count);
  const maxItemCount = Math.max(1, ...itemRows.map(r=>r.count));
  const maxDivisiCount = Math.max(1, ...divisiRows.map(r=>r.count));

  const pageSize = state.reportWipPageSize;
  const totalPages = Math.max(1, Math.ceil(docs.length / pageSize));
  if(state.reportWipPage > totalPages) state.reportWipPage = totalPages;
  if(state.reportWipPage < 1) state.reportWipPage = 1;
  const pageDocs = docs.slice((state.reportWipPage-1)*pageSize, (state.reportWipPage-1)*pageSize + pageSize);

  document.getElementById('content').innerHTML = `
    <div class="lock-note">Rekap ini hanya menghitung Permintaan WIP yang sudah <b>tercatat</b> (disetujui Kitchen Leader &amp; Receiving). Murni untuk melacak frekuensi — tidak berkaitan dengan stok/inventory atau Stock Opname.</div>
    <div class="panel">
      <div class="panel-head"><h3>Laporan Pencatatan WIP</h3><span class="panel-total">Total Tercatat: <b>${docs.length}</b></span></div>
      <div class="filter-row">
        ${searchDateFilterHtml({placeholder:'Cari No. Permintaan, barang, atau divisi…', search:state.reportWipSearch, dateFrom:state.reportWipDateFrom, dateTo:state.reportWipDateTo, onSearch:'setReportWipSearch', onDateFrom:'setReportWipDateFrom', onDateTo:'setReportWipDateTo', onReset:'resetReportWipFilters'})}
      </div>
      <div class="two-col-grid" style="padding:14px 16px;">
        <div>
          <div class="dash-split-label" style="padding:0 0 8px;">Barang WIP Paling Sering Diminta</div>
          ${itemRows.length===0 ? `<div class="cell-sub">Belum ada Permintaan WIP yang tercatat pada rentang ini.</div>` :
            itemRows.slice(0,10).map(r=>{
              const pct = (r.count/maxItemCount)*100;
              return `<div class="locsum-row">
                <div class="ln-name" style="width:auto; flex:1;">${escapeHtml(r.name)}</div>
                <div class="ln-value" style="width:auto; flex-shrink:0; margin-right:8px;">${r.count}x · ${fmtNum(r.qty)} ${escapeHtml(r.uom||'')}</div>
                <div class="ln-track" style="flex:0 0 70px; width:70px;"><div class="ln-fill" style="width:${Math.max(4,pct)}%;"></div></div>
              </div>`;
            }).join('')}
        </div>
        <div>
          <div class="dash-split-label" style="padding:0 0 8px;">Divisi Paling Sering Terlibat</div>
          ${divisiRows.length===0 ? `<div class="cell-sub">Belum ada Permintaan WIP yang tercatat pada rentang ini.</div>` :
            divisiRows.map(r=>{
              const pct = (r.count/maxDivisiCount)*100;
              return `<div class="locsum-row">
                <div class="ln-name" style="width:auto; flex:1;">${escapeHtml(r.name)}</div>
                <div class="ln-value" style="width:auto; flex-shrink:0; margin-right:8px;">${r.count}x</div>
                <div class="ln-track" style="flex:0 0 70px; width:70px;"><div class="ln-fill" style="width:${Math.max(4,pct)}%;"></div></div>
              </div>`;
            }).join('')}
        </div>
      </div>
      <div class="dash-split-label" style="padding:14px 16px 0;">Riwayat Permintaan WIP Tercatat</div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>No. Permintaan</th><th>Tanggal</th><th>Divisi</th><th>Barang</th><th class="num">Jumlah Baris</th></tr></thead>
          <tbody>
            ${pageDocs.length===0 ? `<tr class="empty-row"><td colspan="5">Tidak ada Permintaan WIP tercatat yang cocok.</td></tr>` :
              pageDocs.map(d=>{
                const first = d.lines[0];
                return `<tr class="clickable" onclick="openWipDetail('${d.docNumber}')">
                  <td class="code-mono">${d.docNumber}</td>
                  <td>${fmtDate(d.createdAt)}</td>
                  <td class="cell-title">${escapeHtml(first.divisionName||'—')}</td>
                  <td>${d.lines.map(l=>escapeHtml(l.itemName)).join(', ')}</td>
                  <td class="num">${d.lines.length}</td>
                </tr>`;
              }).join('')}
          </tbody>
        </table>
      </div>
      ${paginationHtml(state.reportWipPage, totalPages, docs.length, pageSize, 'setReportWipPage', 'permintaan')}
    </div>
  `;
}

function getSettingsAccountRows(){
  const byUsername = {};
  BASE_ACCOUNTS.forEach(a=>{
    const roleDef = ROLES.find(r=>r.id===a.roleId);
    byUsername[a.username] = { username:a.username, roleId:a.roleId, roleName: roleDef?roleDef.name:a.roleId, group: roleDef?roleDef.group:'', isCustom:false };
  });
  (state.customUsers||[]).forEach(u=>{
    if(byUsername[u.username]) return; // password override on a built-in account, not a separate row
    const roleDef = ROLES.find(r=>r.id===u.roleId);
    byUsername[u.username] = { username:u.username, roleId:u.roleId, roleName: roleDef?roleDef.name:u.roleId, group: roleDef?roleDef.group:'', isCustom:true };
  });
  return Object.values(byUsername).sort((a,b)=> a.username.localeCompare(b.username));

/* ---------- Kelola User (Master only) ---------- */
function openAddUserModal(){
  if(currentRole().kind!=='master') return;
  const body = `
    <div id="userError"></div>
    <div class="field"><label>Username</label><input type="text" id="newUserUsername" placeholder="cth. bar2" autocomplete="off"></div>
    ${passwordFieldHtml('newUserPassword', 'Password', {autocomplete:'new-password', placeholder:'Minimal 4 karakter'})}
    <div class="field"><label>Role / Divisi</label><select id="newUserRole">${roleSelectOptionsHtml('')}</select></div>
  `;
  const foot = `<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="submitAddUser()">Tambah User</button>`;
  openModal('Tambah User', body, foot);
}
async function submitAddUser(){
  if(currentRole().kind!=='master') return;
  const username = document.getElementById('newUserUsername').value.trim().toLowerCase();
  const password = document.getElementById('newUserPassword').value;
  const roleId = document.getElementById('newUserRole').value;
  const err = document.getElementById('userError');
  if(!/^[a-z0-9_]{3,20}$/.test(username)){ err.innerHTML = errBox('Username 3-20 karakter: huruf kecil, angka, atau underscore.'); return; }
  if(!password || password.length<4){ err.innerHTML = errBox('Password minimal 4 karakter.'); return; }
  if(findAccountByUsername(username)){ err.innerHTML = errBox('Username sudah dipakai.'); return; }
  await submitGuarded(err, async ()=>{
    await db.doc('users/'+username).set({ username, password, roleId, createdAt: new Date().toISOString() });
    toast('User baru ditambahkan.');
  });
}
function openChangePasswordModal(username, roleId){
  if(currentRole().kind!=='master') return;
  const body = `
    <div id="userError"></div>
    <div class="lock-note">Mengubah password untuk <b>${escapeHtml(username)}</b>.</div>
    ${passwordFieldHtml('changeUserPassword', 'Password Baru', {autocomplete:'new-password', placeholder:'Minimal 4 karakter'})}
  `;
  const foot = `<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="submitChangePassword('${username}','${roleId}')">Simpan</button>`;
  openModal('Ubah Password', body, foot);
}
async function submitChangePassword(username, roleId){
  if(currentRole().kind!=='master') return;
  const password = document.getElementById('changeUserPassword').value;
  const err = document.getElementById('userError');
  if(!password || password.length<4){ err.innerHTML = errBox('Password minimal 4 karakter.'); return; }
  await submitGuarded(err, async ()=>{
    const existing = (state.customUsers||[]).find(x=>x.username===username);
    await db.doc('users/'+username).set({ username, password, roleId, createdAt: existing ? existing.createdAt : new Date().toISOString() });
    toast('Password diperbarui.');
  });
}
function confirmDeleteUser(username){
  if(currentRole().kind!=='master') return;
  if(username===authedUsername){ toast('Anda tidak dapat menghapus akun yang sedang digunakan.', true); return; }
  openConfirm('Hapus User', 'Hapus akun "'+username+'"? Aksi ini tidak dapat dibatalkan.', ()=>actionDeleteUser(username), 'Hapus', true);
}
async function actionDeleteUser(username){
  if(currentRole().kind!=='master') return;
  await db.doc('users/'+username).delete();
  toast('User dihapus.');
}

/* =========================================================
   MODAL CORE
========================================================= */
function openModal(title, bodyHtml, footHtml, wide){
  const box = document.getElementById('modalBox');
  box.classList.toggle('wide', !!wide);
  box.innerHTML = `
    <div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot">${footHtml}</div>
  `;
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); }
document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
function errBox(msg){ return `<div class="form-error">${msg}</div>`; }
async function submitGuarded(errEl, fn){
  showLoading();
  try{ await fn(); closeModal(); }
  catch(e){ errEl.innerHTML = errBox(e && e.message ? e.message : 'Something went wrong, please try again.'); }
  finally{ hideLoading(); }
}
let _confirmCallback = null;
function openConfirm(title, message, callback, confirmLabel, danger){
  _confirmCallback = callback;
  const body = `<p style="margin:0; font-size:13px; color:var(--text-secondary); line-height:1.5;">${escapeHtml(message)}</p>`;
  const foot = `<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn ${danger?'btn-danger':'btn-primary'}" onclick="runConfirm()">${escapeHtml(confirmLabel||'Lanjutkan')}</button>`;
  openModal(title, body, foot);
}
function runConfirm(){
  const cb = _confirmCallback; _confirmCallback = null; closeModal();
  if(cb){
    showLoading();
    Promise.resolve(cb()).finally(hideLoading);
  }
}

function priceCalcHtml(prefix, uomLabel){
  return `<button type="button" class="mini-link-btn" onclick="togglePriceCalc('${prefix}')">Hitung dari harga borongan</button>
    <div id="${prefix}PriceCalc" class="price-calc-box" style="display:none;">
      <div class="two-col">
        <div class="field"><label>Harga Total Dibayar</label><input type="text" inputmode="numeric" id="${prefix}BulkPrice" placeholder="cth. 10.000" oninput="formatPriceInput(this); updatePriceCalc('${prefix}')"></div>
        <div class="field"><label>Untuk Jumlah${uomLabel?' ('+escapeHtml(uomLabel)+')':''}</label><input type="number" id="${prefix}BulkQty" inputmode="decimal" min="0" step="any" placeholder="cth. 100" oninput="updatePriceCalc('${prefix}')"></div>
      </div>
      <div class="stock-hint" id="${prefix}BulkResult"></div>
    </div>`;
}
function togglePriceCalc(prefix){ const el = document.getElementById(prefix+'PriceCalc'); if(el) el.style.display = (el.style.display==='none') ? 'block' : 'none'; }
function updatePriceCalc(prefix){
  const bulkPrice = parsePriceInput(document.getElementById(prefix+'BulkPrice').value);
  const bulkQty = parseFloat(document.getElementById(prefix+'BulkQty').value);
  const resultEl = document.getElementById(prefix+'BulkResult');
  const target = document.getElementById(prefix+'Price');
  if(bulkPrice>0 && bulkQty>0){
    const perUnit = Math.round(bulkPrice / bulkQty);
    resultEl.innerHTML = 'Harga per satuan: <b>' + fmtIDR(perUnit) + '</b>';
    if(target) target.value = perUnit.toLocaleString('id-ID');
  } else { resultEl.innerHTML = ''; }
}

let grAttachmentFile = null;

function grAddLine(){

}
function grUpdateLine(idx, field, value){

    const existing = itemByNameLookup(value);
    if(existing){
      receivingLines[idx].uom = existing.uom;
      receivingLines[idx].category = existing.category;
      if(existing.lastPrice) receivingLines[idx].price = existing.lastPrice;

  }

}
function grOnItemNameInput(idx, value){

    if(uomSel){ uomSel.style.display = ''; uomSel.value = receivingLines[idx].uom || 'pcs'; }

}
function grRenderCombo(idx, query){

  if(matches.length===0){ box.style.display='none'; box.innerHTML=''; return; }

function grPickCombo(idx, itemId){

  receivingLines[idx].uom = item.uom;
  receivingLines[idx].category = item.category;

function grCloseCombo(idx){

}
function grRemoveLine(idx){
  receivingLines.splice(idx,1);

function grUpdateLineLocation(idx, locationId){

}
function grRenderLines(){
  const box = document.getElementById('grLinesBox');
  if(!box) return;
  const cols = '1.4fr .55fr .65fr .75fr 1fr 1fr auto';
  const header = `<div style="display:grid; grid-template-columns: ${cols}; gap:6px; margin-bottom:4px;">
    <span></span><span></span><span></span><span></span>
    <span class="cell-sub" style="font-weight:700;">Lokasi Tujuan</span>
    <span class="cell-sub" style="font-weight:700;">Peruntukan</span>

function grUpdateTotal(){
  const total = receivingLines.reduce((s,l)=> s + (parseFloat(l.qty)||0)*(parsePriceInput(l.price)||0), 0);
  const el = document.getElementById('grTotalHint');
  if(el) el.innerHTML = 'Total: <b>' + fmtIDR(total) + '</b>';

function itemByNameLookup(name){ return state.items.find(i=>i.name.toLowerCase()===name.trim().toLowerCase()); }
/* Supplier combo: typing is allowed to filter, but the value that actually
   gets submitted (#grSupplier, hidden) is only ever set by picking a row from
   the dropdown -- so a free-typed name that doesn't match an existing
   supplier can never sneak through as a new one. If what's typed matches an
   existing supplier name exactly (case-insensitive), we still require a pick
   so the id gets attached (typing alone never assigns an id). */
function grRenderSupplierCombo(query){
  const box = document.getElementById('grSupplierCombo');
  if(!box) return;
  const q = (query||'').trim().toLowerCase();
  const list = state.suppliers || [];
  const matches = (q ? list.filter(s=>(s.name||'').toLowerCase().includes(q)) : list).slice(0,300);
  if(matches.length===0){
    box.innerHTML = `<div class="combo-item" style="cursor:default; color:var(--text-faint);">Tidak ada supplier yang cocok. Tambahkan dulu di Master Data &gt; Supplier.</div>`;
    box.style.display = 'block';
    return;
  }
  box.innerHTML = matches.map(s=>`<div class="combo-item" onmousedown="grPickSupplier('${s.id}')">${escapeHtml(s.name)}${s.kode?` <span style="color:var(--text-faint);">— ${escapeHtml(s.kode)}</span>`:''}</div>`).join('');
  box.style.display = 'block';
}
function grOnSupplierInput(value){
  // Any manual typing invalidates a previous pick until the user picks again.
  const hidden = document.getElementById('grSupplier');
  if(hidden) hidden.value = '';
  const hint = document.getElementById('grSupplierHint');
  if(hint) hint.textContent = value.trim() ? 'Pilih supplier dari daftar di bawah.' : '';
  grRenderSupplierCombo(value);
}
function grPickSupplier(supplierId){
  const s = (state.suppliers||[]).find(x=>x.id===supplierId);
  if(!s) return;
  const input = document.getElementById('grSupplierInput');
  const hidden = document.getElementById('grSupplier');
  const hint = document.getElementById('grSupplierHint');
  if(input) input.value = s.name;
  if(hidden) hidden.value = s.id;

}
function grCloseSupplierCombo(){

}
async function submitReceivingDoc(editDocNumber){
  const supplierEl = document.getElementById('grSupplier');
  const supplierId = supplierEl.value;
  const supplierObj = supplierId ? (state.suppliers||[]).find(s=>s.id===supplierId) : null;
  const note = document.getElementById('grNote').value.trim();
  const doNumber = document.getElementById('grDoNumber').value.trim();
  const ppn = parsePriceInput(document.getElementById('grPpn').value);
  const dateTimeVal = document.getElementById('grDateTime').value;
  const createdAt = dateTimeVal ? new Date(dateTimeVal).toISOString() : new Date().toISOString();
  const err = document.getElementById('grError');
  const supplierTyped = (document.getElementById('grSupplierInput')||{}).value || '';
  if(supplierTyped.trim() && !supplierObj){ err.innerHTML = errBox('Pilih supplier dari daftar yang tersedia (klik salah satu saran saat mengetik).'); return; }
  const validLines = receivingLines.filter(l=>l.itemName.trim() && parseFloat(l.qty)>0 && l.locationId);
  if(validLines.length===0){ err.innerHTML = errBox('Tambahkan minimal 1 barang dengan jumlah lebih dari 0.'); return; }
  const lines = validLines.map(l=>({
    _txId: l._txId, itemName: l.itemName.trim(), qty: parseFloat(l.qty), uom: (l.uom||'').trim()||'pcs',
    price: parsePriceInput(l.price), category: l.category || (itemByNameLookup(l.itemName)||{}).category || 'Supplies',
    peruntukan: l.peruntukan || 'mix', locationId: l.locationId,
  }));
  await submitGuarded(err, async ()=>{
    if(editDocNumber){
      await actionEditReceivingDoc(editDocNumber, {supplierId, supplierName: supplierObj?supplierObj.name:'', lines, note, doNumber, ppn, createdAt});
      return;
    }
    let attachmentId = null;
    if(grAttachmentFile){
      if(!assetsCap){ throw new Error('Lampiran tidak bisa diunggah di tampilan ini. Simpan tanpa lampiran, atau coba lagi.'); }
      try{
        const result = await assetsCap.upload(grAttachmentFile, {type:'application/pdf'});
        attachmentId = result.id;
      }catch(e){
        throw new Error('Gagal mengunggah PDF (' + (e && e.code ? e.code : 'error') + '). Coba lagi atau simpan tanpa lampiran.');
      }
    }
    await actionReceivingDoc({supplierId, supplierName: supplierObj?supplierObj.name:'', lines, note, doNumber, ppn, attachmentId, createdAt});
  });
}

/* --- Transfer manual --- */
function openTransferModal(){
  if(!canManageGudang(currentRole())){ toast('Peran ini tidak dapat memindahkan stok.', true); return; }
  const body = `
    <div id="tfError"></div>
    <div class="two-col">
      <div class="field"><label>Dari</label><select id="tfFrom" onchange="tfRefreshStock()">${WAREHOUSES.map(w=>`<option value="${w.id}">${w.name}</option>`).join('')}</select></div>
      <div class="field"><label>Ke</label><select id="tfTo">${WAREHOUSES.map(w=>`<option value="${w.id}">${w.name}</option>`).join('')}</select></div>
    </div>
    <div class="field">
      <label>Barang</label>
      <div class="combo-wrap">
        <input type="text" id="tfItemInput" placeholder="Ketik untuk mencari barang…" oninput="tfOnItemInput(this.value)" onfocus="tfRenderCombo(this.value)" onblur="setTimeout(()=>tfCloseCombo(), 150)">
        <input type="hidden" id="tfItem">
        <div class="combo-list" id="tfCombo"></div>
      </div>
    </div>
    <div class="field"><label>Jumlah</label><input type="number" id="tfQty" inputmode="decimal" min="0" step="any" placeholder="0"><div class="stock-hint" id="tfStockHint"></div></div>
    <div class="field"><label>Catatan (opsional)</label><textarea id="tfNote"></textarea></div>
  `;
  const foot = `<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="submitTransfer()">Simpan Transfer</button>`;
  openModal('Transfer Manual', body, foot);
  document.getElementById('tfTo').selectedIndex = 1;
}
function tfOnItemInput(value){
  document.getElementById('tfItem').value = '';
  const hint = document.getElementById('tfStockHint');
  if(hint) hint.innerHTML = '';
  tfRenderCombo(value);
}
function tfRenderCombo(query){
  const box = document.getElementById('tfCombo');
  if(!box) return;
  const q = (query||'').trim().toLowerCase();
  const matches = (q ? state.items.filter(i=>i.name.toLowerCase().includes(q)) : state.items).slice(0,300);
  if(matches.length===0){ box.style.display='none'; box.innerHTML=''; return; }
  box.innerHTML = matches.map(i=>`<div class="combo-item" onmousedown="tfPickCombo('${i.id}')">${escapeHtml(i.name)}</div>`).join('');
  box.style.display = 'block';
}
function tfPickCombo(itemId){
  const item = itemById(itemId);
  if(!item) return;
  document.getElementById('tfItem').value = itemId;
  document.getElementById('tfItemInput').value = item.name;
  tfCloseCombo();
  tfRefreshStock();
}
function tfCloseCombo(){
  const box = document.getElementById('tfCombo');
  if(box){ box.style.display='none'; box.innerHTML=''; }
}
function tfRefreshStock(){
  const from = document.getElementById('tfFrom').value, itemId = document.getElementById('tfItem').value;
  if(!itemId){ document.getElementById('tfStockHint').innerHTML = ''; return; }
  if(isStorageWarehouse(from)){
    const mixQty = stockQtyByPeruntukan(from, itemId, 'mix');
    const total = stockQty(from, itemId);
    document.getElementById('tfStockHint').innerHTML = `Tersedia (Mix Use) di ${whName(from)}: <b>${fmtNum(mixQty)}</b>${total>mixQty ? ` <span class="cell-sub">(total ${fmtNum(total)}, sisanya teralokasi divisi)</span>` : ''}`;
  } else {
    const qty = stockQty(from, itemId);
    document.getElementById('tfStockHint').innerHTML = `Tersedia di ${whName(from)}: <b>${fmtNum(qty)}</b>`;
  }
}
async function submitTransfer(){
  const fromWarehouseId = document.getElementById('tfFrom').value, toWarehouseId = document.getElementById('tfTo').value;
  const itemId = document.getElementById('tfItem').value, qty = parseFloat(document.getElementById('tfQty').value);
  const note = document.getElementById('tfNote').value.trim();
  const err = document.getElementById('tfError');
  if(!itemId){ err.innerHTML = errBox('Pilih barang terlebih dahulu.'); return; }
  if(fromWarehouseId===toWarehouseId){ err.innerHTML = errBox('Lokasi asal dan tujuan tidak boleh sama.'); return; }
  if(!qty || qty<=0){ err.innerHTML = errBox('Jumlah harus lebih dari 0.'); return; }
  const available = isStorageWarehouse(fromWarehouseId) ? stockQtyByPeruntukan(fromWarehouseId, itemId, 'mix') : stockQty(fromWarehouseId, itemId);
  if(qty > available){ err.innerHTML = errBox('Stok Mix Use tidak cukup. Tersedia: ' + fmtNum(available) + '. Stok yang sudah teralokasi untuk divisi tertentu tidak bisa dipindah lewat Transfer Manual.'); return; }
  await submitGuarded(err, async ()=>{ await actionTransfer({fromWarehouseId, toWarehouseId, itemId, qty, note}); });
}

  const lines = validLines.map(l=>{
    const item = itemById(l.itemId);
    const enteredQty = parseFloat(l.qty);
    const useSmall = l.unit==='small' && srHasSmallUnit(item);
    return {
      itemId: l.itemId,
      qty: useSmall ? (enteredQty / item.conversionQty) : enteredQty,
      requestedQty: useSmall ? enteredQty : null,
      requestedUnit: useSmall ? item.smallUnit : null,
    };
  });

/* --- Permintaan WIP (multi-item, decoupled logbook) ---
   Deliberately its own doc-number series (WIP-000xxx, never SR-000xxx) and
   its own transaction type ('wiprequest', never 'request' or 'transfer'),
   so it can never be mixed into Permintaan Barang's list or its stock-moving
   code paths. The approval action below never calls adjustStock/moveStockMulti
   and never creates a Transfer (TR) document -- WIP Kitchen has no source
   Gudang Utama and no real stock balance to move, so "approving" a WIP
   request only ever changes its own status. This is purely a logbook to
   track how many times WIP was requested/handed over between kitchen
   divisions; it never touches inventory or Stock Opname. */
let wipReqLines = [];
function wipReqItems(){ return state.items.filter(i=>i.category==='WIP Kitchen'); }
function openWipRequestModal(){
  const role = currentRole();
  if(!canCreateWipRequest(role)){ toast('Peran ini tidak dapat membuat Permintaan WIP.', true); return; }
  if(wipReqItems().length===0){ toast('Belum ada barang berkategori "WIP Kitchen" di Master Data. Tambahkan dulu di halaman Barang.', true); return; }

  const kitchenDivisions = DIVISIONS.filter(d=>isKitchenDivision(d.id));
  const allowedDivisions = (isMaster || role.kind==='kitchen_leader') ? kitchenDivisions : kitchenDivisions.filter(d=>role.divisionIds && role.divisionIds.includes(d.id));
  const lockedDivision = (!isMaster && role.kind!=='kitchen_leader' && allowedDivisions.length===1) ? allowedDivisions[0] : null;
  wipReqLines = [{itemId:'', qty:'', unit:'uom'}];
  const body = `
    <div id="wipReqError"></div>
    <div class="lock-note">Permintaan WIP murni catatan serah-terima antar divisi kitchen — tidak memengaruhi stok/inventory maupun Stock Opname.</div>
    ${lockedDivision
      ? `<div class="lock-note">Diminta oleh <b>${escapeHtml(lockedDivision.name)}</b> — menunggu persetujuan Kitchen Leader.</div>`
      : `<div class="field"><label>Divisi Peminta</label><select id="wipDivisi">${allowedDivisions.map(d=>`<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('')}</select></div>`}

      <button type="button" class="mini-link-btn" style="margin-top:2px;" onclick="wipReqAddLine()">+ Tambah Barang</button>
    </div>
    <div class="field"><label>Catatan</label><textarea id="wipReqNote" placeholder="Untuk keperluan apa"></textarea></div>
  `;
  const foot = `<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="submitWipRequestDoc()">Kirim Permintaan</button>`;
  openModal('Permintaan WIP', body, foot);
  wipReqRenderLines();
}
function wipReqAddLine(){ wipReqLines.push({itemId:'', qty:'', unit:'uom'}); wipReqRenderLines(); }
function wipReqRemoveLine(idx){ wipReqLines.splice(idx,1); if(wipReqLines.length===0) wipReqLines.push({itemId:'', qty:'', unit:'uom'}); wipReqRenderLines(); }
function wipReqUpdateLine(idx, field, value){ wipReqLines[idx][field]=value; wipReqUpdateLineHint(idx); }
function wipReqUpdateLineHint(idx){
  const line = wipReqLines[idx];
  const item = line.itemId ? itemById(line.itemId) : null;
  const hint = document.getElementById('wipReqHint'+idx);
  if(!hint) return;
  if(item && line.unit==='small' && srHasSmallUnit(item) && parseFloat(line.qty)>0){
    const converted = parseFloat(line.qty) / item.conversionQty;
    hint.innerHTML = '≈ ' + fmtNum(converted) + ' ' + escapeHtml(item.uom);
  } else {
    hint.innerHTML = '';
  }
}
function wipReqRenderLines(){
  const box = document.getElementById('wipReqLinesBox');
  if(!box) return;
  const pool = wipReqItems();
  box.innerHTML = wipReqLines.map((line, idx)=>{
    const selected = line.itemId ? itemById(line.itemId) : null;
    const hasSmall = srHasSmallUnit(selected);
    const initialHint = (hasSmall && line.unit==='small' && parseFloat(line.qty)>0) ? ('≈ ' + fmtNum(parseFloat(line.qty)/selected.conversionQty) + ' ' + escapeHtml(selected.uom)) : '';
    return `
    <div style="display:grid; grid-template-columns: 2fr .7fr ${hasSmall?'.9fr':'.6fr'} auto; gap:6px; margin-bottom:2px; align-items:start;">
      <div class="combo-wrap">
        <input type="text" id="wipReqItemInput${idx}" placeholder="Ketik untuk mencari barang WIP…" value="${selected?escapeHtml(selected.name):''}"
          oninput="wipReqOnItemInput(${idx}, this.value)"
          onfocus="wipReqRenderCombo(${idx}, this.value)"
          onblur="setTimeout(()=>wipReqCloseCombo(${idx}), 150)">
        <div class="combo-list" id="wipReqCombo${idx}"></div>
      </div>
      <input type="number" placeholder="Jumlah" value="${line.qty}" oninput="wipReqUpdateLine(${idx},'qty',this.value)">
      ${hasSmall
        ? `<select onchange="wipReqUpdateLine(${idx},'unit',this.value)" title="Pilih satuan besar atau kecil">
            <option value="uom" ${line.unit!=='small'?'selected':''}>${escapeHtml(selected.uom)}</option>
            <option value="small" ${line.unit==='small'?'selected':''}>${escapeHtml(selected.smallUnit)}</option>
          </select>`
        : `<div class="cell-sub" style="padding:9px 2px;">${selected?escapeHtml(selected.uom):''}</div>`}
      <button type="button" class="btn btn-sm btn-quiet" onclick="wipReqRemoveLine(${idx})" title="Hapus baris">${ICONS.trash}</button>
    </div>
    <div class="cell-sub" id="wipReqHint${idx}" style="margin:0 0 8px; min-height:14px;">${initialHint}</div>`;
  }).join('');
  if(pool.length===0){ box.innerHTML = '<div class="cell-sub">Belum ada barang berkategori "WIP Kitchen" di Master Data.</div>'; }
}
function wipReqOnItemInput(idx, value){
  wipReqLines[idx].itemId = '';
  wipReqRenderCombo(idx, value);
}
function wipReqRenderCombo(idx, query){
  const box = document.getElementById('wipReqCombo'+idx);
  if(!box) return;
  const q = (query||'').trim().toLowerCase();
  const pool = wipReqItems();
  const matches = (q ? pool.filter(i=>i.name.toLowerCase().includes(q)) : pool).slice(0,300);
  if(matches.length===0){ box.style.display='none'; box.innerHTML=''; return; }
  box.innerHTML = matches.map(i=>`<div class="combo-item" onmousedown="wipReqPickCombo(${idx},'${i.id}')">${escapeHtml(i.name)}${i.kode?` <span style="color:var(--text-faint);">— ${escapeHtml(i.kode)}</span>`:''}</div>`).join('');
  box.style.display = 'block';
}
function wipReqPickCombo(idx, itemId){
  const item = itemById(itemId);
  if(!item) return;
  wipReqLines[idx].itemId = itemId;
  wipReqLines[idx].unit = 'uom';
  wipReqCloseCombo(idx);
  wipReqRenderLines();
}
function wipReqCloseCombo(idx){
  const box = document.getElementById('wipReqCombo'+idx);
  if(box){ box.style.display='none'; box.innerHTML=''; }
}
async function submitWipRequestDoc(){

async function actionWipRequestDoc(payload){
  const docNumber = nextDocNumber('WIP');
  const division = divisionById(payload.divisionId);
  for(const line of payload.lines){
    const item = itemById(line.itemId);
    await logTx({
      type:'wiprequest', status:'menunggu', docNumber,
      itemId:item.id, itemName:item.name, uom:item.uom, qty:line.qty,
      requestedQty: line.requestedQty || null, requestedUnit: line.requestedUnit || null,
      divisionId: payload.divisionId, divisionName: division ? division.name : '',
      note: payload.note||'',
      kitchenGateStatus: 'pending',
    });
  }
  toast('Permintaan WIP ' + docNumber + ' terkirim, menunggu persetujuan Kitchen Leader.');
  return docNumber;
}
async function actionApproveWipGate(docNumber){

/* Final step: Receiving/Master marks the request recorded. Unlike
   actionApproveAndTransfer for a real SR, this never picks a source

async function actionApproveWip(docNumber){

async function submitRejectWip(docNumber){

async function actionDecideWipRequestDoc(docNumber, decision, note){
  const role = currentRole();
  if(!canApproveKitchenGate(role) && !canApproveSR(role)){ toast('Peran ini tidak dapat memproses Permintaan WIP.', true); return; }
  const lines = state.transactions.filter(t=>t.type==='wiprequest' && t.docNumber===docNumber);
  if(lines.length===0 || lines[0].status!=='menunggu') return;
  try{
    for(const line of lines){
      await db.doc('transactions/'+line.id).update({ status: decision, decidedAt: new Date().toISOString(), decidedByRole: state.role, decidedByRoleName: currentRole().name, rejectNote: note || null });
    }
    toast('Permintaan WIP ' + docNumber + ' ditolak.');
  }catch(err){
    toast(err.message || 'Gagal memproses permintaan. Coba lagi.', true);
  }
}
function confirmDeleteWip(docNumber){
  const lines = state.transactions.filter(t=>t.type==='wiprequest' && t.docNumber===docNumber);
  if(lines.length===0) return;
  const role = currentRole();
  if(!canDeleteWip(role, lines[0])){ toast('Anda tidak dapat menghapus permintaan ini.', true); return; }

async function actionDeleteWip(docNumber){
  const lines = state.transactions.filter(t=>t.type==='wiprequest' && t.docNumber===docNumber);
  if(lines.length===0) return;
  const role = currentRole();
  if(!canDeleteWip(role, lines[0])){ toast('Anda tidak dapat menghapus permintaan ini.', true); return; }

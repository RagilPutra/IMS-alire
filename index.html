async function actionEditStoreRequestDoc(docNumber, lines, noteFields){
  /* noteFields is {note} when the requesting division edits their own request,
     or {leaderNote, leaderNoteBy} when a Kitchen Leader revises it. Only the
     fields actually present are written, so editing one never wipes the
     other -- that's what kept Receiving from telling a Kitchen Leader's
     revision note apart from the original requester's note. */
  const existingLines = state.transactions.filter(t=>t.type==='request' && t.docNumber===docNumber);
  if(existingLines.length===0) throw new Error('Permintaan tidak ditemukan.');
  if(existingLines[0].status!=='menunggu') throw new Error('Permintaan ini sudah diproses, tidak bisa diubah lagi.');
  const first = existingLines[0];
  if(lines.length===0) throw new Error('Pilih minimal 1 barang dengan jumlah lebih dari 0.');
  const keepIds = new Set();
  for(const line of lines){
    const item = itemById(line.itemId);
    if(line._txId){
      keepIds.add(line._txId);
      await db.doc('transactions/'+line._txId).update({
        itemId: item.id, itemName: item.name, uom: item.uom,
        qty: line.qty, requestedQty: line.requestedQty || null, requestedUnit: line.requestedUnit || null,
        ...('note' in noteFields ? {note: noteFields.note||''} : {}),
        ...('leaderNote' in noteFields ? {leaderNote: noteFields.leaderNote||'', leaderNoteBy: noteFields.leaderNoteBy||null, leaderNoteAt: new Date().toISOString()} : {}),
      });
    } else {
      await logTx({
        type:'request', status:'menunggu', docNumber,
        itemId:item.id, itemName:item.name, uom:item.uom, qty:line.qty,
        requestedQty: line.requestedQty || null, requestedUnit: line.requestedUnit || null,
        divisionId: first.divisionId, divisionName: first.divisionName,
        toWarehouseId: first.toWarehouseId, toWarehouseName: first.toWarehouseName,
        note: noteFields.note || '',
        leaderNote: noteFields.leaderNote || '', leaderNoteBy: noteFields.leaderNoteBy || null, leaderNoteAt: noteFields.leaderNote ? new Date().toISOString() : null,
        kitchenGateStatus: first.kitchenGateStatus || null,
      });
    }
  }
  for(const line of existingLines){
    if(!keepIds.has(line.id)) await db.doc('transactions/'+line.id).delete();
  }
  toast('Permintaan ' + docNumber + ' berhasil diubah.');
}

async function actionDecideRequestDoc(docNumber, decision, note){
  if(!canApproveSR(currentRole())){ toast('Peran ini tidak dapat memproses Permintaan Barang.', true); return; }
  const lines = state.transactions.filter(t=>t.type==='request' && t.docNumber===docNumber);
  if(lines.length===0 || lines[0].status!=='menunggu') return;
  try{
    for(const line of lines){
      await db.doc('transactions/'+line.id).update({ status: decision, decidedAt: new Date().toISOString(), decidedByRole: state.role, decidedByRoleName: currentRole().name, rejectNote: note || null });
    }
    toast('Permintaan ' + docNumber + ' ditolak.');
  }catch(err){
    toast(err.message || 'Gagal memproses permintaan. Coba lagi.', true);
  }
}

async function actionApproveAndTransfer(docNumber, sourceLocationId){
  if(!canApproveSR(currentRole())){ throw new Error('Peran ini tidak dapat memproses Permintaan Barang.'); }
  const lines = state.transactions.filter(t=>t.type==='request' && t.docNumber===docNumber && t.status==='menunggu');
  if(lines.length===0) throw new Error('Tidak ada baris yang menunggu persetujuan.');
  const toWarehouseId = lines[0].toWarehouseId; // requesting division
  for(const line of lines){
    const divisionQty = stockQtyByPeruntukan(sourceLocationId, line.itemId, toWarehouseId);
    const mixQty = stockQtyByPeruntukan(sourceLocationId, line.itemId, 'mix');
    const combined = divisionQty + mixQty;
    if(combined < line.qty){
      throw new Error('Stok ' + line.itemName + ' untuk ' + whName(toWarehouseId) + ' (termasuk Mix Use) tidak cukup di ' + whName(sourceLocationId) + '. Tersedia ' + fmtNum(combined) + ', dibutuhkan ' + fmtNum(line.qty) + '. Sisanya mungkin teralokasi untuk divisi lain.');
    }
  }
  const trDocNumber = nextDocNumber('TR');
  for(const line of lines){
    const divisionQty = stockQtyByPeruntukan(sourceLocationId, line.itemId, toWarehouseId);
    const fromDivision = Math.min(line.qty, divisionQty);
    const fromMix = Math.round((line.qty - fromDivision) * 1000) / 1000;
    const sourceBuckets = [];
    if(fromDivision > 0) sourceBuckets.push({warehouseId: sourceLocationId, peruntukan: toWarehouseId, qty: fromDivision});
    if(fromMix > 0) sourceBuckets.push({warehouseId: sourceLocationId, peruntukan: 'mix', qty: fromMix});
    await moveStockMulti(sourceBuckets, toWarehouseId, line.itemId);

    const item = itemById(line.itemId);
    await logTx({
      type:'transfer', status:'completed', docNumber: trDocNumber, requestDocNumber: docNumber,
      itemId: line.itemId, itemName: line.itemName, uom: line.uom, qty: line.qty,
      price: item?item.lastPrice||0:0, totalValue: (item?item.lastPrice||0:0)*line.qty,
      fromWarehouseId: sourceLocationId, fromWarehouseName: whName(sourceLocationId),
      toWarehouseId: toWarehouseId, toWarehouseName: whName(toWarehouseId),
      note: fromDivision>0 && fromMix>0 ? `${fmtNum(fromDivision)} dari alokasi ${whName(toWarehouseId)}, ${fmtNum(fromMix)} dari Mix Use` : '',
    });
    await db.doc('transactions/'+line.id).update({ status:'disetujui', decidedAt: new Date().toISOString(), decidedByRole: state.role, decidedByRoleName: currentRole().name, transferDocNumber: trDocNumber });
  }
  toast('Permintaan ' + docNumber + ' disetujui, stok langsung ditransfer (' + trDocNumber + ').');
}

/* =========================================================
   STOCK OPNAME
   Peruntukan note: saat opname di Gudang Utama, selisih hasil hitung
   fisik dibebankan ke bucket Mix Use (bukan ke peruntukan tertentu),
   karena opname tidak tahu selisih itu milik alokasi divisi yang mana.
========================================================= */
function currentPeriodKey(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function periodLabel(key){
  const [y,m] = key.split('-');
  const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return months[parseInt(m,10)-1] + ' ' + y;
}
function opnamePeriodOptions(){
  const now = new Date();
  const opts = [];
  for(let i=1; i>=-8; i--){
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    opts.push(key);
  }
  return opts;
}
async function generateOpnamePdf(periodKey){
  if(!window.jspdf){ toast('Library PDF belum siap termuat, coba lagi sebentar.', true); return; }
  const session = state.opnameSessions.find(s=>s.periodKey===periodKey);
  if(!session){ toast('Data opname periode ini tidak ditemukan.', true); return; }
  showLoading('Menyiapkan laporan PDF…');
  try{
    const detailsByLocation = {};
    for(const w of WAREHOUSES){
      try{
        const snap = await db.doc('opnameDetails/' + periodKey + '__' + w.id).get();
        if(snap && snap.exists) detailsByLocation[w.id] = snap.data();
      }catch(e){ /* no saved detail for this location -- older opname before this feature existed */ }
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 40;
    let y = 50;
    const brand = [107,63,34];

    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('ALIRE SAJIAN NUSANTARA', margin, y);
    y += 20;
    doc.setFontSize(13);
    doc.text('Laporan Stock Opname \u2014 ' + periodLabel(periodKey), margin, y);
    y += 16;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(110);
    doc.text('Status: ' + (session.status==='selesai' ? ('Difinalisasi pada ' + fmtDate(session.finalizedAt)) : 'Draft (belum difinalisasi)'), margin, y);
    y += 12;
    doc.text('Dicetak: ' + fmtDate(new Date().toISOString()), margin, y);
    y += 22;
    doc.setTextColor(0);

    const totalValue = Object.values(session.locationValues||{}).reduce((s,v)=>s+v,0);
    const totalUsed = Object.values(session.locationUsedValues||{}).reduce((s,v)=>s+v,0);
    const netSales = session.netSales || 0;
    const pct = netSales ? (totalValue/netSales*100) : null;

    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('Ringkasan Eksekutif', margin, y); y += 16;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    [
      ['Total Nilai Stok', fmtIDR(totalValue)],
      ['Total Nilai Terpakai', fmtIDR(totalUsed)],
      ['Net Sales', netSales ? fmtIDR(netSales) : '\u2014'],
      ['% Stok terhadap Sales', pct!==null ? pct.toFixed(2).replace('.',',')+'%' : '\u2014'],
    ].forEach(row=>{
      doc.text(row[0] + ':', margin, y);
      doc.text(row[1], margin+150, y);
      y += 14;
    });
    y += 10;

    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('Rincian per Lokasi', margin, y); y += 4;
    const locRows = WAREHOUSES.map(w=>{
      const val = (session.locationValues||{})[w.id];
      if(val===undefined) return null;
      const used = (session.locationUsedValues||{})[w.id] || 0;
      const addedGoods = (session.locationAddedGoodsValues||{})[w.id] || 0;
      const addedWip = (session.locationAddedWipValues||{})[w.id] || 0;
      const kontribusi = totalValue ? (val/totalValue*100) : 0;
      return [w.name, fmtIDR(val), fmtIDR(addedGoods), fmtIDR(addedWip), fmtIDR(used), kontribusi.toFixed(1)+'%'];
    }).filter(Boolean);
    doc.autoTable({
      startY: y+8, margin:{left:margin, right:margin},
      head: [['Lokasi','Nilai Tercatat','Nilai Penambahan Barang','Nilai Penambahan WIP','Nilai Terpakai','% Kontribusi']],
      body: locRows.length ? locRows : [['Belum ada lokasi yang selesai diopname','\u2014','\u2014','\u2014','\u2014','\u2014']],
      styles:{fontSize:9, cellPadding:5},
      headStyles:{fillColor:brand, textColor:255},
      columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'}},
    });
    y = doc.lastAutoTable.finalY + 26;

    const missingDetail = [];
    for(const w of WAREHOUSES){
      const detail = detailsByLocation[w.id];
      if(!(session.locationsDone||{})[w.id]) continue;
      if(!detail || !detail.items || detail.items.length===0){ missingDetail.push(w.name); continue; }
      if(y > pageHeight - 140){ doc.addPage(); y = 50; }
      doc.setFont('helvetica','bold'); doc.setFontSize(11);
      doc.text('Detail Barang \u2014 ' + w.name, margin, y); y += 4;
      const itemRows = detail.items.slice().sort((a,b)=>(a.itemName||'').localeCompare(b.itemName||''));
      doc.autoTable({
        startY: y+8, margin:{left:margin, right:margin},
        head: [['Kode','Nama Barang','Satuan','Stok Sistem','Jumlah Fisik','Selisih','Nilai Fisik','Ket.']],
        body: itemRows.map(it=>[it.kode||'\u2014', it.itemName, it.uom, fmtNum(it.systemQty), fmtNum(it.physicalQty), (it.selisih>0?'+':'')+fmtNum(it.selisih), fmtIDR(it.nilaiFisik), it.addedType==='wip'?'Tambahan WIP':(it.addedType==='goods'?'Tambahan':'')]),
        styles:{fontSize:8, cellPadding:4},
        headStyles:{fillColor:brand, textColor:255},
        columnStyles:{3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}},
        didParseCell: function(data){
          if(data.section==='body' && data.column.index===5){
            const it = itemRows[data.row.index];
            if(it && it.addedType){ /* additions never affect stock -- keep neutral, not colored as a real selisih */ }
            else if(it && it.selisih < -0.0001) data.cell.styles.textColor = [190,60,50];
            else if(it && it.selisih > 0.0001) data.cell.styles.textColor = [40,140,80];
          }
        },
      });
      y = doc.lastAutoTable.finalY + 26;
    }

    if(missingDetail.length){
      if(y > pageHeight - 80){ doc.addPage(); y = 50; }
      doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(140);
      doc.text('Catatan: detail per barang untuk ' + missingDetail.join(', ') + ' tidak tersedia (diopname sebelum fitur laporan detail ini aktif).', margin, y, {maxWidth: pageWidth-margin*2});
      doc.setTextColor(0);
      y += 26;
    }

    if(y > pageHeight - 110){ doc.addPage(); y = 60; } else { y += 20; }
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    const colWidth = (pageWidth - margin*2) / 3;
    ['Dihitung oleh','Diverifikasi oleh','Disetujui oleh'].forEach((label,i)=>{
      const x = margin + i*colWidth;
      doc.text(label, x, y);
      doc.line(x, y+50, x+colWidth-20, y+50);
      doc.setFontSize(8); doc.setTextColor(130);
      doc.text('Nama & Tanda Tangan', x, y+62);
      doc.setFontSize(9.5); doc.setTextColor(0);
    });

    doc.save('Stock_Opname_' + periodKey + '.pdf');
    toast('Laporan PDF berhasil dibuat.');
  }catch(err){
    toast('Gagal membuat laporan PDF: ' + (err && err.message ? err.message : 'terjadi kesalahan'), true);
  }finally{
    hideLoading();
  }
}
async function generateOpnameExcel(periodKey){
  if(!window.XLSX){ toast('Library Excel belum siap termuat, coba lagi sebentar.', true); return; }
  const session = state.opnameSessions.find(s=>s.periodKey===periodKey);
  if(!session){ toast('Data opname periode ini tidak ditemukan.', true); return; }
  showLoading('Menyiapkan laporan Excel…');
  try{
    const detailsByLocation = {};
    for(const w of WAREHOUSES){
      try{
        const snap = await db.doc('opnameDetails/' + periodKey + '__' + w.id).get();
        if(snap && snap.exists) detailsByLocation[w.id] = snap.data();
      }catch(e){ /* no saved detail for this location -- older opname before this feature existed */ }
    }

    const totalValue = Object.values(session.locationValues||{}).reduce((s,v)=>s+v,0);
    const totalUsed = Object.values(session.locationUsedValues||{}).reduce((s,v)=>s+v,0);
    const netSales = session.netSales || 0;
    const pct = netSales ? (totalValue/netSales*100) : null;

    const wb = XLSX.utils.book_new();

    /* Sheet 1: ringkasan eksekutif + rincian per lokasi (sama isinya dengan
       halaman pertama laporan PDF). */
    const summaryRows = [
      ['ALIRE SAJIAN NUSANTARA'],
      ['Laporan Stock Opname — ' + periodLabel(periodKey)],
      ['Status', session.status==='selesai' ? ('Difinalisasi pada ' + fmtDate(session.finalizedAt)) : 'Draft (belum difinalisasi)'],
      ['Dicetak', fmtDate(new Date().toISOString())],
      [],
      ['Ringkasan Eksekutif'],
      ['Total Nilai Stok', totalValue],
      ['Total Nilai Terpakai', totalUsed],
      ['Net Sales', netSales || ''],
      ['% Stok terhadap Sales', pct!==null ? Number(pct.toFixed(2)) : ''],
      [],
      ['Rincian per Lokasi'],
      ['Lokasi','Nilai Tercatat','Nilai Penambahan Barang','Nilai Penambahan WIP','Nilai Terpakai','% Kontribusi'],
    ];
    const locRows = WAREHOUSES.map(w=>{
      const val = (session.locationValues||{})[w.id];
      if(val===undefined) return null;
      const used = (session.locationUsedValues||{})[w.id] || 0;
      const addedGoods = (session.locationAddedGoodsValues||{})[w.id] || 0;
      const addedWip = (session.locationAddedWipValues||{})[w.id] || 0;
      const kontribusi = totalValue ? (val/totalValue*100) : 0;
      return [w.name, val, addedGoods, addedWip, used, Number(kontribusi.toFixed(1))];
    }).filter(Boolean);
    if(locRows.length===0) summaryRows.push(['Belum ada lokasi yang selesai diopname','—','—','—','—','—']);
    else summaryRows.push(...locRows);
    const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
    wsSummary['!cols'] = [{wch:30},{wch:20},{wch:22},{wch:20},{wch:20},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsSummary, 'Ringkasan');

    /* Satu sheet per lokasi yang punya detail per-barang (sama isinya
       dengan tabel "Detail Barang" per lokasi di laporan PDF). Nama sheet
       Excel dibatasi 31 karakter dan tidak boleh ada karakter \/?*[]: */
    const usedSheetNames = new Set(['Ringkasan']);
    for(const w of WAREHOUSES){
      if(!(session.locationsDone||{})[w.id]) continue;
      const detail = detailsByLocation[w.id];
      if(!detail || !detail.items || detail.items.length===0) continue;
      const itemRows = detail.items.slice().sort((a,b)=>(a.itemName||'').localeCompare(b.itemName||''));
      const rows = itemRows.map(it=>({
        'Kode': it.kode||'',
        'Nama Barang': it.itemName,
        'Satuan': it.uom,
        'Stok Sistem': it.systemQty,
        'Jumlah Fisik': it.physicalQty,
        'Selisih': it.selisih,
        'Nilai Fisik': it.nilaiFisik,
        'Keterangan': it.addedType==='wip' ? 'Tambahan WIP' : (it.addedType==='goods' ? 'Tambahan' : ''),
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = [{wch:12},{wch:28},{wch:10},{wch:12},{wch:12},{wch:10},{wch:16},{wch:14}];
      let base = w.name.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31) || w.id;
      let finalName = base, n = 2;
      while(usedSheetNames.has(finalName)){ finalName = (base.slice(0,28) + '_' + n); n++; }
      usedSheetNames.add(finalName);
      XLSX.utils.book_append_sheet(wb, ws, finalName);
    }

    XLSX.writeFile(wb, 'Stock_Opname_' + periodKey + '.xlsx');
    toast('Laporan Excel berhasil dibuat.');
  }catch(err){
    toast('Gagal membuat laporan Excel: ' + (err && err.message ? err.message : 'terjadi kesalahan'), true);
  }finally{
    hideLoading();
  }
}
async function actionSubmitOpnameCount(locationId, counts, periodKey, added){
  added = added || {};
  let totalValue = 0;
  let systemTotalValue = 0;
  let addedGoodsValue = 0, addedWipValue = 0;
  const changedLines = [];
  const allItemsDetail = [];
  Object.keys(counts).forEach(itemId=>{
    const item = itemById(itemId);
    if(!item) return;
    const useSmall = srHasSmallUnit(item);
    const enteredQty = counts[itemId] || 0;
    const physical = useSmall ? (enteredQty / item.conversionQty) : enteredQty;
    const value = physical * (item.lastPrice||0);
    const addedType = added[itemId] || null;
    if(addedType){
      /* Manually-added item found during physical counting (via "Tambah
         Barang" / "Tambah Barang WIP"): recorded only in allItemsDetail and
         the location's added-value totals below. It intentionally never
         calls adjustStock/logTx, so it can never move real inventory --
         it only ever shows up inside the Stock Opname data itself. */
      if(addedType==='wip') addedWipValue += value; else addedGoodsValue += value;
      allItemsDetail.push({
        itemId, itemName: item.name, kode: item.kode||'', uom: item.uom||'',
        systemQty: 0, physicalQty: physical, selisih: physical,
        price: item.lastPrice||0, nilaiFisik: value, nilaiSelisih: 0,
        addedType,
      });
      return;
    }
    totalValue += value;
    const system = stockQty(locationId, itemId);
    systemTotalValue += system * (item.lastPrice||0);
    const delta = Math.round((physical - system) * 1000) / 1000;
    /* For a Gudang Utama location, keep a per-item breakdown of how much of
       this item's counted quantity sits under each Peruntukan (allocation) --
       needed so Laporan Stock Opname can later show, at this exact moment in
       time, which divisi an allocated item belonged to. The physical-count
       delta itself (the difference vs system) always lands in Mix Use, same
       as adjustStock() below always applies it with peruntukan 'mix'. */
    let peruntukanQty = null;
    if(isStorageWarehouse(locationId)){
      peruntukanQty = {};
      PERUNTUKAN_OPTIONS.forEach(p=>{ peruntukanQty[p.id] = stockQtyByPeruntukan(locationId, itemId, p.id); });
      peruntukanQty.mix = (peruntukanQty.mix||0) + delta;
    }
    allItemsDetail.push({
      itemId, itemName: item.name, kode: item.kode||'', uom: item.uom||'',
      systemQty: system, physicalQty: physical, selisih: delta,
      price: item.lastPrice||0, nilaiFisik: value, nilaiSelisih: delta*(item.lastPrice||0),
      ...(peruntukanQty ? {peruntukanQty} : {}),
    });
    if(Math.abs(delta) > 0.0001){
      const detail = useSmall
        ? ('fisik ' + fmtNum(enteredQty) + ' ' + item.smallUnit + ' (≈ ' + fmtNum(physical) + ' ' + item.uom + ')')
        : ('fisik ' + fmtNum(physical) + ' ' + item.uom);
      changedLines.push({item, system, physical, delta, detail});
    }
  });
  const usedValue = systemTotalValue - totalValue;
  /* Aggregate value per Peruntukan for this location, so Laporan Stock
     Opname (Nilai Penggunaan per Divisi / KPI) can attribute this location's
     total value to the right divisi without re-scanning every item. */
  let peruntukanValues = null;
  if(isStorageWarehouse(locationId)){
    peruntukanValues = {};
    PERUNTUKAN_OPTIONS.forEach(p=>{ peruntukanValues[p.id] = 0; });
    allItemsDetail.forEach(it=>{
      if(!it.peruntukanQty) return;
      PERUNTUKAN_OPTIONS.forEach(p=>{ peruntukanValues[p.id] += (it.peruntukanQty[p.id]||0) * (it.price||0); });
    });
  }
  try{
    for(const line of changedLines){
      const peruntukan = isStorageWarehouse(locationId) ? 'mix' : null;
      await adjustStock(locationId, line.item.id, line.delta, peruntukan);
      await logTx({
        type:'opname', status:'completed',
        itemId: line.item.id, itemName: line.item.name, uom: line.item.uom, qty: Math.abs(line.delta),
        toWarehouseId: line.delta>0 ? locationId : null, toWarehouseName: line.delta>0 ? whName(locationId) : null,
        fromWarehouseId: line.delta<0 ? locationId : null, fromWarehouseName: line.delta<0 ? whName(locationId) : null,
        note: 'Stock Opname ' + periodLabel(periodKey) + ': sistem ' + fmtNum(line.system) + ' ' + line.item.uom + ' → ' + line.detail,
      });
    }
    const ref = db.doc('opnameSessions/' + periodKey);
    const updatedAt = new Date().toISOString();
    const snap = await ref.get();
    const existing = (snap && snap.exists) ? snap.data() : null;
    const mergedValues = { ...(existing && existing.locationValues || {}), [locationId]: totalValue };
    const mergedUsed = { ...(existing && existing.locationUsedValues || {}), [locationId]: usedValue };
    const mergedAddedGoods = { ...(existing && existing.locationAddedGoodsValues || {}), [locationId]: addedGoodsValue };
    const mergedAddedWip = { ...(existing && existing.locationAddedWipValues || {}), [locationId]: addedWipValue };
    const mergedDone = { ...(existing && existing.locationsDone || {}), [locationId]: true };
    if(existing){
      await ref.update({ locationValues: mergedValues, locationUsedValues: mergedUsed, locationAddedGoodsValues: mergedAddedGoods, locationAddedWipValues: mergedAddedWip, locationsDone: mergedDone, updatedAt });
    } else {
      await ref.set({ periodKey, status:'draft', createdAt: updatedAt, updatedAt, locationValues: mergedValues, locationUsedValues: mergedUsed, locationAddedGoodsValues: mergedAddedGoods, locationAddedWipValues: mergedAddedWip, locationsDone: mergedDone });
    }
    await db.doc('opnameDetails/' + periodKey + '__' + locationId).set({
      periodKey, locationId, locationName: whName(locationId),
      items: allItemsDetail, totalValue, totalUsedValue: usedValue,
      totalAddedGoodsValue: addedGoodsValue, totalAddedWipValue: addedWipValue, submittedAt: updatedAt,
      ...(peruntukanValues ? {peruntukanValues} : {}),
    });
    const addedCount = Object.keys(added).length;
    toast('Opname ' + whName(locationId) + ' tersimpan (' + changedLines.length + ' barang direvisi' + (addedCount>0 ? ', ' + addedCount + ' barang tambahan' : '') + ').');
    return true;
  }catch(err){
    toast(err.message || 'Gagal menyimpan hasil opname. Coba lagi.', true);
    return false;
  }
}
async function actionFinalizeOpname(periodKey, netSales){
  try{
    const ref = db.doc('opnameSessions/' + periodKey);
    const snap = await ref.get();
    if(!snap || !snap.exists){ toast('Sesi opname periode ini tidak ditemukan.', true); return; }
    const session = snap.data();
    const totalValue = Object.values(session.locationValues||{}).reduce((s,v)=>s+v,0);
    /* Denormalized per-divisi breakdown for this now-finalized period, so
       Laporan Stock Opname (Nilai Penggunaan per Divisi / F&B Cost / KPI
       Ideal Stock) can read it straight off the session doc instead of
       re-scanning every opnameDetails doc on every render. */
    const groupValues = await computeGroupValuesFromOpnameDetails(periodKey);
    await ref.update({ netSales, totalValue, groupValues, status:'selesai', finalizedAt: new Date().toISOString() });
    toast('Periode ' + periodLabel(periodKey) + ' berhasil difinalisasi.');
  }catch(err){
    toast(err.message || 'Gagal menyelesaikan periode. Coba lagi.', true);
  }
}

async function actionAddItemMaster(payload){
  const existing = state.items.find(i=>i.name.toLowerCase()===payload.name.trim().toLowerCase());
  if(existing){ toast('Nama barang sudah ada.', true); return false; }
  const kodeExisting = payload.kode && state.items.find(i=>(i.kode||'').toLowerCase()===payload.kode.trim().toLowerCase());

async function actionDeleteItem(itemId){
  const item = itemById(itemId);
  if(!item) return;
  if(totalStock(itemId) > 0){ toast('Tidak bisa dihapus, stok barang ini masih ada.', true); return; }
  await db.doc('items/'+itemId).delete();

}
async function actionBulkAddItems(rows){
  let added = 0, skipped = 0;
  for(const row of rows){
    const name = (row.name||'').trim();
    if(!name){ skipped++; continue; }
    const dup = state.items.find(i=>i.name.toLowerCase()===name.toLowerCase()) || (row.kode && state.items.find(i=>(i.kode||'').toLowerCase()===row.kode.trim().toLowerCase()));
    if(dup){ skipped++; continue; }
    const newItem = { kode: row.kode || nextItemCode(), name, category: row.category || ITEM_CATEGORIES[0], uom: row.uom || 'pcs', lastPrice: row.price || 0, reorderLevel: row.reorderLevel || 0, createdAt: new Date().toISOString() };
    await db.collection('items').add(newItem);
    const optimistic = {...newItem, id: 'temp_'+uid()};
    state.items.push(optimistic); itemIndex[optimistic.id] = optimistic;
    added++;
  }
  return {added, skipped};
}

(function(){
  let dragState = null;
  document.addEventListener('mousedown', function(e){
    const scrollEl = e.target.closest('.table-scroll');
    if(!scrollEl) return;
    if(e.target.closest('input, select, textarea, button, a, .btn')) return;
    dragState = { el: scrollEl, startX: e.pageX, scrollLeft: scrollEl.scrollLeft, moved: false };
  });
  document.addEventListener('mousemove', function(e){
    if(!dragState) return;
    const dx = e.pageX - dragState.startX;
    if(!dragState.moved && Math.abs(dx) > 4){
      dragState.moved = true;
      dragState.el.classList.add('dragging-scroll');
    }
    if(dragState.moved){
      e.preventDefault();
      dragState.el.scrollLeft = dragState.scrollLeft - dx;
    }
  });
  document.addEventListener('mouseup', function(){
    if(!dragState) return;
    if(dragState.moved){
      const suppressClick = function(ce){ ce.stopPropagation(); ce.preventDefault(); document.removeEventListener('click', suppressClick, true); };
      document.addEventListener('click', suppressClick, true);
    }
    dragState.el.classList.remove('dragging-scroll');
    dragState = null;
  });
  document.addEventListener('mouseleave', function(){
    if(dragState){ dragState.el.classList.remove('dragging-scroll'); dragState = null; }
  });
})();

function locationValue(w){ return state.items.reduce((s,i)=> s + stockQty(w.id,i.id)*(i.lastPrice||0), 0); }
function locationQty(w){ return state.items.reduce((s,i)=> s + stockQty(w.id,i.id), 0); }
function getLocationSummary(mode){
  const val = w => mode==='value' ? locationValue(w) : locationQty(w);
  let entries = [];
  STORAGE_WAREHOUSES.forEach(w=>{
    const v = val(w);
    if(v > 0) entries.push({name:w.name, val:v, locId:w.id});
  });
  DIRECT_WAREHOUSES.forEach(w=>{
    const v = val(w);
    if(v > 0) entries.push({name:w.name, val:v, locId:w.id});
  });
  entries.sort((a,b)=>b.val-a.val);
  const total = entries.reduce((s,e)=>s+e.val,0);
  const top = entries.slice(0,6);
  const restVal = entries.slice(6).reduce((s,e)=>s+e.val,0);
  if(restVal > 0) top.push({name:'Lainnya', val:restVal, locId:null});
  return top.map(e=>({...e, pct: total>0 ? (e.val/total*100) : 0}));
}
function getStorageBreakdown(mode){
  return STORAGE_WAREHOUSES.map(sw=>{
    const parts = PERUNTUKAN_OPTIONS.map(p=>{
      const val = mode==='value'
        ? state.items.reduce((s,item)=> s + stockQtyByPeruntukan(sw.id, item.id, p.id) * (item.lastPrice||0), 0)
        : state.items.reduce((s,item)=> s + stockQtyByPeruntukan(sw.id, item.id, p.id), 0);
      return { id:p.id, name:p.name, val };
    }).filter(p=>p.val>0).sort((a,b)=>b.val-a.val);
    return { warehouse: sw, parts };
  });
}
/* Collapses getStorageBreakdown()'s per-warehouse parts into one grand total
   PER PERUNTUKAN across all Gudang Utama locations combined -- e.g. total
   "Kitchen" allocation summed over Dry+Cold+Freezer+... storage, instead of
   the per-warehouse view above. Reuses the already-computed breakdown rather
   than re-querying stockQtyByPeruntukan for every item again. */
function getPeruntukanTotalBreakdown(storageBreakdown){
  const totals = {};
  storageBreakdown.forEach(sb=>{
    sb.parts.forEach(p=>{
      const t = totals[p.id] || (totals[p.id] = { id:p.id, name:p.name, val:0 });
      t.val += p.val;
    });
  });
  const entries = Object.values(totals).sort((a,b)=>b.val-a.val);
  const total = entries.reduce((s,e)=>s+e.val,0);
  return entries.map(e=>({...e, pct: total>0 ? (e.val/total*100) : 0}));
}
/* ---------- Donut chart for "Nilai Stok" distribution ---------- */
const DONUT_COLORS = ['#6B3F22','#8B5E3C','#A97C52','#C39A72','#D9B896','#E8CEB0','#F1E0C9'];
function donutSegmentColor(i){ return DONUT_COLORS[i % DONUT_COLORS.length]; }
function donutGradientCss(entries){
  const total = entries.reduce((s,e)=>s+e.val,0);
  if(total<=0) return 'var(--surface-2)';
  let acc = 0;
  const stops = entries.map((e,i)=>{
    const start = acc;
    acc += (e.val/total*100);
    return `${donutSegmentColor(i)} ${start.toFixed(3)}% ${acc.toFixed(3)}%`;
  });
  return `conic-gradient(${stops.join(', ')})`;
}
function donutChartHtml(entries, mode, holeLabel){
  const total = entries.reduce((s,e)=>s+e.val,0);
  if(entries.length===0 || total<=0) return '';
  const fmtVal = v => mode==='value' ? fmtIDR(v) : fmtNum(v);
  const valueStr = fmtVal(total);
  // The hole is a fixed ~110px circle -- a long Rupiah total ("Rp238.578.054")
  // set at the normal 16px was wider than that, so it spilled over the ring
  // instead of staying inside it. Scale the font down as the string grows
  // instead of letting it overflow.
  const valueFontSize = valueStr.length > 13 ? '12px' : valueStr.length > 10 ? '13.5px' : '16px';
  return `
    <div class="donut-wrap">
      <div class="donut" style="background:${donutGradientCss(entries)};">
        <div class="donut-hole">
          <div class="donut-hole-label">${escapeHtml(holeLabel||'Total')}</div>
          <div class="donut-hole-value" style="font-size:${valueFontSize};">${valueStr}</div>
          <div class="donut-hole-pct">100%</div>
        </div>
      </div>
      <div class="donut-legend">
        ${entries.map((e,i)=>`
          <div class="donut-legend-row">
            <div class="donut-legend-dot" style="background:${donutSegmentColor(i)};"></div>
            <div class="donut-legend-name">${escapeHtml(e.name)}</div>
            <div class="donut-legend-value">${fmtVal(e.val)}</div>
            <div class="donut-legend-pct">${e.pct.toFixed(0)}%</div>
          </div>`).join('')}
      </div>
    </div>`;
}
function getLowStockRows(){
  // Only items that have an actual stock record in Gudang Utama -- meaning
  // they've entered inventory at least once (a goods receipt, a transfer,
  // etc.) -- are eligible to be judged Rendah/Habis here. A Master Barang
  // entry that was just registered and never received yet is simply not in
  // inventory yet; it isn't "Habis" and shouldn't show up in this report.
  const rows = [];
  const seenPairs = new Set();
  state.stock.forEach(s=>{
    if(!isStorageWarehouse(s.warehouseId)) return; // Stok Rendah scoped to Gudang Utama only: consumption at gudang divisi isn't tracked outside Stock Opname, so a low-stock read there would be unreliable
    const item = itemById(s.itemId);
    if(!item) return;
    const pairKey = item.id + '__' + s.warehouseId;
    if(seenPairs.has(pairKey)) return; // combine peruntukan-split docs into one total per location, checked once
    seenPairs.add(pairKey);
    const qty = stockQty(s.warehouseId, item.id);
    const reorder = item.reorderLevel || 0;
    let status = null;
    if(qty <= 0) status = 'habis';
    else if(reorder > 0 && qty <= reorder) status = 'rendah';
    if(status) rows.push({ item, location: whById(s.warehouseId), qty, reorder, status, sortTime: s.updatedAt || item.createdAt || '' });
  });
  rows.sort((a,b)=>{
    if(a.status !== b.status) return a.status==='rendah' ? -1 : 1;
    if(a.status==='habis') return new Date(b.sortTime) - new Date(a.sortTime);
    return a.qty - b.qty;
  });
  return rows;
}

function renderDashboard(){
  const role = currentRole();
  if(role.kind==='kitchen_leader'){ renderKitchenLeaderDashboard(); return; }
  const totalItemTypes = state.items.length;
  const itemsWithStock = state.items.filter(i=>totalStock(i.id) > 0).length;
  const stockCoveragePct = totalItemTypes > 0 ? (itemsWithStock / totalItemTypes * 100) : 0;
  const inventoryValue = state.items.reduce((s,i)=> s + totalStock(i.id) * (i.lastPrice||0), 0);
  const pendingDocs = pendingCount();

  const now = new Date();
  const startOfThisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const startOfLastMonth = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const receivingThisMonthDocs = new Set(state.transactions.filter(t=>t.type==='in' && new Date(t.createdAt) >= startOfThisMonth).map(t=>t.docNumber)).size;
  const receivingLastMonthDocs = new Set(state.transactions.filter(t=>t.type==='in' && new Date(t.createdAt) >= startOfLastMonth && new Date(t.createdAt) < startOfThisMonth).map(t=>t.docNumber)).size;
  /* Value-based comparison (not just transaction count): this month's total
     Rp received so far vs last month's Rp up to the SAME day-of-month, which
     is the fair "running rate" comparison -- and a projection of where this
     month will land if the current daily pace holds, so the number is
     meaningful before the month has actually finished. */
  const dayOfMonth = now.getDate();
  const daysInThisMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const startOfLastMonthSameDay = new Date(now.getFullYear(), now.getMonth()-1, dayOfMonth+1); // exclusive end
  const receivingValueThisMonth = state.transactions.filter(t=>t.type==='in' && new Date(t.createdAt) >= startOfThisMonth).reduce((s,t)=>s+(t.totalValue||0),0);
  const receivingValueLastMonth = state.transactions.filter(t=>t.type==='in' && new Date(t.createdAt) >= startOfLastMonth && new Date(t.createdAt) < startOfThisMonth).reduce((s,t)=>s+(t.totalValue||0),0);
  const receivingValueLastMonthToSameDay = state.transactions.filter(t=>t.type==='in' && new Date(t.createdAt) >= startOfLastMonth && new Date(t.createdAt) < startOfLastMonthSameDay).reduce((s,t)=>s+(t.totalValue||0),0);
  const runRateProjected = dayOfMonth>0 ? (receivingValueThisMonth / dayOfMonth * daysInThisMonth) : 0;
  let receivingCompareHtml = '';
  if(receivingLastMonthDocs > 0){
    const pct = Math.round(((receivingThisMonthDocs - receivingLastMonthDocs) / receivingLastMonthDocs) * 100);
    const up = pct >= 0;
    receivingCompareHtml = `<div class="kpi-compare ${up?'up':'down'}">${up?'↑':'↓'} ${up?'+':''}${pct}% <span>dibanding bulan lalu</span></div>`;
  } else if(receivingThisMonthDocs > 0){
    receivingCompareHtml = `<div class="kpi-compare up">↑ Baru <span>dibanding bulan lalu</span></div>`;
  }
  let receivingRunRateHtml = '';
  if(receivingValueLastMonthToSameDay > 0){
    const ratePct = Math.round(((receivingValueThisMonth - receivingValueLastMonthToSameDay) / receivingValueLastMonthToSameDay) * 100);
    const rateUp = ratePct >= 0;
    receivingRunRateHtml = `<div class="kpi-compare ${rateUp?'up':'down'}">${rateUp?'↑':'↓'} ${rateUp?'+':''}${ratePct}% <span>run rate vs bulan lalu (hari 1–${dayOfMonth})</span></div>`;
  }

  let actions = '';
  if(role.kind==='master'){
    actions = `<button class="btn btn-primary" onclick="openReceivingModal()">${ICONS.plus} Penerimaan Barang</button>
      <button class="btn btn-outline" onclick="openStoreRequestModal()">Permintaan Barang</button>`;
  } else if(role.kind==='receiving'){
    actions = `<button class="btn btn-primary" onclick="openReceivingModal()">${ICONS.plus} Penerimaan Barang</button>
      ${pendingDocs>0 ? `<button class="btn btn-outline" onclick="gotoRequests()">Tinjau Permintaan (${pendingDocs})</button>` : ''}`;
  } else {

function dashboardMoveRow(t){
  const meta = txTypeMeta(t.type);
  const detail = t.fromWarehouseName && t.toWarehouseName ? `${t.fromWarehouseName} → ${t.toWarehouseName}` : (t.toWarehouseName || t.fromWarehouseName || '—');
  const signed = (t.type==='in') ? '+' : '';

  const qtyLabel = t.requestedUnit ? (fmtNum(t.requestedQty) + ' ' + escapeHtml(t.requestedUnit)) : (fmtNum(t.qty) + ' ' + escapeHtml(t.uom||''));
  return `<div class="move-row ${openFn?'clickable':''}" ${openFn?`onclick="${openFn}"`:''}>

function dayDividerLabel(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  const now = new Date();
  const startOfDay = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
  if(diffDays === 0) return 'Hari Ini';
  if(diffDays === 1) return 'Kemarin';
  return d.toLocaleDateString('id-ID',{weekday:'long', day:'2-digit', month:'long', year:'numeric'});
}
/* Renders a list of transaction rows (already sorted newest-first, as
   state.transactions always is) with a sticky-looking divider label
   inserted whenever the calendar day changes, so a quick glance at the
   feed shows where "today" ends and earlier activity begins. */
function renderMoveRowsWithDividers(rows){
  let html = '';
  let lastDayKey = null;
  rows.forEach(t=>{
    const d = t.createdAt ? new Date(t.createdAt) : null;
    const dayKey = d ? (d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()) : '—';
    if(dayKey !== lastDayKey){
      html += `<div class="move-day-divider">${dayDividerLabel(t.createdAt)}</div>`;
      lastDayKey = dayKey;
    }
    html += dashboardMoveRow(t);
  });
  return html;
}

function getFilteredInventoryRows(){
  // renderInventory() already sanitizes state.invLocation/invPeruntukan against
  // the current role's scope before this runs, so it's safe to read them as-is.
  const scope = allowedInventoryWarehouseIds(currentRole()); // null = unrestricted, else allowed warehouse ids
  const locationId = state.invLocation;
  const peruntukan = state.invPeruntukan;
  let rows = [];

  if(!locationId){
    // Semua Lokasi: one row per item, summed across every location it sits in
    // (or, for a scoped role, across just the warehouse(s) it's allowed to see)
    const whsInScope = scope ? WAREHOUSES.filter(w=>scope.includes(w.id)) : WAREHOUSES;
    state.items.forEach(item=>{
      const qty = peruntukan
        ? STORAGE_WAREHOUSES.reduce((s,w)=> s + stockQtyByPeruntukan(w.id, item.id, peruntukan), 0)
        : whsInScope.reduce((s,w)=> s + stockQty(w.id, item.id), 0);
      if(qty > 0){
        const locCount = whsInScope.filter(w => (peruntukan ? stockQtyByPeruntukan(w.id, item.id, peruntukan) : stockQty(w.id, item.id)) > 0).length;
        rows.push({item, w:null, qty, locCount});
      }
    });
  } else {
    const w = whById(locationId);
    const usesPeruntukan = isStorageWarehouse(locationId) && peruntukan;
    state.items.forEach(item=>{
      const qty = usesPeruntukan ? stockQtyByPeruntukan(locationId, item.id, peruntukan) : stockQty(locationId, item.id);
      if(qty > 0) rows.push({item, w, qty, locCount:1});
    });
  }

  if(state.invSearch){ const q = state.invSearch.toLowerCase(); rows = rows.filter(r=>(r.item.name||'').toLowerCase().includes(q) || (r.item.kode||'').toLowerCase().includes(q)); }
  if(state.invCategory) rows = rows.filter(r=>r.item.category===state.invCategory);
  const sortFns = {
    name_asc: (a,b)=>(a.item.name||'').localeCompare(b.item.name||''),
    name_desc: (a,b)=>(b.item.name||'').localeCompare(a.item.name||''),
    newest: (a,b)=> new Date(b.item.createdAt||0) - new Date(a.item.createdAt||0),
    oldest: (a,b)=> new Date(a.item.createdAt||0) - new Date(b.item.createdAt||0),
  };
  rows.sort(sortFns[state.invSort] || sortFns.name_asc);
  return rows;
}

function renderInventory(){
  const role = currentRole();
  const scope = allowedInventoryWarehouseIds(role); // null = unrestricted, else allowed warehouse ids
  // Sanitize filter state against scope before reading it anywhere below --
  // a role switch (or stale state) must never leave a disallowed location selected.
  if(scope){
    if(state.invLocation && !scope.includes(state.invLocation)) state.invLocation = '';

      </div>

      <div class="filter-row" style="border-bottom:none; padding-bottom:6px;">
        <input type="text" id="invSearchInput" style="flex:1; min-width:220px;" placeholder="Cari nama atau kode barang…" value="${escapeHtml(state.invSearch)}" oninput="setInvSearch(this.value)">
        ${filtersActive ? `<button class="btn btn-sm btn-outline" onclick="resetInvFilters()">Reset</button>` : ''}
      </div>
      <div class="filter-row" style="padding-top:0;">
        <select onchange="setInvCategory(this.value)"><option value="">Semua Kategori</option>${ITEM_CATEGORIES.map(c=>`<option value="${c}" ${state.invCategory===c?'selected':''}>${c}</option>`).join('')}</select>
        ${!scope ? `<select onchange="setInvPeruntukan(this.value)" ${peruntukanDisabled?'disabled title="Peruntukan hanya berlaku untuk stok di Gudang Utama"':''}><option value="">Semua Peruntukan</option>${PERUNTUKAN_OPTIONS.map(p=>`<option value="${p.id}" ${state.invPeruntukan===p.id?'selected':''}>${p.name}</option>`).join('')}</select>` : ''}
        <select onchange="setInvSort(this.value)">
          <option value="name_asc" ${state.invSort==='name_asc'?'selected':''}>Nama: A ke Z</option>
          <option value="name_desc" ${state.invSort==='name_desc'?'selected':''}>Nama: Z ke A</option>

        </select>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Kode</th><th>Nama Barang</th><th>Kategori</th><th>${showingPeruntukanColumn?'Peruntukan':'Lokasi'}</th><th class="num">Jumlah</th><th>Satuan</th><th class="num">Harga/Satuan</th><th class="num">Nilai Stok</th></tr></thead>
          <tbody>

function setOpnamePeriod(v){ state.opnamePeriod = v; render(); }
function renderOpnameChartBlock(history){
  if(history.length < 2){
    return `<div class="panel-body"><div class="empty-row" style="padding:22px 16px;">Grafik akan muncul setelah minimal 2 bulan difinalisasi.</div></div>`;
  }
  const w = 720, h = 200, padL = 10, padR = 10, padT = 20, padB = 30;
  const chartW = w - padL - padR, chartH = h - padT - padB;
  const pctValues = history.map(s => s.netSales ? (s.totalValue / s.netSales * 100) : 0);
  const maxPct = Math.max(...pctValues, 1) * 1.25;
  const gap = chartW / history.length;
  const barW = Math.min(46, gap * 0.55);
  const bars = history.map((s,i)=>{
    const pct = pctValues[i];
    const barH = maxPct>0 ? (pct/maxPct*chartH) : 0;
    const x = padL + i*gap + (gap-barW)/2;
    const y = padT + chartH - barH;
    const monthShort = periodLabel(s.periodKey).split(' ')[0].slice(0,3);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(2,barH).toFixed(1)}" rx="3" fill="#6B3F22"></rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B3F22">${pct.toFixed(1)}%</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${(padT+chartH+18).toFixed(1)}" text-anchor="middle" font-size="10" fill="#A19A8F">${monthShort}</text>`;
  }).join('');
  const last = pctValues[pctValues.length-1];
  const prev = pctValues[pctValues.length-2];
  const diff = last - prev;
  const trendWord = Math.abs(diff) < 0.05 ? 'stabil dibanding' : (diff > 0 ? 'naik ' + diff.toFixed(1) + ' poin dibanding' : 'turun ' + Math.abs(diff).toFixed(1) + ' poin dibanding');
  const avg = pctValues.reduce((s,v)=>s+v,0) / pctValues.length;
  const analysis = `<b>${periodLabel(history[history.length-1].periodKey)}</b>: stok setara <b>${last.toFixed(1)}%</b> dari penjualan bulan itu, ${trendWord} bulan sebelumnya. Rata-rata ${history.length} bulan terakhir: <b>${avg.toFixed(1)}%</b>.`;
  return `
    <div class="panel-body" style="padding:16px;">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block; max-height:220px;">${bars}</svg>
      <div class="cell-sub" style="margin-top:8px; font-size:12px; line-height:1.6;">${analysis}</div>
    </div>
  `;
}

/* =========================================================
   STOCK OPNAME — hitung fisik per lokasi
========================================================= */
let opnameCounts = {};
// Maps itemId -> 'goods' | 'wip' for items added manually during this
// counting session (via "Tambah Barang" / "Tambah Barang WIP") rather than
// auto-populated from existing system stock. These are recorded only in the
// opname data (allItemsDetail / locationAddedGoodsValues / locationAddedWipValues)
// and never go through adjustStock, so they can never touch real inventory.
let opnameAdded = {};
// Tracks which items the counter has actually typed a physical count for.
// opnameCounts still defaults every item to its system quantity right away
// (so the diff/total math and the final submit always have a real number to
// work with), but until an item is touched its input is shown BLANK rather
// than pre-filled with that system quantity -- a pre-filled number that
// already matches "Stok Sistem" looks like it was already counted, which is
// exactly the confusion that led people to skip actually counting it.
let opnameTouched = {};
/* ---------- Draft persistence -----------------------------------------
   opnameCounts/opnameAdded/opnameTouched above only ever lived in memory,
   so anything the counter typed vanished the moment the tab reloaded or the
   session ended -- the "Stok Sistem" figure would then re-populate from
   whatever the CURRENT live stock is (which may have moved on since), and
   it looked like the previously-entered selisih had simply disappeared.
   These functions save that in-progress count to an opnameDrafts doc
   (locationId+periodKey) so it survives a reload and resumes exactly where
   it was left, without needing to finish counting in one sitting. */
function opnameDraftDocId(locationId, periodKey){ return locationId + '__' + periodKey; }
function findOpnameDraft(locationId, periodKey){ return state.opnameDrafts.find(d=>d.locationId===locationId && d.periodKey===periodKey) || null; }
let opnameDraftSaveTimer = null;
function scheduleOpnameDraftSave(){
  if(opnameDraftSaveTimer) clearTimeout(opnameDraftSaveTimer);
  opnameDraftSaveTimer = setTimeout(()=>{ opnameDraftSaveTimer = null; saveOpnameDraftNow(true); }, 1500);
}
async function saveOpnameDraftNow(silent){
  const locationId = state.opnameCountLocation;
  if(!locationId) return;
  const periodKey = state.opnamePeriod || currentPeriodKey();
  const statusEl = document.getElementById('opnameDraftStatus');
  if(statusEl) statusEl.textContent = 'Menyimpan draft…';
  try{
    const nowIso = new Date().toISOString();
    await db.doc('opnameDrafts/' + opnameDraftDocId(locationId, periodKey)).set({
      locationId, periodKey,
      counts: {...opnameCounts}, touched: {...opnameTouched}, added: {...opnameAdded},
      updatedAt: nowIso,
    });
    const el = document.getElementById('opnameDraftStatus');
    if(el) el.textContent = 'Draft tersimpan · ' + fmtTime(nowIso);
    if(!silent) toast('Draft opname ' + whName(locationId) + ' tersimpan.');
  }catch(err){
    const el = document.getElementById('opnameDraftStatus');
    if(el) el.textContent = 'Gagal menyimpan draft — coba lagi.';
    if(!silent) toast(err.message || 'Gagal menyimpan draft. Coba lagi.', true);
  }
}
function saveOpnameDraftManual(){
  if(opnameDraftSaveTimer){ clearTimeout(opnameDraftSaveTimer); opnameDraftSaveTimer = null; }
  saveOpnameDraftNow(false);
}
async function deleteOpnameDraft(locationId, periodKey){
  try{ await db.doc('opnameDrafts/' + opnameDraftDocId(locationId, periodKey)).delete(); }catch(err){ /* best-effort cleanup */ }
}
// Flushes any not-yet-saved edit (the debounce is still pending) before
// leaving the counting page, so navigating away right after typing doesn't
// lose the last couple of seconds' worth of counts.
function backToOpnameList(){
  if(opnameDraftSaveTimer){ clearTimeout(opnameDraftSaveTimer); opnameDraftSaveTimer = null; saveOpnameDraftNow(true); }
  goto('stockopname');
}
function openOpnameCounting(locationId){
  if(!canManageGudang(currentRole())){ toast('Peran ini tidak dapat melakukan Stock Opname.', true); return; }
  state.opnameCountLocation = locationId;
  opnameCounts = {};
  opnameAdded = {};
  opnameTouched = {};
  state.items.forEach(item=>{
    const qty = stockQty(locationId, item.id);
    if(qty > 0) opnameCounts[item.id] = srHasSmallUnit(item) ? qty * item.conversionQty : qty;
  });
  const periodKey = state.opnamePeriod || currentPeriodKey();
  const draft = findOpnameDraft(locationId, periodKey);
  if(draft){
    // Overlay the saved draft on top of the live-stock baseline above --
    // items the counter never got to still fall back to current system
    // stock (untouched, blank input), exactly like starting fresh would.
    Object.assign(opnameCounts, draft.counts || {});
    opnameTouched = {...(draft.touched || {})};
    opnameAdded = {...(draft.added || {})};
    toast('Draft opname ' + whName(locationId) + ' dilanjutkan (tersimpan terakhir ' + fmtTime(draft.updatedAt) + ').');
  }
  state.opnameSearch = ''; state.opnamePage = 1; state.opnamePeruntukan = ''; state.opnameSort = 'name_asc';
  goto('opname-count');
}
function setOpnameSearch(v){ state.opnameSearch = v; state.opnamePage = 1; render(); }
function setOpnamePage(p){ state.opnamePage = p; render(); }
function setOpnamePeruntukan(v){ state.opnamePeruntukan = v; state.opnamePage = 1; render(); }
function setOpnameSort(v){ state.opnameSort = v; state.opnamePage = 1; render(); }
function resetOpnameFilters(){ state.opnameSearch=''; state.opnamePeruntukan=''; state.opnameSort='name_asc'; state.opnamePage=1; render(); }
/* Converts a canonical (large-unit) qty into whatever unit this item is being
   counted/displayed in here -- mirrors opnameSystemDisplay's own conversion,
   so a Peruntukan breakdown always lines up with the "Stok Sistem" number it
   explains instead of silently being in a different unit. */
function opnameDisplayQty(item, canonicalQty){ return srHasSmallUnit(item) ? canonicalQty * item.conversionQty : canonicalQty; }
function opnameSystemDisplay(locationId, item){
  const system = stockQty(locationId, item.id);
  return srHasSmallUnit(item) ? system * item.conversionQty : system;
}
function opnameUpdateCount(itemId, value){
  opnameCounts[itemId] = parseFloat(value) || 0;
  opnameTouched[itemId] = true;
  const locationId = state.opnameCountLocation;
  const item = itemById(itemId);
  const systemDisplay = opnameSystemDisplay(locationId, item);
  const diff = Math.round((opnameCounts[itemId] - systemDisplay) * 1000) / 1000;
  const cell = document.getElementById('opnameDiff-' + itemId);
  if(cell){
    cell.style.color = diff===0 ? 'var(--text-faint)' : (diff>0 ? 'var(--success)' : 'var(--danger)');
    cell.textContent = diff===0 ? '—' : (diff>0?'+':'')+fmtNum(diff);
  }
  opnameUpdateTotals();
  scheduleOpnameDraftSave();
}
function opnameUpdateTotals(){
  const locationId = state.opnameCountLocation;
  let totalValue = 0, addedGoodsValue = 0, addedWipValue = 0, changedCount = 0;
  Object.keys(opnameCounts).forEach(itemId=>{
    const item = itemById(itemId);
    if(!item) return;
    const useSmall = srHasSmallUnit(item);
    const canonicalQty = useSmall ? (opnameCounts[itemId] / item.conversionQty) : opnameCounts[itemId];
    const value = canonicalQty * (item.lastPrice||0);
    const addedType = opnameAdded[itemId];
    if(addedType==='wip'){ addedWipValue += value; return; }
    if(addedType==='goods'){ addedGoodsValue += value; return; }
    totalValue += value;
    const systemDisplay = opnameSystemDisplay(locationId, item);
    if(Math.abs(opnameCounts[itemId] - systemDisplay) > 0.0001) changedCount++;
  });
  const hint = document.getElementById('opnameTotalHint');
  if(hint) hint.innerHTML = 'Total Nilai (fisik): <b>' + fmtIDR(totalValue) + '</b>'
    + (addedGoodsValue>0 ? ' · Penambahan Barang: <b>' + fmtIDR(addedGoodsValue) + '</b>' : '')
    + (addedWipValue>0 ? ' · Penambahan WIP: <b>' + fmtIDR(addedWipValue) + '</b>' : '')
    + ' · ' + changedCount + ' barang direvisi';
}
function wipCategoryFor(locationId){
  if(locationId==='kitchen') return 'WIP Kitchen';
  if(locationId==='bar') return 'WIP Bar';
  return null;
}
function renderOpnameCounting(){

  if(!w){ goto('stockopname'); return; }

  if(!isStorage) state.opnamePeruntukan = ''; // Peruntukan only exists at Gudang Utama
  let items = Object.keys(opnameCounts).map(id=>itemById(id)).filter(Boolean);
  if(state.opnameSearch){ const q = state.opnameSearch.toLowerCase(); items = items.filter(i=>(i.name||'').toLowerCase().includes(q) || (i.kode||'').toLowerCase().includes(q)); }
  if(isStorage && state.opnamePeruntukan){
    // Items added manually here (Tambah Barang / Tambah Barang WIP) never had
    // real stock to begin with, so they have no Peruntukan of their own --
    // always keep them visible rather than have the filter hide them.
    items = items.filter(i => opnameAdded.hasOwnProperty(i.id) || stockQtyByPeruntukan(locationId, i.id, state.opnamePeruntukan) > 0);
  }
  const opnameSortFns = {
    name_asc: (a,b)=>(a.name||'').localeCompare(b.name||''),
    name_desc: (a,b)=>(b.name||'').localeCompare(a.name||''),
    selisih_desc: (a,b)=>{
      const da = Math.abs((opnameCounts[a.id]||0) - opnameSystemDisplay(locationId, a));
      const db = Math.abs((opnameCounts[b.id]||0) - opnameSystemDisplay(locationId, b));
      return db - da || (a.name||'').localeCompare(b.name||'');
    },
  };
  items.sort(opnameSortFns[state.opnameSort] || opnameSortFns.name_asc);

                </tr>`;

          </tbody>
        </table>
      </div>
      ${paginationHtml(state.opnamePage, totalPages, items.length, pageSize, 'setOpnamePage', 'barang')}
    </div>

function openAddWipModal(){
  const locationId = state.opnameCountLocation;
  const wipCategory = wipCategoryFor(locationId);
  if(!wipCategory) return;
  // Show every WIP item for this division here (not only the ones still
  // missing from the count), so nothing is ever hidden from view -- items
  // already in the count list are marked and just get closed/edited inline
  // in the main table, instead of silently disappearing from this picker.
  const allWipItems = state.items.filter(i=>i.category===wipCategory).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(allWipItems.length===0){
    toast('Belum ada barang berkategori "' + wipCategory + '" di Master Data. Tambahkan dulu di halaman Barang, baru bisa dipilih di sini.', true);
    return;
  }

    <div id="wipError"></div>
    ${available.length===0 ? `<div class="lock-note" style="margin:0 0 12px;">Semua ${available.length+already.length} barang ${escapeHtml(wipCategory)} sudah ada di daftar hitung di bawah -- tidak ada yang perlu ditambahkan lagi.</div>` : `

async function submitOpnameCounting(){
  const locationId = state.opnameCountLocation;
  const periodKey = state.opnamePeriod || currentPeriodKey();
  const btn = document.getElementById('opnameSubmitBtn');
  if(btn){ if(btn.disabled) return; btn.disabled = true; }
  showLoading('Menyimpan hasil opname…');

  if(ok){
    if(opnameDraftSaveTimer){ clearTimeout(opnameDraftSaveTimer); opnameDraftSaveTimer = null; }

  }

function exportOpnameTemplateAll(){
  const periodKey = state.opnamePeriod || currentPeriodKey();
  const rows = [];
  WAREHOUSES.forEach(w=>{
    const addedItemIds = new Set();
    state.items.forEach(item=>{
      const qty = stockQty(w.id, item.id);
      if(qty <= 0) return;
      addedItemIds.add(item.id);
      const useSmall = srHasSmallUnit(item);
      const unit = useSmall ? item.smallUnit : item.uom;
      const displayQty = useSmall ? qty * item.conversionQty : qty;
      rows.push({
        'Lokasi': w.name,
        'Kode': item.kode || '',
        'Nama Barang': item.name,
        'Kategori': item.category || '',
        'Satuan Hitung': unit || '',
        'Stok Sistem': Math.round(displayQty*1000)/1000,
        'Jumlah Fisik': Math.round(displayQty*1000)/1000,
      });
    });
    // WIP items never arrive via Penerimaan Barang, so they'd have zero stock and never
    // show up above -- include them anyway for Kitchen/Bar so they can be counted here too.
    const wipCategory = wipCategoryFor(w.id);
    if(wipCategory){
      state.items.filter(i=>i.category===wipCategory && !addedItemIds.has(i.id)).forEach(item=>{
        const useSmall = srHasSmallUnit(item);
        const unit = useSmall ? item.smallUnit : item.uom;
        rows.push({
          'Lokasi': w.name,
          'Kode': item.kode || '',
          'Nama Barang': item.name,
          'Kategori': item.category,
          'Satuan Hitung': unit || '',
          'Stok Sistem': 0,
          'Jumlah Fisik': 0,
        });
      });
    }
  });
  if(rows.length===0){ toast('Tidak ada barang untuk diekspor.', true); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:18},{wch:12},{wch:34},{wch:16},{wch:14},{wch:13},{wch:13}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Template Opname');
  XLSX.writeFile(wb, 'Template_Opname_Semua_Lokasi_' + periodKey + '.xlsx');
  toast('Template Excel semua lokasi berhasil diunduh (' + rows.length + ' baris).');
}
function handleOpnameImportAllFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  showLoading('Membaca file Excel…');
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});

      const locationIdsSeen = new Set();
      const unmatchedRows = [];
      const parsedRows = [];
      rows.forEach(row=>{
        const lokasiName = String(row['Lokasi']||'').trim();
        const kode = String(row['Kode']||'').trim();
        const namaBarang = String(row['Nama Barang']||'').trim();
        const fisikRaw = row['Jumlah Fisik'];
        if(fisikRaw === '' || fisikRaw === undefined || fisikRaw === null) return;
        const w = WAREHOUSES.find(x=>x.name.toLowerCase()===lokasiName.toLowerCase());
        if(!w){ unmatchedRows.push(lokasiName + ' / ' + (namaBarang||kode||'?')); return; }
        let item = kode ? findItemByKode(kode) : null;
        if(!item && namaBarang) item = state.items.find(i=>(i.name||'').toLowerCase()===namaBarang.toLowerCase());
        if(!item){ unmatchedRows.push(lokasiName + ' / ' + (namaBarang||kode||'?')); return; }
        locationIdsSeen.add(w.id);
        parsedRows.push({ locationId: w.id, itemId: item.id, qty: parseFloat(fisikRaw) || 0 });
      });

      if(locationIdsSeen.size === 0){ hideLoading(); toast('Tidak ada baris yang cocok di file ini.', true); inputEl.value=''; return; }

      // Pre-seed each location with its full current item set (safety net if some rows were removed from the file), then overlay uploaded values.
      const byLocation = {};
      locationIdsSeen.forEach(locId=>{
        byLocation[locId] = {};
        state.items.forEach(item=>{
          const qty = stockQty(locId, item.id);
          if(qty > 0) byLocation[locId][item.id] = srHasSmallUnit(item) ? qty*item.conversionQty : qty;
        });
      });
      parsedRows.forEach(r=>{ byLocation[r.locationId][r.itemId] = r.qty; });

      hideLoading();
      inputEl.value = '';
      const locationNames = [...locationIdsSeen].map(id=>whName(id)).join(', ');
      openConfirm(
        'Proses Import Opname',
        'File ini mencakup ' + locationIdsSeen.size + ' lokasi (' + locationNames + '). Stok di lokasi-lokasi tersebut akan langsung dikoreksi sesuai isi file. Lanjutkan?',
        async ()=>{
          showLoading('Memproses opname dari Excel…');
          const periodKey = state.opnamePeriod || currentPeriodKey();
          let locationsProcessed = 0;
          for(const locationId of locationIdsSeen){
            const ok = await actionSubmitOpnameCount(locationId, byLocation[locationId], periodKey);
            if(ok) locationsProcessed++;
          }
          hideLoading();
          toast('Import selesai: ' + locationsProcessed + ' lokasi diproses' + (unmatchedRows.length ? ', ' + unmatchedRows.length + ' baris tidak cocok.' : '.'));
        },
        'Proses',
        false
      );
    }catch(err){
      hideLoading();
      inputEl.value = '';
      toast('Gagal membaca file. Pastikan formatnya sesuai Template Opname yang diunduh dari sini.', true);
    }
  };
  reader.readAsArrayBuffer(file);
}
function findItemByKode(kode){
  const k = kode.toLowerCase();
  return state.items.find(i=>(i.kode||'').toLowerCase()===k);
}

function pageNumberTokens(current, total){
  const pages = [1, total];
  for(let p=current-1; p<=current+1; p++){ if(p>=1 && p<=total) pages.push(p); }
  const uniqueSorted = [...new Set(pages)].sort((a,b)=>a-b);
  const withDots = []; let prev = 0;
  uniqueSorted.forEach(p=>{ if(p - prev > 1) withDots.push('...'); withDots.push(p); prev = p; });
  return withDots;
}
function paginationHtml(current, total, totalRows, pageSize, onPageFn, unitLabel){
  if(total<=1) return '';
  const tokens = pageNumberTokens(current, total);
  const rangeStart = (current-1)*pageSize + 1;
  const rangeEnd = Math.min(current*pageSize, totalRows);
  return `<div class="pagination-row">
      <div class="pagination-info">Showing ${rangeStart}–${rangeEnd} of ${fmtNum(totalRows)} ${unitLabel||'rows'}</div>
      <div class="pagination-pages">
        <button class="page-btn" ${current<=1?'disabled':''} onclick="${onPageFn}(${current-1})">‹</button>
        ${tokens.map(t=> t==='...' ? `<span class="page-dots">…</span>` : `<button class="page-btn ${t===current?'active':''}" onclick="${onPageFn}(${t})">${t}</button>`).join('')}
        <button class="page-btn" ${current>=total?'disabled':''} onclick="${onPageFn}(${current+1})">›</button>
      </div>
    </div>`;
}

function groupByDocNumber(list){
  const groups = {};
  list.forEach(t=>{
    if(!groups[t.docNumber]) groups[t.docNumber] = { docNumber:t.docNumber, lines:[], createdAt:t.createdAt };
    groups[t.docNumber].lines.push(t);
  });
  return Object.values(groups).sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
}
function docLocationLabel(lines){
  const names = [...new Set(lines.map(l=>l.toWarehouseName).filter(Boolean))];
  if(names.length===0) return '—';
  if(names.length===1) return names[0];
  return names.length + ' lokasi';
}
function inDateRange(iso, fromDate, toDate){
  if(!iso) return true;
  const t = new Date(iso).getTime();
  if(fromDate){ const from = new Date(fromDate); from.setHours(0,0,0,0); if(t < from.getTime()) return false; }
  if(toDate){ const to = new Date(toDate); to.setHours(23,59,59,999); if(t > to.getTime()) return false; }
  return true;
}

    ${(opts.search || opts.dateFrom || opts.dateTo) ? `<button class="btn btn-sm btn-outline" onclick="${opts.onReset}()">Reset</button>` : ''}`;
}

async function submitReceivingAttachment(docNumber, inputEl){
  const file = inputEl.files && inputEl.files[0];
  const err = document.getElementById('grAttachError');
  if(!file) return;
  if(file.type !== 'application/pdf'){ if(err) err.innerHTML = errBox('File harus PDF.'); inputEl.value=''; return; }
  if(file.size > 20*1024*1024){ if(err) err.innerHTML = errBox('Ukuran PDF maksimal 20MB.'); inputEl.value=''; return; }
  if(!assetsCap){ if(err) err.innerHTML = errBox('Lampiran tidak bisa diunggah di tampilan ini.'); return; }
  inputEl.disabled = true;
  showLoading('Mengunggah lampiran…');
  try{
    const result = await assetsCap.upload(file, {type:'application/pdf'});
    const lines = state.transactions.filter(t=>t.type==='in' && t.docNumber===docNumber);
    for(const line of lines){
      await db.doc('transactions/'+line.id).update({attachmentId: result.id});
    }
    hideLoading();
    toast('Lampiran PDF berhasil ditambahkan ke ' + docNumber + '.');
    openReceivingDetail(docNumber);
  }catch(e){
    hideLoading();
    if(err) err.innerHTML = errBox('Gagal mengunggah PDF (' + (e && e.code ? e.code : 'error') + '). Coba lagi.');
    inputEl.disabled = false;
  }
}

  const body = `
    <div class="lock-note">Divisi <b>${escapeHtml(first.divisionName || first.toWarehouseName)}</b>${first.divisionName && first.divisionName!==first.toWarehouseName ? ` · Gudang ${escapeHtml(first.toWarehouseName)}` : ''} · ${fmtDate(first.createdAt)}</div>

        const primary = l.requestedUnit ? (fmtNum(l.requestedQty) + ' ' + escapeHtml(l.requestedUnit)) : (fmtNum(l.qty) + ' ' + escapeHtml(l.uom||''));

function openEditSrModal(docNumber){
  const existingLines = state.transactions.filter(t=>t.type==='request' && t.docNumber===docNumber);
  if(existingLines.length===0) return;
  const first = existingLines[0];
  const role = currentRole();
  if(first.status!=='menunggu'){ toast('Permintaan ini sudah diproses, tidak bisa diubah lagi.', true); return; }
  if(!canEditSR(role, first)){ toast('Anda tidak dapat mengubah permintaan ini.', true); return; }
  srLines = existingLines.map(l=>({
    itemId: l.itemId,
    qty: l.requestedUnit ? l.requestedQty : l.qty,
    unit: l.requestedUnit ? 'small' : 'uom',
    _txId: l.id,
  }));
  /* A Kitchen Leader revising this request gets their own "Catatan Revisi"
     field instead of overwriting the original requester's Catatan -- so
     Receiving can tell, when they open the request, which note came from
     whoever asked for it and which came from the leader's revision. */
  const isLeaderEdit = role.kind==='kitchen_leader';
  const noteFieldHtml = isLeaderEdit
    ? `${first.note ? `<div class="field"><label>Catatan dari ${escapeHtml(first.divisionName||first.toWarehouseName)}</label><div class="cell-sub" style="background:var(--surface-2); padding:8px 10px; border-radius:6px;">${escapeHtml(first.note)}</div></div>` : ''}
       <div class="field"><label>Catatan Revisi (Kitchen Leader)</label><textarea id="srLeaderNote" placeholder="Kenapa jumlah/barang direvisi">${escapeHtml(first.leaderNote||'')}</textarea></div>`
    : `<div class="field"><label>Catatan</label><textarea id="srNote" placeholder="Untuk keperluan apa">${escapeHtml(first.note||'')}</textarea></div>`;
  const body = `
    <div id="srError"></div>
    <div class="lock-note">Mengubah Permintaan <b>${docNumber}</b> untuk <b>${escapeHtml(first.divisionName||first.toWarehouseName)}</b>.</div>
    <div class="field"><label>Barang</label><div id="srLinesBox"></div>
      <button type="button" class="mini-link-btn" style="margin-top:2px;" onclick="srAddLine()">+ Tambah Barang</button>
    </div>
    ${noteFieldHtml}
  `;
  const foot = `<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="submitEditSr('${docNumber}', ${isLeaderEdit})">Simpan Perubahan</button>`;
  openModal('Edit Permintaan ' + docNumber, body, foot);
  srRenderLines();
}
async function submitEditSr(docNumber, isLeaderEdit){
  const noteFields = isLeaderEdit
    ? { leaderNote: document.getElementById('srLeaderNote').value.trim(), leaderNoteBy: currentUserName || null }
    : { note: document.getElementById('srNote').value.trim() };
  const err = document.getElementById('srError');
  const validLines = srLines.filter(l=>l.itemId && parseFloat(l.qty)>0);
  if(validLines.length===0){ err.innerHTML = errBox('Pilih minimal 1 barang dengan jumlah lebih dari 0.'); return; }
  const lines = validLines.map(l=>{
    const item = itemById(l.itemId);
    const enteredQty = parseFloat(l.qty);
    const useSmall = l.unit==='small' && srHasSmallUnit(item);
    return {
      itemId: l.itemId,
      qty: useSmall ? (enteredQty / item.conversionQty) : enteredQty,
      requestedQty: useSmall ? enteredQty : null,
      requestedUnit: useSmall ? item.smallUnit : null,
      _txId: l._txId || null,
    };
  });
  await submitGuarded(err, async ()=>{ await actionEditStoreRequestDoc(docNumber, lines, noteFields); });
}

function openWipDetail(docNumber){
  const lines = state.transactions.filter(t=>t.type==='wiprequest' && t.docNumber===docNumber);
  if(lines.length===0) return;
  const role = currentRole();
  const first = lines[0];
  if(!canSeeSRForDivision(role, first.divisionId)){ toast('Anda tidak dapat melihat permintaan ini.', true); return; }
  const body = `
    <div class="lock-note">Divisi <b>${escapeHtml(first.divisionName||'—')}</b> · ${fmtDate(first.createdAt)}</div>
    <div class="table-scroll" style="border:1px solid var(--border); border-radius:8px;">
      <table><thead><tr><th>Barang</th><th class="num">Jumlah</th></tr></thead>
      <tbody>${lines.map(l=>{
        const primary = l.requestedUnit ? (fmtNum(l.requestedQty) + ' ' + escapeHtml(l.requestedUnit)) : (fmtNum(l.qty) + ' ' + escapeHtml(l.uom||''));
        const sub = l.requestedUnit ? `<div class="cell-sub">≈ ${fmtNum(l.qty)} ${escapeHtml(l.uom||'')}</div>` : '';
        const requesterNote = l.note ? `<div class="cell-sub">Catatan: ${escapeHtml(l.note)}</div>` : '';
        return `<tr><td>${escapeHtml(l.itemName)}${requesterNote}</td><td class="num">${primary}${sub}</td></tr>`;
      }).join('')}</tbody></table>
    </div>
    <div style="margin-top:12px;">Status: ${wipStatusTag(first)}</div>
    ${first.status==='ditolak' && first.rejectNote ? `<div class="cell-sub" style="margin-top:6px;">Alasan penolakan: ${escapeHtml(first.rejectNote)}</div>` : ''}
    ${isWipGatePending(first) && canApproveSR(role) ? `<div class="lock-note" style="margin-top:10px;">Permintaan ini harus disetujui Kitchen Leader terlebih dahulu sebelum bisa diproses di sini.</div>` : ''}
    <div class="cell-sub" style="margin-top:10px;">Catatan: Permintaan WIP murni logbook — tidak memengaruhi stok/inventory maupun Stock Opname.</div>
  `;
  const canApprove = canApproveSR(role);
  const canGate = canApproveKitchenGate(role) && role.divisionIds && role.divisionIds.includes(first.divisionId);
  const gatePending = isWipGatePending(first);
  let foot = `<button class="btn btn-outline" onclick="closeModal()">Tutup</button>`;
  if(canDeleteWip(role, first)) foot += `<button class="btn btn-danger-outline" onclick="closeModal(); confirmDeleteWip('${docNumber}')">Hapus</button>`;
  if(first.status==='menunggu' && gatePending && canGate){
    foot += `<button class="btn btn-danger-outline" onclick="closeModal(); openRejectWipModal('${docNumber}')">Tolak</button><button class="btn btn-primary" onclick="closeModal(); confirmApproveWipGate('${docNumber}')">Setujui</button>`;
  } else if(first.status==='menunggu' && !gatePending && canApprove){
    foot += `<button class="btn btn-danger-outline" onclick="closeModal(); openRejectWipModal('${docNumber}')">Tolak</button><button class="btn btn-primary" onclick="closeModal(); confirmApproveWip('${docNumber}')">Catat Selesai</button>`;
  }
  openModal('Permintaan WIP ' + docNumber, body, foot);
}

function adRefreshStock(){

  document.getElementById('adStockHint').innerHTML = `Current system quantity: <b>${fmtNum(qty)}</b>`;
  adPreview();
}
function adPreview(){
  const wh = document.getElementById('adLoc').value, itemId = document.getElementById('adItem').value;
  const before = stockQty(wh, itemId);
  const after = parseFloat(document.getElementById('adQty').value);
  const box = document.getElementById('adPreviewBox');
  if(isNaN(after)){ box.innerHTML=''; return; }
  const delta = after - before;
  box.innerHTML = `<div class="stock-hint">Change: <b>${delta>=0?'+':''}${fmtNum(delta)}</b> (${fmtNum(before)} → ${fmtNum(after)})</div>`;
}
async function submitAdjustment(){
  const warehouseId = document.getElementById('adLoc').value;
  const itemId = document.getElementById('adItem').value;
  const after = parseFloat(document.getElementById('adQty').value);
  const reason = document.getElementById('adReason').value.trim();
  const err = document.getElementById('adError');
  if(!itemId){ err.innerHTML = errBox('Select an item.'); return; }
  if(isNaN(after) || after<0){ err.innerHTML = errBox('Enter a valid corrected quantity.'); return; }
  const before = stockQty(warehouseId, itemId);
  const delta = Math.round((after-before)*1000)/1000;
  if(delta===0){ err.innerHTML = errBox('No change from current quantity.'); return; }
  await submitGuarded(err, async ()=>{ await actionAdjustment({warehouseId, itemId, delta, reason}); });
}

    <div class="field"><label>Kode Barang</label><input type="text" id="meKode" value="${escapeHtml(item.kode||'')}" placeholder="${nextItemCode()}"></div>
    <div class="field"><label>Nama Barang</label><input type="text" id="meName" value="${escapeHtml(item.name)}"></div>
    <div class="field"><label>Kategori</label><select id="meCategory">${ITEM_CATEGORIES.map(c=>`<option value="${c}" ${c===item.category?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="two-col">
      <div class="field"><label>Satuan</label><select id="meUom" onchange="updateSmallUnitHint('me')">${uomSelectOptions(item.uom)}</select></div>
      <div class="field"><label>Harga/Satuan</label><input type="text" inputmode="numeric" id="mePrice" value="${item.lastPrice ? Number(item.lastPrice).toLocaleString('id-ID') : ''}" placeholder="0" oninput="formatPriceInput(this); updateSmallUnitHint('me');"></div>
    </div>
    ${priceCalcHtml('me', item.uom)}
    <div class="two-col">
      <div class="field"><label>Satuan Kecil</label><select id="meSmallUnit" onchange="updateSmallUnitHint('me')">${uomSelectOptions(item.smallUnit||item.uom)}</select></div>
      <div class="field"><label>Konversi (1 Satuan = ? Satuan Kecil)</label><input type="number" id="meConversionQty" inputmode="decimal" min="0" step="any" value="${item.conversionQty||1}" oninput="updateSmallUnitHint('me')"></div>
    </div>
    <div class="cell-sub" id="meSmallUnitHint" style="margin-top:-8px; margin-bottom:14px;"></div>
    <div class="field"><label>Reorder Level</label><input type="number" id="meReorder" inputmode="decimal" min="0" step="any" value="${item.reorderLevel||0}"></div>
  `;
  const foot = `<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="submitEditItem('${itemId}')">Simpan Perubahan</button>`;
  openModal('Edit Barang', body, foot);
  updateSmallUnitHint('me');
}
async function submitEditItem(itemId){
  const kode = document.getElementById('meKode').value.trim(), name = document.getElementById('meName').value.trim();
  const category = document.getElementById('meCategory').value, uom = document.getElementById('meUom').value.trim() || 'pcs';
  const price = parsePriceInput(document.getElementById('mePrice').value), reorderLevel = parseFloat(document.getElementById('meReorder').value) || 0;
  const smallUnit = document.getElementById('meSmallUnit').value.trim() || uom;
  const conversionQty = parseFloat(document.getElementById('meConversionQty').value) || 1;
  const err = document.getElementById('meError');
  if(!name){ err.innerHTML = errBox('Item name is required.'); return; }
  await submitGuarded(err, async ()=>{ await actionEditItemMaster(itemId, {kode, name, category, uom, price, reorderLevel, smallUnit, conversionQty}); });
}

/* --- Bulk import --- */
function downloadTemplate(){
  const wsData = [['Nama Barang','Kode Barang','Kategori','Satuan','Harga','Reorder Level'], ['cth. Beras Premium 5kg','INV-0001', ITEM_CATEGORIES[0], 'kg', 65000, 10]];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{wch:28},{wch:14},{wch:20},{wch:10},{wch:10},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Barang');
  XLSX.writeFile(wb, 'template-barang.xlsx');
}
let importRows = [];
function openImportModal(){
  if(!canEditMaster(currentRole())) return;
  importRows = [];
  const body = `
    <div id="impError"></div>
    <div class="lock-note">Kolom wajib: Nama Barang, Kode Barang, Kategori, Satuan, Harga, Reorder Level. <a href="#" onclick="downloadTemplate(); return false;" style="color:var(--brand); font-weight:700;">Unduh template</a></div>
    <div class="field"><label>File Excel/CSV</label><input type="file" id="impFile" accept=".xlsx,.xls,.csv" onchange="handleImportFile(event)"></div>
    <div id="impPreview"></div>
  `;
  const foot = `<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="impConfirmBtn" onclick="confirmImport()" disabled>Import</button>`;
  openModal('Import Barang dari Excel', body, foot);
}
function importNormField(row, keys){
  for(const k of Object.keys(row)){ const kk = k.trim().toLowerCase(); if(keys.includes(kk)) return row[k]; }
  return '';
}
function handleImportFile(e){
  const file = e.target.files[0];
  const err = document.getElementById('impError'), preview = document.getElementById('impPreview'), confirmBtn = document.getElementById('impConfirmBtn');
  err.innerHTML=''; preview.innerHTML=''; confirmBtn.disabled = true;
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(json.length===0){ err.innerHTML = errBox('File is empty or unreadable.'); return; }
      importRows = json.map(row=>{
        const name = String(importNormField(row, ['product name','nama barang','name'])).trim();
        const kode = String(importNormField(row, ['product code','kode barang','kode','sku'])).trim();
        const catRaw = String(importNormField(row, ['category','kategori'])).trim();
        const uom = String(importNormField(row, ['satuan','uom'])).trim() || 'pcs';
        const priceRaw = importNormField(row, ['harga','price','unit price']);
        const reorderRaw = importNormField(row, ['reorder level','reorder']);
        const category = ITEM_CATEGORIES.find(c=>c.toLowerCase()===catRaw.toLowerCase()) || catRaw || ITEM_CATEGORIES[0];
        return { name, kode, category, uom, price: parseFloat(priceRaw)||0, reorderLevel: parseFloat(reorderRaw)||0, valid: !!name };
      });
      const validCount = importRows.filter(r=>r.valid).length;
      preview.innerHTML = `<div class="lock-note">${validCount} dari ${importRows.length} baris siap diimpor.</div>
        <div class="table-scroll" style="max-height:220px; overflow-y:auto; border:1px solid var(--border); border-radius:8px;">
          <table><thead><tr><th>Nama</th><th>Kode</th><th>Kategori</th><th>Satuan</th><th class="num">Harga</th><th class="num">Reorder</th></tr></thead>
          <tbody>${importRows.map(r=>`<tr ${!r.valid?'style="opacity:.4;"':''}><td>${escapeHtml(r.name||'—')}</td><td>${escapeHtml(r.kode||'—')}</td><td>${escapeHtml(r.category)}</td><td>${escapeHtml(r.uom)}</td><td class="num">${fmtNum(r.price)}</td><td class="num">${fmtNum(r.reorderLevel)}</td></tr>`).join('')}</tbody></table>
        </div>`;
      confirmBtn.disabled = validCount===0;
      confirmBtn.textContent = 'Import ' + validCount + ' Barang';
    }catch(ex){ err.innerHTML = errBox('Gagal membaca file. Pastikan formatnya .xlsx, .xls, atau .csv.'); }
  };
  reader.readAsArrayBuffer(file);
}
async function confirmImport(){
  const rows = importRows.filter(r=>r.valid);
  if(rows.length===0) return;
  const btn = document.getElementById('impConfirmBtn'), err = document.getElementById('impError');
  btn.disabled = true; btn.textContent = 'Mengimpor…';
  showLoading('Mengimpor barang…');
  try{
    const result = await actionBulkAddItems(rows);
    hideLoading();
    closeModal();
    toast(result.added + ' barang berhasil diimpor' + (result.skipped ? ', ' + result.skipped + ' dilewati (duplikat).' : '.'));
  }catch(e){
    hideLoading();
    err.innerHTML = errBox((e && e.message ? e.message : 'Import terhenti karena kesalahan.') + ' Barang yang sudah masuk tetap tersimpan — cek Barang sebelum mengulang.');
    btn.disabled = false; btn.textContent = 'Import ' + rows.length + ' Barang';
  }
}

/* =========================================================
   AUTH / LOGIN SCREEN
========================================================= */
let demoListOpen = false;
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  if(!dbInitStarted){
    _loadingRevealed = false;
    _loadingStartTime = Date.now();
    document.getElementById('loadingTransition').style.display = 'flex';
    dbInitStarted = true;
    initDb();
    setTimeout(()=>{ if(!_loadingRevealed) revealAppAfterLoading(); }, 6000);
  } else {
    document.getElementById('appRoot').style.display = 'flex';
  }
  render();
  startClock();
}
let clockIntervalStarted = false;
function startClock(){
  if(clockIntervalStarted) return;
  clockIntervalStarted = true;
  updateClock();
  setInterval(updateClock, 1000);
}
function updateClock(){
  const el = document.getElementById('topbarClock');
  if(!el) return;
  const now = new Date();
  const datePart = now.toLocaleDateString('id-ID', {weekday:'long', day:'2-digit', month:'short', year:'numeric'});
  const timePart = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  el.innerHTML = `<div class="clock-date">${datePart}</div><div class="clock-time">${timePart}</div>`;
}
function showLogin(){
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  renderLogin();
}
function toggleDemoList(){ demoListOpen = !demoListOpen; renderLogin(); }
function passwordFieldHtml(id, label, opts){
  opts = opts || {};
  return `<div class="field"><label>${label}</label>
    <div class="password-field">
      <input type="password" id="${id}" placeholder="${opts.placeholder||'••••••••'}" autocomplete="${opts.autocomplete||'current-password'}" ${opts.onEnter?`onkeydown="if(event.key==='Enter') ${opts.onEnter}"`:''}>
      <button type="button" class="password-toggle" tabindex="-1" onclick="togglePasswordField('${id}', this)" aria-label="Tampilkan password">${ICONS.eye}</button>
    </div>
  </div>`;
}
function togglePasswordField(id, btn){
  const input = document.getElementById(id);
  if(!input) return;
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.innerHTML = show ? ICONS.eyeoff : ICONS.eye;
  btn.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
  input.focus();
  if(input.setSelectionRange){ const len = input.value.length; input.setSelectionRange(len, len); }
}
function renderLogin(errorMsg){
  const grouped = {};
  ROLES.forEach(r=>{
    const u = BASE_ACCOUNTS.find(x=>x.roleId===r.id);
    (grouped[r.group] = grouped[r.group]||[]).push(`<div>${escapeHtml(r.name)}</div><div><b>${u.username}</b></div>`);
  });
  const demoRowsHtml = Object.keys(grouped).map(g=>`<div style="margin-top:8px; font-weight:800; color:var(--text);">${g}</div><div class="login-demo-grid">${grouped[g].join('')}</div>`).join('');
  document.getElementById('loginScreen').innerHTML = `
    <img class="login-logo" src="${ALIRE_LOGO_SRC}" alt="Alire">
    <div class="login-card">
      <h1>Masuk</h1>
      <p class="sub">Masukkan username dan password untuk mengakses sistem inventory.</p>
      <div id="loginError">${errorMsg ? `<div class="form-error">${escapeHtml(errorMsg)}</div>` : ''}</div>
      <div class="field"><label>Username</label><input type="text" id="loginUsername" placeholder="mis. receiving" autocomplete="username" onkeydown="if(event.key==='Enter') document.getElementById('loginPassword').focus()"></div>
      ${passwordFieldHtml('loginPassword', 'Password', {autocomplete:'current-password', onEnter:'submitLogin()'})}
      <button class="btn btn-primary" onclick="submitLogin()">Masuk</button>
      <div class="login-demo">
        <button class="login-demo-toggle" onclick="toggleDemoList()">${demoListOpen ? 'Sembunyikan' : 'Lihat'} akun demo</button>
        ${demoListOpen ? `<div class="login-demo-list"><div class="ldl-pass">Password semua akun demo: ${DEMO_PASSWORD}</div>${demoRowsHtml}</div>` : ''}
      </div>
    </div>
  `;
  document.getElementById('loginUsername').focus();
}
function submitLogin(){
  const username = document.getElementById('loginUsername').value;
  const password = document.getElementById('loginPassword').value;
  const match = findUser(username, password);
  if(!match){ renderLogin('Username atau password salah.'); return; }
  authedUsername = match.username; state.role = match.roleId; state.view = 'dashboard';
  localStorage.setItem('inv_auth_user', match.username);
  showApp();
}
function logout(){ localStorage.removeItem('inv_auth_user'); authedUsername = null; showLogin(); }

/* =========================================================
   MAIN RENDER
========================================================= */
const VIEW_PERM = {
  dashboard: canViewDashboard, inventory: canViewInventory, stockopname: canManageGudang,
  receiving: canReceive, items: canViewMasterData, suppliers: canViewSuppliers, locations: canViewMasterData,
  'report-masuk': canViewOpsReports, 'report-keluar': canViewOpsReports, lowstock: canViewOpsReports, 'report-divisi': canViewReports,
  'report-opname': canViewReports, wiprequests: canSeeWipNav, 'report-wip': canSeeWipNav,
};
function defaultViewForRole(role){
  return canViewDashboard(role) ? 'dashboard' : 'storerequests';
}
function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const hasSel = active && typeof active.selectionStart === 'number';
  const selStart = hasSel ? active.selectionStart : null;
  const selEnd = hasSel ? active.selectionEnd : null;

  const role = currentRole();
  const viewPerm = VIEW_PERM[state.view];
  if(viewPerm && !viewPerm(role)) state.view = defaultViewForRole(role);

  renderShell();
  const dispatch = {
    dashboard: renderDashboard, inventory: renderInventory, storerequests: renderStoreRequests, wiprequests: renderWipRequests,
    receiving: renderReceiving, stockopname: renderStokOpname, 'opname-count': renderOpnameCounting,
    items: renderItemsMaster, suppliers: renderSuppliers, locations: renderLocations,
    'report-masuk': renderReportMasuk, 'report-keluar': renderReportKeluar, lowstock: renderLowStock, 'report-divisi': renderReportDivisi,
    'report-opname': renderReportOpname, 'report-wip': renderReportWip,
    setting: renderSetting, 'activity-log': renderActivityLog,
  };
  (dispatch[state.view] || dispatch[defaultViewForRole(role)])();
  if(state.drawerItemId) renderDrawer();

  if(activeId){
    const el = document.getElementById(activeId);
    if(el && typeof el.focus === 'function'){
      el.focus();
      if(selStart !== null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

/* =========================================================
   BOOTSTRAP
========================================================= */
(function boot(){
  initAuthUsers();
  const savedUsername = localStorage.getItem('inv_auth_user');
  const savedAccount = findAccountByUsername(savedUsername);
  if(savedAccount){ authedUsername = savedAccount.username; state.role = savedAccount.roleId; showApp(); }
  else { showLogin(); }
})();
</script>

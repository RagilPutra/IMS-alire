<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alire — Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8F7F4;
    --sidebar-bg:#EFEAE2;
    --nav-active-bg:#E6D9CF;
    --surface:#FFFFFF;
    --surface-2:#F1EEE8;
    --text:#171512;
    --text-secondary:#756F67;
    --text-faint:#A19A8F;
    --border:#E4DED5;
    --border-strong:#D3CABB;
    --brand:#6B3F22;
    --brand-dark:#4E2E19;
    --brand-tint:#F1E7DC;
    --gold:#B48A45;
    --gold-tint:#F5EEE0;
    --success:#357A5B;
    --success-tint:#E9F2ED;
    --warning:#B47722;
    --warning-tint:#FBF1E0;
    --danger:#B33A32;
    --danger-tint:#FAEAE8;
    --radius:7px;
    --radius-sm:5px;
    --font-ui:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-display:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:var(--font-ui); font-size:13.5px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  a{color:inherit;}
  .app{display:flex; min-height:100%;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:216px; flex-shrink:0; background:var(--sidebar-bg); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:0;
    padding-top:env(safe-area-inset-top,0px);
    height:100vh; height:100dvh;
    position:sticky; top:0; align-self:flex-start;
  }
  .brand-row{display:flex; flex-direction:column; align-items:center; gap:8px; padding:24px 18px 20px; text-align:center; border-bottom:1px solid var(--border); margin-bottom:6px;}
  .brand-row img{height:28px; width:auto; display:block;}
  .brand-row .brand-caption{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint);}
  .nav-scroll{flex:1; overflow-y:auto; padding:4px 10px 16px;}
  .nav-section-label{
    font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text);
    padding:16px 10px 6px;
  }
  .nav-section-label:first-child{padding-top:6px;}
  .nav-section-toggle{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    border:none; background:none; appearance:none; -webkit-appearance:none;
    cursor:pointer; font-family:inherit; text-align:left; border-radius:var(--radius-sm);
  }
  .nav-section-toggle:hover{background:var(--surface-2);}
  .nav-section-chevron{font-size:9px; color:var(--text-faint); flex-shrink:0; margin-left:8px; transition:color .12s ease;}
  .nav-section-toggle:hover .nav-section-chevron{color:var(--brand-dark);}
  .nav-section-items{overflow:hidden;}
  .nav-item{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:none; background:none;
    padding:6.5px 10px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; color:var(--text-secondary);
    cursor:pointer; line-height:1.3;
  }
  .nav-item:hover{background:var(--surface-2); color:var(--text);}
  .nav-item.active{background:var(--nav-active-bg); color:var(--brand-dark); font-weight:700;}
  .nav-item svg{width:15px; height:15px; flex-shrink:0; opacity:.8;}
  .nav-badge{margin-left:auto; background:var(--warning); color:#2A1E0C; font-size:10.5px; font-weight:800; border-radius:20px; padding:1px 6px; min-width:16px; text-align:center;}
  .nav-dot-group{margin-left:auto; display:flex; gap:3px; flex-shrink:0;}
  .nav-dot{font-size:10px; font-weight:800; border-radius:20px; padding:1px 6px; min-width:16px; text-align:center;}
  .nav-dot.warning{background:var(--warning); color:#2A1E0C;}
  .nav-dot.danger{background:var(--danger); color:#fff;}
  .sidebar-profile{display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:none; background:none; border-top:1px solid var(--border); padding:13px 18px; cursor:pointer;}
  .sidebar-profile:hover{background:var(--surface-2);}
  .sidebar-profile.active{background:var(--nav-active-bg);}
  .sidebar-profile .sp-text{flex:1; min-width:0;}
  .sidebar-profile .sp-name{font-size:12.5px; font-weight:800; color:var(--text);}
  .sidebar-profile .sp-role{font-size:10.5px; color:var(--text-faint);}
  .sidebar-profile svg{width:15px; height:15px; color:var(--text-faint); flex-shrink:0;}

  /* ---------- Main / Topbar ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--border); padding-top:env(safe-area-inset-top,0px);}
  .topbar-inner{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:20px 28px 16px;}
  .topbar-back{margin-bottom:6px;}
  .topbar-back button{display:inline-flex; align-items:center; gap:5px; border:none; background:none; padding:0; color:var(--text-faint); font-size:11.5px; font-weight:700; cursor:pointer;}
  .topbar-back button:hover{color:var(--brand);}
  .topbar-back button svg{width:12px; height:12px;}
  .page-title{font-family:var(--font-ui); font-size:24px; font-weight:800; letter-spacing:-.01em; line-height:1.1;}
  .page-sub{font-size:12.5px; color:var(--text-secondary); margin-top:3px;}
  .topbar-right{display:flex; align-items:center; gap:10px; position:relative;}
  .topbar-clock{font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; line-height:1.35;}
  .topbar-clock .clock-date{font-size:12px; font-weight:700; color:var(--text-secondary);}
  .topbar-clock .clock-time{font-size:11px; font-weight:600; color:var(--text-faint);}
  .content{padding:20px 28px 60px; max-width:1240px; width:100%;}

  .avatar{width:26px; height:26px; border-radius:50%; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; flex-shrink:0;}
  .avatar.gold{background:var(--gold);}
  .notif-btn{width:42px; height:42px; border:none; background:none; color:var(--text-secondary); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; border-radius:8px;}
  .notif-btn:hover{color:var(--brand);}
  .notif-btn svg{width:27px; height:27px;}
  .notif-count{position:absolute; top:2px; right:2px; background:var(--danger); color:#fff; font-size:9.5px; font-weight:800; border-radius:20px; min-width:14px; height:14px; display:flex; align-items:center; justify-content:center; padding:0 3px; border:2px solid var(--bg);}

  .dropdown-panel{position:absolute; top:calc(100% + 8px); right:0; width:320px; max-width:calc(100vw - 32px); max-height:70vh; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 12px 32px rgba(20,15,8,.14); z-index:30;}
  .dropdown-head{padding:11px 14px; border-bottom:1px solid var(--border); font-size:12px; font-weight:800;}
  .notif-row{padding:10px 14px; border-bottom:1px solid var(--border);}
  .notif-row:last-child{border-bottom:none;}
  .notif-row .nr-top{display:flex; justify-content:space-between; gap:8px; font-size:12px;}
  .notif-row .nr-name{font-weight:700;}
  .notif-row .nr-sub{font-size:11px; color:var(--text-faint); margin-top:2px;}
  .notif-row .nr-actions{display:flex; gap:6px; margin-top:8px;}
  .notif-empty{padding:22px 14px; text-align:center; font-size:12px; color:var(--text-faint);}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex; align-items:center; gap:6px; border:1px solid transparent; border-radius:var(--radius); padding:7px 13px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; line-height:1.2;}
  .btn svg{width:13px; height:13px;}
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-outline{background:var(--surface); color:var(--text); border-color:var(--border-strong);}
  .btn-outline:hover{background:var(--surface-2);}
  .btn-quiet{background:none; color:var(--text-secondary); border-color:transparent;}
  .tab-btn{border:none; background:none; padding:7px 14px; border-radius:20px; font-size:12.5px; font-weight:700; color:var(--text-faint); cursor:pointer; margin-right:2px;}
  .tab-btn:hover{background:var(--surface-2); color:var(--text);}
  .tab-btn.active{background:var(--nav-active-bg); color:var(--brand-dark);}
  .btn-quiet:hover{color:var(--text); background:var(--surface-2);}
  .btn-sm{padding:4.5px 10px; font-size:11.5px; border-radius:5px;}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-danger-outline{background:var(--danger-tint); color:var(--danger); border-color:transparent;}
  .btn-approve{background:var(--success); color:#fff;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .icon-btn{width:27px; height:27px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border-strong); background:var(--surface); border-radius:6px; color:var(--text-secondary); cursor:pointer; flex-shrink:0; padding:0;}
  .icon-btn svg{width:14px; height:14px;}
  .icon-btn:hover{background:var(--surface-2); color:var(--text); border-color:var(--border-strong);}
  .icon-btn.icon-btn-danger:hover{background:var(--danger-tint); color:var(--danger); border-color:var(--danger-tint);}
  .action-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; align-items:center;}

  /* ---------- KPI strip (NOT cards) ---------- */
  .kpi-strip{display:flex; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); margin-bottom:22px; overflow-x:auto;}
  .kpi-cell{flex:1; min-width:190px; padding:15px 20px; border-right:1px solid var(--border);}
  .kpi-cell:last-child{border-right:none;}
  .kpi-label{font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint);}
  .kpi-value{font-family:var(--font-ui); font-size:23px; font-weight:800; letter-spacing:-.01em; margin-top:4px; font-variant-numeric:tabular-nums;}
  .kpi-value.warning{color:var(--warning);}
  .kpi-value.danger{color:var(--danger);}
  .kpi-value.gold{color:var(--gold);}
  .kpi-note{font-size:10.5px; color:var(--text-faint); margin-top:2px; line-height:1.4;}
  .kpi-head{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
  .kpi-icon{width:26px; height:26px; border-radius:6px; background:var(--brand-tint); color:var(--brand); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .kpi-icon svg{width:14px; height:14px;}
  .kpi-icon.gold{background:var(--gold-tint); color:var(--gold);}
  .kpi-icon.warning{background:var(--warning-tint); color:var(--warning);}
  .kpi-icon.danger{background:var(--danger-tint); color:var(--danger);}
  .kpi-progress{display:flex; align-items:center; gap:8px; margin-top:7px;}
  .kpi-progress-track{flex:1; height:5px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
  .kpi-progress-fill{height:100%; background:var(--brand); border-radius:4px;}
  .kpi-progress-pct{font-size:11px; font-weight:700; color:var(--text-secondary); flex-shrink:0;}
  .kpi-compare{font-size:11px; font-weight:800; margin-top:5px; display:flex; align-items:center; gap:4px;}
  .kpi-compare span{font-weight:600; color:var(--text-faint);}
  .kpi-compare.up{color:var(--success);}
  .kpi-compare.down{color:var(--danger);}

  /* ---------- Section (used sparingly, functional grouping only) ---------- */
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:20px; overflow:hidden;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap; background:var(--surface-2);}
  .panel-head h3{margin:0; font-size:13px; font-weight:800;}
  .panel-head .hint{font-size:11.5px; color:var(--text-faint); font-weight:600;}
  .panel-head a.hint{cursor:pointer; text-decoration:none;}
  .panel-head a.hint:hover{color:var(--brand);}
  /* Grand-total figures shown in a panel head (e.g. "Total: Rp65.498.500")
     read as a summary of everything below them, so the number must never be
     smaller than the data rows it's summing -- give it its own size, bigger
     than table body text, while the "Total:" label stays a small caption. */
  .panel-head .panel-total{font-size:11.5px; color:var(--text-faint); font-weight:600;}
  .panel-head .panel-total b{font-size:16px; color:var(--text); font-weight:800; margin-left:4px;}
  .panel-body{padding:0;}

  .two-col-grid{display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start;}
  @media (max-width:980px){ .two-col-grid{grid-template-columns:1fr;} }

  /* ---------- Tables (primary tool, not cards) ---------- */
  .table-scroll{overflow-x:auto; cursor:grab;}
  .table-scroll.dragging-scroll{cursor:grabbing; user-select:none;}
  .table-scroll.dragging-scroll *{user-select:none;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; padding:8px 16px; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-faint); border-bottom:1px solid var(--border);}
  .sort-arrow{display:inline-block; font-size:9.5px; opacity:.45; margin-left:2px;}
  .sort-arrow.active{opacity:1; color:var(--brand); font-weight:800;}
  th:hover .sort-arrow{opacity:.8;}
  th:hover .sort-arrow.active{opacity:1;}
  td{padding:9px 16px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
  tbody tr{cursor:default;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:var(--surface-2);}
  .cell-title{font-weight:700; color:var(--text);}
  .cell-sub{font-size:11px; color:var(--text-faint); margin-top:1px;}
  .empty-row td{padding:34px 16px; text-align:center; color:var(--text-faint); font-size:12.5px;}
  .code-mono{font-variant-numeric:tabular-nums; color:var(--text-secondary); font-size:11.5px;}
  .code-mono svg{width:12px; height:12px; vertical-align:-1px;}
  .attachment-badge{display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; border-radius:5px; background:var(--gold-tint); color:var(--gold); vertical-align:-4px; margin-left:5px;}
  .attachment-badge svg{width:10px; height:10px;}

  /* ---------- Status ---------- */
  .status{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;}
  .status::before{content:''; width:6px; height:6px; border-radius:50%; flex-shrink:0;}
  .status.healthy{color:var(--success);} .status.healthy::before{background:var(--success);}
  .status.low{color:var(--warning);} .status.low::before{background:var(--warning);}
  .status.out{color:var(--danger);} .status.out::before{background:var(--danger);}
  .tag{display:inline-flex; align-items:center; padding:2.5px 8px; border-radius:20px; font-size:10.5px; font-weight:700; white-space:nowrap;}
  .tag-pending{background:var(--warning-tint); color:var(--warning);}
  .tag-approved{background:var(--success-tint); color:var(--success);}
  .tag-rejected{background:var(--danger-tint); color:var(--danger);}
  .tag-kitchen-gate{background:#EDE3F7; color:#7B3FA0;}
  .tag-neutral{background:var(--surface-2); color:var(--text-secondary);}
  .tag-gold{background:var(--gold-tint); color:var(--gold);}

  /* ---------- Filter row ---------- */
  .filter-row{display:flex; gap:8px; padding:11px 16px; flex-wrap:wrap; border-bottom:1px solid var(--border); align-items:center;}
  .loc-filter-strip{display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border);}
  .loc-pill{border:1px solid var(--border-strong); background:var(--surface); padding:7px 14px; border-radius:20px; font-size:12.5px; font-weight:700; color:var(--text-secondary); cursor:pointer;}
  .loc-pill:hover{background:var(--surface-2); color:var(--text);}
  .loc-pill.storage{background:var(--gold-tint); border-color:var(--gold); color:var(--gold);}
  .loc-pill.storage:hover{background:var(--gold-tint); filter:brightness(0.97);}
  .loc-pill.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .loc-pill.active:hover{background:var(--brand); border-color:var(--brand); color:#fff; filter:none;}
  .loc-pill-sep{width:1px; height:18px; background:var(--border); margin:0 3px; flex-shrink:0;}
  .filter-row select, .filter-row input{border:1px solid var(--border-strong); background:var(--surface); color:var(--text); padding:6px 9px; border-radius:6px; font-size:12px; font-weight:600;}
  .filter-row input{min-width:200px;}
  .filter-row input[type=date]{min-width:0; width:142px;}
  .filter-row input.narrow{min-width:90px; width:100px;}
  .filter-row select{min-width:0;}

  /* ---------- Pagination ---------- */
  .pagination-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 16px; flex-wrap:wrap; border-top:1px solid var(--border);}
  .pagination-info{font-size:11.5px; color:var(--text-secondary); font-weight:600;}
  .pagination-pages{display:flex; align-items:center; gap:3px; flex-wrap:wrap;}
  .page-btn{border:1px solid var(--border); background:var(--surface); color:var(--text-secondary); min-width:26px; height:26px; padding:0 5px; border-radius:5px; font-size:11.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .page-btn:hover:not(:disabled){background:var(--surface-2); color:var(--text);}
  .page-btn.active{background:var(--brand); color:#fff; border-color:var(--brand);}
  .page-btn:disabled{opacity:.35; cursor:not-allowed;}
  .page-dots{width:18px; text-align:center; color:var(--text-faint); font-size:11.5px;}

  /* ---------- Bars (stock-by-location, category) ---------- */
  .bar-row{display:flex; align-items:center; gap:12px; padding:9px 16px; border-bottom:1px solid var(--border);}
  .bar-row:last-child{border-bottom:none;}
  .bar-row.clickable{cursor:pointer;}
  .bar-row.clickable:hover{background:var(--surface-2);}
  .bar-name{width:150px; flex-shrink:0; font-size:12.5px; font-weight:700;}
  .bar-track{flex:1; height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; min-width:40px;}
  .bar-fill{height:100%; background:var(--brand); border-radius:4px;}
  .bar-value{width:100px; flex-shrink:0; text-align:right; font-variant-numeric:tabular-nums; font-weight:700; font-size:12.5px;}
  @media (max-width:560px){ .bar-name{width:88px; font-size:11.5px;} .bar-value{width:76px;} }

  .locsum-head{display:flex; align-items:center; gap:10px; padding:9px 16px; border-bottom:1px solid var(--border); font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-faint);}
  .locsum-head span:nth-child(1){width:110px; flex-shrink:0;}
  .locsum-head span:nth-child(2){width:96px; flex-shrink:0; text-align:right;}
  .locsum-head span:nth-child(3){flex:1; text-align:right;}
  .locsum-row{display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--border);}
  .locsum-row:last-child{border-bottom:none;}
  .locsum-row.clickable{cursor:pointer;}
  .locsum-row.clickable:hover{background:var(--surface-2);}
  .locsum-row .ln-name{width:110px; flex-shrink:0; font-size:12.5px; font-weight:700;}
  .locsum-row .ln-value{width:96px; flex-shrink:0; text-align:right; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums;}
  .locsum-row .ln-track{flex:1; height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; min-width:30px;}
  .locsum-row .ln-fill{height:100%; background:var(--brand); border-radius:4px;}
  .locsum-row .ln-pct{width:38px; flex-shrink:0; text-align:right; font-size:11.5px; font-weight:700; color:var(--text-secondary);}
  @media (max-width:560px){
    .locsum-row .ln-name, .locsum-head span:nth-child(1){width:78px; font-size:11.5px;}
    .locsum-row .ln-value, .locsum-head span:nth-child(2){width:74px; font-size:11px;}
  }

  .dash-split{display:grid; grid-template-columns:1fr 1fr;}
  @media (max-width:760px){ .dash-split{grid-template-columns:1fr;} }
  .dash-split-col{min-width:0;}
  .dash-split-col + .dash-split-col{border-left:1px solid var(--border);}

  .dash-split-label{font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-faint); padding:12px 16px 8px;}
  .dash-split-sublabel{font-size:11.5px; color:var(--text-faint); padding:0 16px 12px; margin-top:-6px;}
  .dash-wh-block{margin:0 16px 12px; border:1px solid var(--border); border-radius:8px; overflow:hidden;}

  .dash-wh-parts{padding:2px 12px;}

  /* ---------- Donut chart (Nilai Stok distribution) ---------- */
  .donut-wrap{display:flex; align-items:center; gap:24px; flex-wrap:wrap; padding:4px 16px 16px;}
  .donut{position:relative; width:158px; height:158px; border-radius:50%; flex-shrink:0;}
  .donut-hole{position:absolute; inset:18px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4px 6px; overflow:hidden;}
  .donut-hole-label{font-size:10.5px; color:var(--text-faint); font-weight:700;}
  .donut-hole-value{font-size:16px; font-weight:800; color:var(--text); margin-top:3px; line-height:1.15; max-width:100%; white-space:nowrap;}
  .donut-hole-pct{font-size:11px; color:var(--text-faint); font-weight:600; margin-top:2px;}
  .donut-legend{display:flex; flex-direction:column; gap:9px; flex:1; min-width:170px;}
  .donut-legend-row{display:flex; align-items:center; gap:8px;}
  .donut-legend-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .donut-legend-name{flex:1; font-size:12.5px; color:var(--text-secondary); font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .donut-legend-value{font-size:12.5px; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums; flex-shrink:0;}
  .donut-legend-pct{width:34px; flex-shrink:0; text-align:right; font-size:11.5px; color:var(--text-faint); font-weight:700; font-variant-numeric:tabular-nums;}

  /* ---------- Segmented control ---------- */
  .seg{display:inline-flex; border:1px solid var(--border-strong); border-radius:6px; overflow:hidden;}

  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--brand); color:#fff;}

  /* ---------- Recent movement list ---------- */
  .move-row{display:flex; align-items:flex-start; gap:11px; padding:9px 16px; border-bottom:1px solid var(--border);}
  .move-row.clickable{cursor:pointer;}
  .move-row.clickable:hover{background:var(--surface-2);}
  .move-row:last-child{border-bottom:none;}
  .move-time{width:44px; flex-shrink:0; font-size:11px; color:var(--text-faint); font-variant-numeric:tabular-nums; padding-top:1px;}
  .move-dot{width:6px; height:6px; border-radius:50%; margin-top:5px; flex-shrink:0;}
  .move-dot.in{background:var(--success);} .move-dot.transfer{background:var(--danger);} .move-dot.usage{background:var(--text-faint);} .move-dot.waste{background:var(--danger);} .move-dot.request{background:var(--warning);} .move-dot.adjustment{background:var(--brand);} .move-dot.opname{background:var(--brand);}
  .move-body{flex:1; min-width:0;}
  .move-type{font-size:11px; font-weight:700; color:var(--text-secondary);}
  .move-item{font-size:12.5px; font-weight:700; margin-top:1px;}
  .move-detail{font-size:11.5px; color:var(--text-faint); margin-top:1px;}
  .move-qty{font-size:12px; font-weight:700; flex-shrink:0; font-variant-numeric:tabular-nums; padding-top:1px;}
  .move-qty.pos{color:var(--success);} .move-qty.neg{color:var(--text-secondary);}
  .move-day-divider{padding:8px 16px; font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--text-faint); background:var(--surface-2); border-bottom:1px solid var(--border);}
  .move-day-divider:not(:first-child){border-top:1px solid var(--border);}

  /* ---------- Forms / Modal ---------- */
  .modal-backdrop{position:fixed; inset:0; background:rgba(23,17,10,.42); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--surface); border-radius:12px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 50px rgba(0,0,0,.22);}
  .modal.wide{max-width:900px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 12px; border-bottom:1px solid var(--border);}
  .modal-head h3{margin:0; font-size:14.5px; font-weight:800;}
  .modal-close{border:none; background:var(--surface-2); width:26px; height:26px; border-radius:50%; cursor:pointer; color:var(--text-secondary); font-size:14px; line-height:1;}
  .modal-body{padding:16px 18px 4px;}
  .modal-foot{padding:14px 18px 18px; display:flex; gap:8px; justify-content:flex-end;}
  .field{margin-bottom:12px;}

  .field .desc{font-size:11px; color:var(--text-faint); margin-top:4px;}
  .field input[type=text], .field input[type=number], .field input[type=password], .field input[type=datetime-local], .field select, .field textarea{
    width:100%; border:1px solid var(--border-strong); background:var(--bg); color:var(--text); padding:8px 10px; border-radius:6px; font-size:12.5px; font-weight:600;
  }
  .field input[type=datetime-local]{font-family:inherit; color-scheme:light;}
  .field input[type=datetime-local]::-webkit-calendar-picker-indicator{filter:opacity(0.55); cursor:pointer;}
  .field textarea{resize:vertical; min-height:52px; font-weight:500;}
  .password-field{position:relative;}
  .password-field input[type=password], .password-field input[type=text]{padding-right:34px;}
  .password-toggle{position:absolute; right:3px; top:50%; transform:translateY(-50%); width:26px; height:26px; display:flex; align-items:center; justify-content:center; background:transparent; border:none; border-radius:5px; color:var(--text-faint); cursor:pointer;}
  .password-toggle:hover{color:var(--text-secondary); background:var(--surface-2);}

  .lock-note{background:var(--surface-2); font-size:11px; color:var(--text-secondary); font-weight:600; padding:7px 10px; border-radius:6px; margin-bottom:12px;}
  .mini-link-btn{background:none; border:none; color:var(--brand); font-size:11.5px; font-weight:700; cursor:pointer; text-decoration:underline; padding:0; margin:-4px 0 10px;}
  .item-name-link{cursor:pointer;}
  .item-name-link:hover{color:var(--brand); text-decoration:underline;}
  .price-calc-box{background:var(--surface-2); border-radius:7px; padding:9px 11px; margin-bottom:12px;}
  .price-calc-box .field{margin-bottom:8px;} .price-calc-box .field:last-child{margin-bottom:0;}
  .combo-wrap{position:relative;}
  .combo-list{display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; max-height:200px; overflow-y:auto; background:var(--surface); border:1px solid var(--border-strong); border-radius:8px; box-shadow:0 14px 30px rgba(0,0,0,.14); z-index:70;}
  .combo-item{padding:8px 11px; font-size:12.5px; font-weight:600; cursor:pointer; border-bottom:1px solid var(--border);}
  .combo-item:last-child{border-bottom:none;}
  .combo-item:hover{background:var(--surface-2);}

  /* ---------- Drawer ---------- */
  .drawer-backdrop{position:fixed; inset:0; background:rgba(23,17,10,.3); display:none; z-index:45;}
  .drawer-backdrop.open{display:block;}
  .drawer{position:fixed; top:0; right:0; height:100%; width:420px; max-width:92vw; background:var(--surface); border-left:1px solid var(--border); box-shadow:-16px 0 40px rgba(0,0,0,.14); z-index:46; transform:translateX(100%); transition:transform .18s ease; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px);}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:20px 20px 14px; border-bottom:1px solid var(--border);}
  .drawer-head .dh-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .drawer-title{font-family:var(--font-ui); font-size:18px; font-weight:800;}
  .drawer-sub{font-size:12px; color:var(--text-secondary); margin-top:2px;}
  .drawer-close{border:none; background:var(--surface-2); width:26px; height:26px; border-radius:50%; cursor:pointer; color:var(--text-secondary); font-size:14px; flex-shrink:0;}
  .drawer-body{flex:1; overflow-y:auto; padding:16px 20px 24px;}
  .drawer-stat{margin-bottom:18px;}
  .drawer-stat-label{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint);}
  .drawer-stat-value{font-family:var(--font-ui); font-size:24px; font-weight:800; margin-top:3px; font-variant-numeric:tabular-nums;}
  .drawer-section-label{font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--text-faint); margin:18px 0 8px;}

  .loc-row{display:flex; justify-content:space-between; padding:6px 0; font-size:12.5px; border-bottom:1px solid var(--border);}

  .loc-row .lr-val{font-variant-numeric:tabular-nums; font-weight:700;}
  .loc-row .lr-pct{font-variant-numeric:tabular-nums; font-weight:600; color:var(--text-faint); font-size:11.5px; margin-left:10px;}
  /* Peruntukan breakdown rows (3 columns: name / value / pct) -- give value and

  .dash-wh-parts .loc-row{justify-content:flex-start;}
  .dash-wh-parts .loc-row .lr-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .dash-wh-parts .loc-row .lr-pct{width:36px; flex-shrink:0; text-align:right; margin-left:10px;}
  .dash-total-row{justify-content:flex-start; padding:10px 12px; margin:8px 16px 14px; border-radius:6px;}
  .dash-total-row .lr-name{flex:1; min-width:0; white-space:nowrap;}
  .dash-total-row .lr-val{width:118px; flex-shrink:0; text-align:right;}
  .dash-total-row .lr-pct{width:36px; flex-shrink:0; text-align:right; margin-left:10px; color:var(--text);}

  .drawer-stats-2col{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;}
  .drawer-mini-stats{display:grid; grid-template-columns:1fr 1fr 1fr; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; overflow:hidden;}
  .drawer-mini-stat{padding:9px 10px; text-align:center; border-right:1px solid var(--border);}
  .drawer-mini-stat:last-child{border-right:none;}
  .drawer-mini-stat-label{font-size:9.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-faint); margin-bottom:3px;}
  .drawer-mini-stat-value{font-size:12.5px; font-weight:800; font-variant-numeric:tabular-nums;}
  .loc-row-rich{padding:8px 0; border-bottom:1px solid var(--border);}
  .loc-row-rich:last-child{border-bottom:none;}
  .loc-row-rich .lrr-top{display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px;}
  .loc-row-rich .lrr-name{font-weight:700;}
  .loc-row-rich .lrr-qty{font-variant-numeric:tabular-nums; font-weight:700;}
  .loc-row-rich .lrr-value{font-size:11px; color:var(--text-secondary); font-variant-numeric:tabular-nums;}
  .drawer-activity-row{display:flex; align-items:flex-start; gap:9px; padding:8px 0; border-bottom:1px solid var(--border);}
  .drawer-activity-row.clickable{cursor:pointer; margin:0 -20px; padding:8px 20px; }
  .drawer-activity-row.clickable:hover{background:var(--surface-2);}
  .drawer-activity-row:last-child{border-bottom:none;}
  .drawer-activity-row .da-dot{width:7px; height:7px; border-radius:50%; margin-top:5px; flex-shrink:0;}
  .drawer-activity-row .da-dot.in{background:var(--success);}
  .drawer-activity-row .da-dot.transfer{background:var(--danger);}
  .drawer-activity-row .da-dot.opname{background:var(--brand);}
  .drawer-activity-row .da-body{flex:1; min-width:0;}
  .drawer-activity-row .da-type{font-size:11.5px; font-weight:700;}
  .drawer-activity-row .da-type.in{color:var(--success);}
  .drawer-activity-row .da-type.transfer{color:var(--danger);}
  .drawer-activity-row .da-type.opname{color:var(--brand);}
  .drawer-activity-row .da-detail{font-size:11px; color:var(--text-secondary); margin-top:1px;}
  .drawer-activity-row .da-qty{font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; flex-shrink:0; white-space:nowrap;}
  .drawer-activity-row .da-qty.in{color:var(--success);}
  .drawer-activity-row .da-qty.transfer{color:var(--danger);}
  .drawer-activity-row .da-qty.opname{color:var(--brand);}

  /* ---------- Empty / lock states ---------- */
  .stub-panel{padding:40px 24px; text-align:center; color:var(--text-secondary);}
  .stub-panel .stub-title{font-family:var(--font-ui); font-size:16px; font-weight:800; color:var(--text); margin-bottom:6px;}
  .stub-panel .stub-desc{font-size:12.5px; max-width:420px; margin:0 auto;}

  /* ---------- Toast ---------- */
  #toast-wrap{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); right:18px; z-index:80; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--text); color:var(--bg); padding:10px 15px; border-radius:8px; font-size:12.5px; font-weight:700; box-shadow:0 8px 22px rgba(0,0,0,.2); animation:toastin .18s ease;}
  .toast.err{background:var(--danger);}
  @keyframes toastin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Loading overlay ---------- */
  .loading-overlay{position:fixed; inset:0; background:rgba(20,16,12,0.18); z-index:9999; display:flex; align-items:center; justify-content:center; animation:toastin .12s ease;}
  .loading-box{background:var(--surface); border-radius:10px; padding:16px 24px; display:flex; align-items:center; gap:12px; box-shadow:0 10px 34px rgba(0,0,0,0.22);}
  .loading-spinner{width:18px; height:18px; border:3px solid var(--border); border-top-color:var(--brand); border-radius:50%; animation:loadspin .7s linear infinite; flex-shrink:0;}
  @keyframes loadspin{to{transform:rotate(360deg);}}
  .loading-text{font-size:13px; font-weight:700; color:var(--text);}

  /* ---------- Loading transition (post-login) ---------- */
  .loading-transition{position:fixed; inset:0; background:linear-gradient(160deg, #6B3F22 0%, #47280F 100%); display:flex; align-items:center; justify-content:center; z-index:10000; padding:24px;}
  .loading-transition-inner{max-width:440px; text-align:center;}
  .loading-quote-mark{font-size:52px; line-height:0.4; font-weight:800; color:rgba(255,255,255,0.32); margin-bottom:10px;}
  .loading-quote-text{color:#fff; font-size:19px; font-weight:700; line-height:1.55; letter-spacing:0.01em; margin-bottom:38px;}
  .loading-bar-track{width:200px; height:4px; background:rgba(255,255,255,0.22); border-radius:4px; margin:0 auto; overflow:hidden;}
  .loading-bar-fill{width:35%; height:100%; background:#fff; border-radius:4px; animation:loadingBarSlide 1.3s ease-in-out infinite;}
  @keyframes loadingBarSlide{0%{transform:translateX(-120%);} 55%{transform:translateX(180%);} 100%{transform:translateX(180%);}}

  /* ---------- Login ---------- */
  .login-screen{display:none; min-height:100%; align-items:center; justify-content:center; flex-direction:column; padding:32px 20px; padding-top:calc(32px + env(safe-area-inset-top,0px));}
  .login-logo{height:26px; margin-bottom:28px;}
  .login-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; width:100%; max-width:360px; padding:26px 24px;}
  .login-card h1{margin:0 0 5px; font-family:var(--font-ui); font-size:19px; font-weight:800;}
  .login-card p.sub{margin:0 0 20px; font-size:12.5px; color:var(--text-secondary);}
  .login-card .btn-primary{width:100%; justify-content:center; padding:10px; font-size:13px;}
  .login-demo{margin-top:20px; text-align:center;}
  .login-demo-toggle{background:none; border:none; color:var(--text-faint); font-size:11.5px; font-weight:700; cursor:pointer; text-decoration:underline;}
  .login-demo-list{margin-top:11px; text-align:left; background:var(--surface-2); border-radius:8px; padding:11px 13px; font-size:11px; color:var(--text-secondary); max-width:360px;}
  .login-demo-list .ldl-pass{font-weight:800; color:var(--text); margin-bottom:7px;}
  .login-demo-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 12px;}
  .login-demo-grid b{color:var(--text); font-weight:700;}

  /* ---------- Mobile ---------- */
  .mobile-topnav{display:none;}
  .mobile-sticky-head{display:contents;}
  @media (max-width:900px){
    .app{flex-direction:column;}
    .sidebar{display:none;}
    /* On mobile the pill nav bar sits above the page title/topbar -- stick the
       pair of them together so scrolling down keeps both in view instead of
       the pill bar scrolling away while only the topbar stays put. */
    .mobile-sticky-head{display:block; position:sticky; top:0; z-index:6;}
    .topbar{position:static;}
    .mobile-topnav{display:flex; gap:6px; overflow-x:auto; background:var(--brand-dark); padding:9px 12px; padding-top:calc(9px + env(safe-area-inset-top,0px));}
    .mobile-topnav button{flex-shrink:0; border:none; background:rgba(255,255,255,.1); color:#F1E7DC; padding:7px 12px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer;}
    .mobile-topnav button.active{background:#fff; color:var(--brand-dark);}
    /* Keep title and date/bell on one row on mobile too (like desktop) so

    .topbar-inner{padding:14px 16px; flex-direction:row; align-items:flex-end; gap:10px;}

    .topbar-clock .clock-time{font-size:10px;}
    .content{padding:16px 16px 60px;}
    .two-col-grid{grid-template-columns:1fr;}
    .drawer{width:100%; max-width:100%;}
    table{font-size:11.5px;}
    th, td{padding:8px 10px;}
    .kpi-cell{min-width:46%;}
  }
</style>
</head>

<script>
/* =========================================================
   FIRESTORE-LITE COMPATIBILITY SHIM
   ---------------------------------------------------------
   This app was originally built to run inside a Claude artifact, calling
   claude.use('db') / claude.use('assets') / claude.use('user') to get a
   Firestore-like client. This file re-implements just the slice of that
   API the app actually calls (collection/doc CRUD, where/orderBy/limit
   queries, onSnapshot, the custom ref.acquire() lock, and asset uploads)
   backed by the REST API in src/server.js -- so none of the app's own
   logic below this point had to change.
   ========================================================= */
(function () {
  const APP_KEY = "__APP_KEY__";
  const SNAPSHOT_POLL_MS = 4000;

  async function api(method, url, body, isFormData) {
    const headers = {};
    if (APP_KEY) headers['X-App-Key'] = APP_KEY;
    let payload = body;
    if (body !== undefined && !isFormData) {
      headers['Content-Type'] = 'application/json';
      payload = JSON.stringify(body);
    }
    const res = await fetch(url, { method, headers, body: payload });
    if (res.status === 404) return { __notFound: true };
    if (!res.ok) {
      const text = await res.text().catch(() => '');
      throw new Error('API ' + method + ' ' + url + ' failed: ' + res.status + ' ' + text);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  function applyWhere(data, clauses) {
    return clauses.every(([field, op, value]) => {
      const v = data[field];
      switch (op) {
        case '==': return v === value;
        case '!=': return v !== value;
        case '<': return v < value;
        case '<=': return v <= value;
        case '>': return v > value;
        case '>=': return v >= value;
        case 'array-contains': return Array.isArray(v) && v.indexOf(value) !== -1;
        case 'in': return Array.isArray(value) && value.indexOf(v) !== -1;
        case 'not-in': return Array.isArray(value) && value.indexOf(v) === -1;
        default: return true;
      }
    });
  }

  function makeSnapshot(rows) {
    return {
      docs: rows.map(r => ({
        id: r.id,
        exists: true,
        data: () => r.data,
      })),
      empty: rows.length === 0,
      size: rows.length,
    };
  }

  class CollectionRef {
    constructor(col, wheres, order, lim) {
      this._col = col;
      this._wheres = wheres || [];
      this._order = order || null;
      this._limit = lim || null;
    }
    where(field, op, value) {
      return new CollectionRef(this._col, this._wheres.concat([[field, op, value]]), this._order, this._limit);
    }
    orderBy(field, direction) {
      return new CollectionRef(this._col, this._wheres, { field, direction: direction || 'asc' }, this._limit);
    }
    limit(n) {
      return new CollectionRef(this._col, this._wheres, this._order, n);
    }
    async _fetchRows() {
      const rows = await api('GET', '/api/collections/' + encodeURIComponent(this._col));
      let filtered = this._wheres.length ? rows.filter(r => applyWhere(r.data, this._wheres)) : rows.slice();
      if (this._order) {
        const { field, direction } = this._order;
        filtered.sort((a, b) => {
          const av = a.data[field], bv = b.data[field];
          if (av === bv) return 0;
          const cmp = av < bv ? -1 : 1;
          return direction === 'desc' ? -cmp : cmp;
        });
      }
      if (this._limit != null) filtered = filtered.slice(0, this._limit);
      return filtered;
    }
    async get() {
      const rows = await this._fetchRows();
      return makeSnapshot(rows);
    }
    async add(data) {
      const result = await api('POST', '/api/collections/' + encodeURIComponent(this._col), data);
      return { id: result.id };
    }
    onSnapshot(onNext, onError) {
      let stopped = false;
      const tick = async () => {
        if (stopped) return;
        try {
          const rows = await this._fetchRows();
          if (!stopped) onNext(makeSnapshot(rows));
        } catch (e) {
          if (!stopped && onError) onError(e);
        }
      };
      tick();
      const interval = setInterval(tick, SNAPSHOT_POLL_MS);
      return () => { stopped = true; clearInterval(interval); };
    }
  }

  class DocRef {
    constructor(col, id) {
      this._col = col;
      this._id = id;
    }
    async get() {
      const result = await api('GET', '/api/collections/' + encodeURIComponent(this._col) + '/' + encodeURIComponent(this._id));
      if (result.__notFound || result.exists === false) {
        return { exists: false, id: this._id, data: () => undefined };
      }
      return { exists: true, id: this._id, data: () => result.data };
    }
    async set(data) {
      await api('PUT', '/api/collections/' + encodeURIComponent(this._col) + '/' + encodeURIComponent(this._id), data);
    }
    async update(patch) {
      await api('PATCH', '/api/collections/' + encodeURIComponent(this._col) + '/' + encodeURIComponent(this._id), patch);
    }
    async delete() {
      await api('DELETE', '/api/collections/' + encodeURIComponent(this._col) + '/' + encodeURIComponent(this._id));
    }
    onSnapshot(onNext, onError) {
      let stopped = false;
      const tick = async () => {
        if (stopped) return;
        try {
          const snap = await this.get();
          if (!stopped) onNext(snap);
        } catch (e) {
          if (!stopped && onError) onError(e);
        }
      };
      tick();
      const interval = setInterval(tick, SNAPSHOT_POLL_MS);
      return () => { stopped = true; clearInterval(interval); };
    }
    // Custom distributed lock used only by adjustStock(). Not part of
    // Firestore's real API -- backed by /api/lock/acquire and the
    // `locks` Postgres table (see src/lock.js).
    async acquire({ holder, ttlMs }) {
      const path = this._col + '/' + this._id;
      const result = await api('POST', '/api/lock/acquire', { path, holder, ttlMs });
      return { acquired: !!result.acquired };
    }
  }

  const dbClient = {
    collection(name) { return new CollectionRef(name); },
    doc(path) {
      const idx = path.indexOf('/');
      const col = path.slice(0, idx);
      const id = path.slice(idx + 1);
      return new DocRef(col, id);
    },
  };

  const assetsClient = {
    async upload(file, opts) {
      const form = new FormData();
      form.append('file', file);
      form.append('type', (opts && opts.type) || file.type || 'application/octet-stream');
      const result = await api('POST', '/api/upload', form, true);
      return { id: result.id };
    },
  };

  const userClient = {
    async id() { return null; },
    async profiles() { return {}; },
  };

  window.claude = {
    async use(name) {
      if (name === 'db') return dbClient;
      if (name === 'assets') return assetsClient;
      if (name === 'user') return userClient;
      return null;
    },
  };
})();
</script>

/* Peruntukan (allocation) -- only meaningful while stock sits in a Gudang Utama
   location. Once stock physically reaches a division's own warehouse (including
   Staff Meal, which has its own warehouse but no login of its own -- it's
   managed through Kitchen), location alone already tells you who it belongs
   to, so peruntukan no longer applies there. */
// Peruntukan (allocation bucket within Gudang Utama) is a different concept
// from the divisi warehouses (DIRECT_WAREHOUSES) even though the ids line up
// 1:1 -- so it gets its own short display names (Kitchen, Bar, ...) instead
// of reusing "Kitchen Storage" etc., which read as if it were the storage
// location itself. Ids are unchanged (still match DIRECT_WAREHOUSES ids plus
// 'mix') since stock docs are keyed by them; only the label and the display
// order changed (Mix Use moved last).
const PERUNTUKAN_OPTIONS = [
  {id:'kitchen', name:'Kitchen'},
  {id:'bar', name:'Bar'},
  {id:'service', name:'Service'},
  {id:'housekeeping', name:'Housekeeping'},
  {id:'security', name:'Security'},
  {id:'management', name:'Office'},
  {id:'mix', name:'Mix Use'},
];
function isStorageWarehouse(warehouseId){ return STORAGE_WAREHOUSES.some(w=>w.id===warehouseId); }
function peruntukanName(id){ const p = PERUNTUKAN_OPTIONS.find(x=>x.id===id); return p ? p.name : 'Mix Use'; }

/* Built-in demo accounts, one per role. Master can add further accounts, and
   override any account's password, from Setting -- those live in the
   'users' collection (state.customUsers) and take priority over this list. */
const BASE_ACCOUNTS = ROLES.map(r=>({ username: r.id.replace('_',''), roleId: r.id }));
function findAccountByUsername(username){
  const u = (username||'').trim().toLowerCase();
  if(!u) return null;
  const custom = (state.customUsers||[]).find(x=>x.username===u);
  if(custom) return { username:u, roleId:custom.roleId };
  const base = BASE_ACCOUNTS.find(x=>x.username===u);
  return base ? { username:u, roleId:base.roleId } : null;
}
function findUser(username, password){
  const u = (username||'').trim().toLowerCase();
  if(!u) return null;
  const custom = (state.customUsers||[]).find(x=>x.username===u);
  if(custom) return password===custom.password ? { username:u, roleId:custom.roleId } : null;
  const base = BASE_ACCOUNTS.find(x=>x.username===u);
  if(base) return password===DEMO_PASSWORD ? { username:u, roleId:base.roleId } : null;
  return null;
}

function allowedInventoryWarehouseIds(role){
  if(role.kind==='master' || role.kind==='receiving') return null;
  if(role.kind==='kitchen_leader') return ['kitchen','staff_meal'];
  if(role.kind==='divisi') return role.wh ? [role.wh] : []; // one warehouse each, even a kitchen division -- Staff Meal is Kitchen Leader's to see, not every kitchen account's

function rebuildStockIndex(){
  stockIndex = {}; peruntukanIndex = {};
  state.stock.forEach(s=>{
    const key = s.warehouseId+'__'+s.itemId;
    stockIndex[key] = (stockIndex[key]||0) + (s.qty||0);
    if(isStorageWarehouse(s.warehouseId)){
      const p = s.peruntukan || 'mix'; // legacy stock with no tag is treated as unallocated (Mix Use)
      const pkey = key+'__'+p;
      peruntukanIndex[pkey] = (peruntukanIndex[pkey]||0) + (s.qty||0);
    }
  });
}
function rebuildItemIndex(){ itemIndex = {}; state.items.forEach(i=>{ itemIndex[i.id] = i; }); }
function stockQty(warehouseId, itemId){ return stockIndex[warehouseId+'__'+itemId] || 0; }
function stockQtyByPeruntukan(warehouseId, itemId, peruntukan){ return peruntukanIndex[warehouseId+'__'+itemId+'__'+(peruntukan||'mix')] || 0; }

  const stock = totalStock(item.id);
  if(stock <= 0) return 'out';
  if(stock <= (item.reorderLevel||0)) return 'low';

}

function fmtNum(n){ n = Number(n)||0; return n.toLocaleString('id-ID', {maximumFractionDigits:2}); }
function hasSmallUnitConversion(item){ return !!(item && item.conversionQty > 1 && item.smallUnit && item.smallUnit !== item.uom); }
function smallUnitNote(qty, item){
  if(!item || !hasSmallUnitConversion(item)) return '';
  const isWhole = Math.abs(qty - Math.round(qty)) < 0.0001;
  if(isWhole) return '';
  const small = qty * item.conversionQty;
  return '<div class="cell-sub">≈ ' + fmtNum(small) + ' ' + escapeHtml(item.smallUnit) + '</div>';
}
function qtyWithSmallNote(qty, item, uomLabel){
  const uom = uomLabel || (item ? item.uom : '') || '';
  return fmtNum(qty) + ' ' + escapeHtml(uom) + smallUnitNote(qty, item);
}
/* Laporan Stock Opname always reports in the smallest unit an item has (its
   satuan kecil), falling back to the master unit (satuan besar) only when no
   conversion is defined -- so every opname report reads consistently, and a
   per-satuan-kecil price can always sit right after the "Satuan" column. Qty
   in is always expressed in the item's master uom (the same convention used
   everywhere else in this file: stockQty(), item.lastPrice, etc). */
function opnameSmallDisplay(item, qtyInMasterUom){
  if(hasSmallUnitConversion(item)){
    return {
      qty: qtyInMasterUom * item.conversionQty,
      unit: item.smallUnit,
      unitPrice: (item.lastPrice||0) / item.conversionQty,
    };
  }
  return { qty: qtyInMasterUom, unit: (item&&item.uom)||'', unitPrice: (item&&item.lastPrice)||0 };
}
/* A division's display name for Laporan Stock Opname group headers -- the
   underlying warehouse record's name (e.g. "Kitchen Storage") is fine as a
   literal warehouse label elsewhere, but a report group here covers BOTH that

   calling the group "Kitchen Storage" reads as if it were just the one
   physical location. Strip the "Storage" suffix so it reads as the divisi. */
function divisionLabel(nameOrId){
  const w = WAREHOUSES.find(x=>x.id===nameOrId);
  const name = w ? w.name : nameOrId;
  if(name === 'Mix Use') return name;
  return String(name||'').replace(/\s*Storage$/i, '') || name;

function fmtIDR(n){ n = Number(n)||0; return 'Rp' + Math.round(n).toLocaleString('id-ID'); }
/** Formats a price-style text input live with Indonesian thousand-separator dots

}
function getKnownUoms(){

function nowDatetimeLocalValue(){ return toDatetimeLocalValue(); }
function toDatetimeLocalValue(iso){
  const d = iso ? new Date(iso) : new Date();
  const pad = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function fmtTime(iso){ if(!iso) return '—'; return new Date(iso).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
function fmtRelative(iso){
  if(!iso) return '—';
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diffMs/60000);
  if(min < 1) return 'Baru saja';
  if(min < 60) return min + ' menit lalu';
  const hr = Math.floor(min/60);
  if(hr < 24) return hr + ' jam lalu';
  const day = Math.floor(hr/24);
  if(day < 7) return day + ' hari lalu';
  return fmtDate(iso);
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function initials(name){ return (name||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?'; }

/* Connects to the DB and starts listening to 'users' immediately at page
   load -- before login -- so accounts Master added or repasswordded from
   Setting can log in right away, not only after some other account has
   already signed in once. Fire-and-forget: the login form itself never
   waits on this, it just re-reads state.customUsers whenever it happens
   to be ready. */
function initAuthUsers(){
  claude.use('db').then(client=>{
    db = client;
    if(!db) return;
    db.collection('users').onSnapshot(snap=>{
      state.customUsers = snap.docs.map(d=>({id:d.id, ...d.data()}));
      // Self-heal: a saved session for a custom account may have been
      // bounced to the login screen if this hadn't loaded yet -- retry it.
      if(!authedUsername){
        const savedUsername = localStorage.getItem('inv_auth_user');
        const savedAccount = findAccountByUsername(savedUsername);
        if(savedAccount){ authedUsername = savedAccount.username; state.role = savedAccount.roleId; state.view = 'dashboard'; showApp(); }
      } else {
        render();
      }
    }, err=>{});
  }).catch(()=>{ db = null; });
}

async function initDb(){
  try{ db = await claude.use('db'); }catch(e){ db = null; }
  try{ assetsCap = await claude.use('assets'); }catch(e){ assetsCap = null; }
  try{

  }catch(e){}

  if(!db){

  }
  dbReady = true;

  db.collection('items').onSnapshot(snap=>{
    state.items = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    rebuildItemIndex();

    rebuildStockIndex(); render();
    _markLoaded('stock');
  }, err=>{ toast('Gagal memuat data stok.', true); _markLoaded('stock'); });

  db.collection('transactions').orderBy('createdAt','desc').limit(500).onSnapshot(snap=>{
    state.transactions = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
    _markLoaded('transactions');
  }, err=>{ toast('Gagal memuat log aktivitas.', true); _markLoaded('transactions'); });

  db.collection('suppliers').onSnapshot(snap=>{
    state.suppliers = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    render();
  }, err=>{ /* suppliers collection may not exist yet; ignore */ });

  db.collection('opnameSessions').onSnapshot(snap=>{
    state.opnameSessions = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, err=>{ /* opname collection may not exist yet; ignore */ });

  db.collection('opnameDrafts').onSnapshot(snap=>{
    state.opnameDrafts = snap.docs.map(d=>({id:d.id, ...d.data()}));
    // Skip the reactive re-render while the counting page itself is open --
    // that page reads a draft only once, at openOpnameCounting() time, and a
    // full render() here would otherwise fire on every one of our own
    // debounced autosaves echoing back and silently drop focus out of
    // whichever "Jumlah Fisik" input the counter is mid-typing in.
    if(state.view !== 'opname-count') render();
  }, err=>{ /* opnameDrafts collection may not exist yet; ignore */ });

  db.collection('monthlyNetSales').onSnapshot(snap=>{
    state.monthlyNetSales = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, err=>{ /* monthlyNetSales collection may not exist yet; ignore */ });

  render();
}

function stockDocId(warehouseId, itemId, peruntukan){
  return isStorageWarehouse(warehouseId) ? (warehouseId + '__' + itemId + '__' + (peruntukan || 'mix')) : (warehouseId + '__' + itemId);
}
async function adjustStock(warehouseId, itemId, delta, peruntukan){
  const docId = stockDocId(warehouseId, itemId, peruntukan);
  const ref = db.doc('stock/' + docId);
  let acquired = false;
  for(let attempt=0; attempt<8 && !acquired; attempt++){
    const result = await ref.acquire({holder: SESSION_ID, ttlMs: 4000});
    acquired = result.acquired;
    if(!acquired) await new Promise(r=>setTimeout(r, 150 + Math.random()*250));
  }
  if(!acquired){ throw new Error('Stok "' + docId + '" sedang diproses transaksi lain. Coba lagi sebentar.'); }
  const snap = await ref.get();
  const cur = snap.exists ? (snap.data().qty || 0) : 0;
  const next = Math.max(0, Math.round((cur + delta) * 1000) / 1000);
  const doc = { warehouseId, itemId, qty: next, updatedAt: new Date().toISOString() };
  if(isStorageWarehouse(warehouseId)) doc.peruntukan = peruntukan || 'mix';
  await ref.set(doc);
}

async function moveStock(fromWarehouseId, toWarehouseId, itemId, qty){
  await adjustStock(fromWarehouseId, itemId, -qty);
  try{
    await adjustStock(toWarehouseId, itemId, qty);
  }catch(err){
    try{ await adjustStock(fromWarehouseId, itemId, qty); }
    catch(rollbackErr){ throw new Error('Gagal memindahkan stok DAN gagal mengembalikan stok asal. Segera cek manual stok di ' + whName(fromWarehouseId) + ' dan ' + whName(toWarehouseId) + '.'); }
    throw new Error('Gagal memindahkan stok ke ' + whName(toWarehouseId) + ' — stok asal sudah dikembalikan. Coba lagi.');
  }
}

/** Consumes stock from one or more (warehouse, peruntukan) buckets at the source
 * and deposits the combined total at the destination, rolling back whatever was
 * already deducted if any step fails partway through. */
async function moveStockMulti(sourceBuckets, toWarehouseId, itemId){
  const applied = [];
  const totalQty = sourceBuckets.reduce((s,b)=>s+b.qty, 0);
  try{
    for(const bucket of sourceBuckets){
      if(bucket.qty <= 0) continue;
      await adjustStock(bucket.warehouseId, itemId, -bucket.qty, bucket.peruntukan);
      applied.push(bucket);
    }
    await adjustStock(toWarehouseId, itemId, totalQty);
  }catch(err){
    for(const bucket of applied){
      try{ await adjustStock(bucket.warehouseId, itemId, bucket.qty, bucket.peruntukan); }catch(e){}
    }
    throw new Error('Gagal memindahkan stok — bagian yang sudah terlanjur dikurangi sudah dikembalikan. Coba lagi.');
  }
}

function nextItemCode(){
  const existing = new Set(state.items.map(i=>(i.kode||'').toUpperCase()));
  let n = state.items.length + 1, code;
  do{ code = 'INV-' + String(n).padStart(4,'0'); n++; } while(existing.has(code));
  return code;
}

async function getOrCreateItem({name, category, uom}){
  name = name.trim();
  const existing = state.items.find(i=>i.name.toLowerCase() === name.toLowerCase());
  if(existing) return existing;
  const kode = nextItemCode();
  const ref = await db.collection('items').add({ kode, name, category: category || 'Supplies', uom: uom || 'pcs', lastPrice: 0, reorderLevel: 0, createdAt: new Date().toISOString() });
  const created = {id: ref.id, kode, name, category: category || 'Supplies', uom: uom || 'pcs', lastPrice: 0, reorderLevel: 0};
  state.items.push(created); itemIndex[created.id] = created;
  return created;
}
async function setItemLastPrice(itemId, price){
  if(!price || price<=0) return;
  await db.doc('items/' + itemId).update({ lastPrice: price });
}
async function logTx(tx){
  await db.collection('transactions').add({ ...tx, role: state.role, roleName: currentRole().name, createdBy: currentUserName || null, createdAt: tx.createdAt || new Date().toISOString() });
}

function nextDocNumber(prefix){
  const existing = state.transactions.filter(t=>(t.docNumber||'').indexOf(prefix+'-')===0);
  let max = 0;
  existing.forEach(t=>{ const n = parseInt((t.docNumber||'').split('-')[1], 10); if(!isNaN(n) && n>max) max = n; });
  return prefix + '-' + String(max+1).padStart(6,'0');
}

/* --- Penerimaan Barang (multi-item document) --- */
async function actionReceivingDoc(payload){
  const docNumber = nextDocNumber('GR');
  for(const line of payload.lines){

      type:'in', status:'completed', docNumber,

      doNumber: payload.doNumber||'', ppn: payload.ppn||0, attachmentId: payload.attachmentId||null,

    });

/* Editing a receipt that already moved stock means every changed line has to
   have its OLD stock effect reversed before the NEW one is applied -- a line
   kept (has _txId) gets its old (warehouse, item, qty, peruntukan) subtracted
   back out, then the edited amount added in; a brand-new line just adds; a
   line removed during editing also gets its old effect subtracted before its
   transaction record is deleted. adjustStock() itself floors at 0, so this
   can never push a stock record negative even if the goods already moved on
   elsewhere -- worst case the count settles at 0 instead of going negative. */
async function actionEditReceivingDoc(docNumber, payload){
  const existingLines = state.transactions.filter(t=>t.type==='in' && t.docNumber===docNumber);
  if(existingLines.length===0) throw new Error('Penerimaan tidak ditemukan.');
  const first = existingLines[0];
  const keepIds = new Set();
  for(const line of payload.lines){
    const item = await getOrCreateItem({name: line.itemName, category: line.category, uom: line.uom});
    const peruntukan = isStorageWarehouse(line.locationId) ? (line.peruntukan || 'mix') : null;
    if(line._txId){
      keepIds.add(line._txId);
      const orig = existingLines.find(e=>e.id===line._txId);
      if(orig){
        const origPeruntukan = isStorageWarehouse(orig.toWarehouseId) ? (orig.peruntukan||'mix') : null;
        await adjustStock(orig.toWarehouseId, orig.itemId, -(orig.qty||0), origPeruntukan);
      }
      await adjustStock(line.locationId, item.id, line.qty, peruntukan);
      if(line.price>0) await setItemLastPrice(item.id, line.price);
      await db.doc('transactions/'+line._txId).update({
        itemId:item.id, itemName:item.name, uom:item.uom, qty:line.qty,
        price:line.price||0, totalValue:(line.price||0)*line.qty,
        toWarehouseId:line.locationId, toWarehouseName:whName(line.locationId),
        peruntukan: peruntukan,
        supplierId: payload.supplierId||'', supplierName: payload.supplierName||'',
        note: payload.note||'', doNumber: payload.doNumber||'', ppn: payload.ppn||0,
        createdAt: payload.createdAt || (orig ? orig.createdAt : null),
      });
    } else {
      await adjustStock(line.locationId, item.id, line.qty, peruntukan);
      if(line.price>0) await setItemLastPrice(item.id, line.price);
      await logTx({
        type:'in', status:'completed', docNumber,
        itemId:item.id, itemName:item.name, uom:item.uom, qty:line.qty,
        price:line.price||0, totalValue:(line.price||0)*line.qty,
        toWarehouseId:line.locationId, toWarehouseName:whName(line.locationId),
        peruntukan: peruntukan,
        supplierId: payload.supplierId||'', supplierName: payload.supplierName||'', note: payload.note||'',
        doNumber: payload.doNumber||'', ppn: payload.ppn||0, attachmentId: first.attachmentId||null,
        createdAt: payload.createdAt || first.createdAt,
      });
    }
  }
  for(const line of existingLines){
    if(!keepIds.has(line.id)){
      const origPeruntukan = isStorageWarehouse(line.toWarehouseId) ? (line.peruntukan||'mix') : null;
      await adjustStock(line.toWarehouseId, line.itemId, -(line.qty||0), origPeruntukan);
      await db.doc('transactions/'+line.id).delete();
    }
  }
  toast('Penerimaan ' + docNumber + ' berhasil diubah.');
}
